  // Flow speed: a new flow rate changes the playback rate of the running dashes, so they keep their position and never step back
  {
    const p = 'panasonic_heat_pump';
    const st = (lmin) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_pump_flow`]: [lmin, 'l/min'], [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'],
    });
    const card = mount({ preset: 'heishamon', hc_type: 'radiator', animations: 'always' }, hassOf(st('38'))); await wait(20);
    const dash = card.shadowRoot.getElementById('f-vl');
    const anim = () => dash.getAnimations()[0];
    const css = card.shadowRoot.querySelector('style').textContent;
    check(/\.flow\.on \{[^}]*hfc-dash 1s/.test(css) && /\.fan\.on \{[^}]*hfc-spin 1s/.test(css) && /\.impeller\.on \{[^}]*hfc-spin 1s/.test(css),
      'flow dashes, fans and pumps run for 1 s in the stylesheet; the card sets their speed');
    if (!anim()) check(false, 'the flow dashes animate with animations: always');
    else {
      await anim().ready;
      const rate = (lmin) => 1 / Math.min(Math.max(1000 / (lmin * 60), 0.4), 30);
      check(Math.abs(anim().playbackRate - rate(38)) < 0.01, `the playback rate follows the flow rate (${anim().playbackRate.toFixed(3)}, expected ${rate(38).toFixed(3)})`);
      const offset = () => parseFloat(getComputedStyle(dash).strokeDashoffset);
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // A small change of the flow rate, as a heat pump reports it every few seconds. The dashes move by -40 per cycle; a step
      // backwards is a positive change of the offset, a jump a change of more than a few units within two frames.
      const steps = [];
      for (const lmin of ['37.5', '40', '38.3', '36', '38']) {
        anim().pause(); await anim().ready; const before = offset(); const same = anim();
        card.hass = hassOf(st(lmin)); await wait(5);
        await anim().ready;
        steps.push(+(offset() - before).toFixed(2));
        check(anim() === same, `a new flow rate keeps the running animation (${lmin} l/min)`);
        check(Math.abs(anim().playbackRate - rate(+lmin)) < 0.01, `the playback rate follows ${lmin} l/min (${anim().playbackRate.toFixed(3)})`);
        anim().play(); await frames();
      }
      check(steps.every((d) => Math.abs(d) < 0.01), `a new flow rate does not move the dashes (offset changes ${steps.join(', ')})`);
    }
    card.remove();
  }

  // Return under flow: where the return from the hot-water tank crosses the flow pipes, the return lies underneath
  {
    const s = setups.find((x) => x.config.preset === 'heishamon') || setups[0];
    const card = mount(s.config, hassOf(toStates(s.states('heat')), s.registry || {}, null, s)); await wait(20);
    const el = (id) => card.shadowRoot.getElementById(id);
    const before = (a, b) => !!(el(a) && el(b) && el(a).compareDocumentPosition(el(b)) & Node.DOCUMENT_POSITION_FOLLOWING);
    check(['p-vl', 'p-vl-dhw', 'p-vl-buf'].every((id) => before('p-rl-dhw', id) && before('f-rl-dhw', id)),
      'the return from the hot-water tank and its dashes are drawn under the flow, the hot-water flow and the heating flow');
    check(['p-rl-buf', 'p-rl'].every((id) => before(id, 'p-vl')), 'all return pipes of the heat pump are drawn before its flow pipes');
    card.remove();
  }

  // Hot-water return: one crossing. The return from the tank goes down beside the tank and crosses only the heating flow;
  // the valve label above the valve stays between the hot-water flow and the tank, also in the longest language.
  {
    const s = setups.find((x) => x.config.preset === 'heishamon') || setups[0];
    const hass = hassOf(toStates(s.states('heat')), s.registry || {}, null, s);
    const card = mount(s.config, { ...hass, locale: { language: 'sk' }, language: 'sk' }); await wait(20);
    const el = (id) => card.shadowRoot.getElementById(id);
    const rl = el('p-rl-dhw'); const len = rl.getTotalLength(); const pts = [];
    for (let d = 0; d <= len; d += 2) pts.push(rl.getPointAtLength(d));
    const hits = (id) => pts.filter((p) => el(id).isPointInStroke(new DOMPoint(p.x, p.y))).length;
    check(hits('p-vl') === 0 && hits('p-vl-dhw') === 0 && hits('p-vl-buf') > 0,
      `the return from the hot-water tank crosses only the heating flow (flow ${hits('p-vl')}, hot-water flow ${hits('p-vl-dhw')}, heating flow ${hits('p-vl-buf')} points)`);
    const label = el('t-valve'); const b = label.getBBox();
    check(label.textContent === 'Vykurovanie' && b.x >= 424 && b.x + b.width <= 520 && b.y + b.height <= 211,
      `the longest valve label fits between the hot-water flow and the tank, above the return (${label.textContent}: ${[b.x, b.y, b.width, b.height].map(Math.round).join(',')})`);
    const free = ['p-vl-dhw', 'p-rl-dhw', 'p-vl'].every((id) => [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
      .every(([x, y]) => !el(id).isPointInStroke(new DOMPoint(x, y))));
    check(free, 'the corners of the valve label touch no pipe');
    card.remove();
  }

  // Flow speed: a new flow rate changes the playback rate of the running dashes, so they keep their position and never step back

      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // A small change of the flow rate, as a heat pump reports it every few seconds. The dashes move by -40 per cycle; a step

      const steps = [];
      for (const lmin of ['37.5', '40', '38.3', '36', '38']) {
        anim().pause(); await anim().ready; const before = offset(); const same = anim();
        card.hass = hassOf(st(lmin)); await wait(5);
        await anim().ready;
        steps.push(+(offset() - before).toFixed(2));
        check(anim() === same, `a new flow rate keeps the running animation (${lmin} l/min)`);
        check(Math.abs(anim().playbackRate - rate(+lmin)) < 0.01, `the playback rate follows ${lmin} l/min (${anim().playbackRate.toFixed(3)})`);

  }

  // #214: three-way mixer of a mixed circuit; the share is shown as reported, opening/closing are motor pulses
  {
    const ents = { flow: 'sensor.f', return: 'sensor.r', buffer_top: 'sensor.bt', buffer_bottom: 'sensor.bb', hc_flow: 'sensor.hf', hc_return: 'sensor.hr', hc_pump: 'binary_sensor.hp',
      hc_mixer: 'sensor.mix', hc_mixer_opening: 'binary_sensor.open', hc_mixer_closing: 'binary_sensor.close' };
    const st = (share, open, close, pump = 'on') => toStates({ 'sensor.f': ['40', '°C'], 'sensor.r': ['33', '°C'], 'sensor.bt': ['42', '°C'], 'sensor.bb': ['30', '°C'],
      'sensor.hf': ['34', '°C'], 'sensor.hr': ['29', '°C'], 'binary_sensor.hp': pump, 'sensor.mix': share === null ? 'unavailable' : [String(share), '%'],
      'binary_sensor.open': open ? 'on' : 'off', 'binary_sensor.close': close ? 'on' : 'off' });

    // #1 (VR 71 via ebusd): one signed movement on the opening key, above 0 opening, below 0 closing.

    // #214 feedback: the mixer value grows like the other secondary labels on a narrow card.

    check(!two.shadowRoot.getElementById('mixer') && !!two.shadowRoot.getElementById('mixer2') && two.shadowRoot.getElementById('t-hc-mix2').textContent === '40 %'
      && JSON.parse(two._layoutSignature()).mixers === '01', 'circuit 2 carries its own mixer');

    const sec2 = C._formSchema({ hc_count: 2 }).schema.find((g) => g.type === 'expandable' && g.title === HFC_EDITOR.en.sec_hc2);

  // #367: at a standstill the valve arrow shows the position the valve reports; while water flows it follows the path
  {
    const ids = { mode: 'sensor.vm', compressor: 'binary_sensor.vc', flow: 'sensor.vf', return: 'sensor.vr', valve: 'sensor.vv', dhw_top: 'sensor.vd' };
    const st = (mode, comp, valve) => toStates({ 'sensor.vm': mode, 'binary_sensor.vc': comp, 'sensor.vf': ['35', '°C'], 'sensor.vr': ['30', '°C'], 'sensor.vv': valve, 'sensor.vd': ['48', '°C'] });
    const cfg = { mode_map: { Heating: 'heating', DHW: 'dhw', Standby: 'idle' }, entities: ids };
    const card = mount(cfg, hassOf(st('Standby', 'off', 'Tank'))); await wait(20);

    for (const [mode, comp, valve, want] of [['Standby', 'off', 'Tank', 'dhw'], ['Standby', 'off', 'Room', 'heat'], ['Heating', 'on', 'Room', 'heat'], ['DHW', 'on', 'Tank', 'dhw'], ['Heating', 'on', 'Tank', 'dhw']]) {
      card.hass = hassOf(st(mode, comp, valve)); await wait(10);

  }

  // #51: a manually configured boiler is a separate heat generator in the common flow before the existing diverter valve
  {
    const ids = { mode: 'sensor.mode', compressor: 'binary_sensor.compressor', power: 'sensor.hp_power', flow: 'sensor.hp_flow', return: 'sensor.hp_return',
      valve: 'sensor.valve', heater: 'binary_sensor.inline_heater', boiler_state: 'binary_sensor.boiler', boiler_power: 'sensor.boiler_power', boiler_flow: 'sensor.boiler_flow',
      dhw_top: 'sensor.dhw', hc_flow: 'sensor.hc_flow' };
    const state = (hp, boiler, valve = 'Room') => toStates({
      'sensor.mode': hp ? 'Heating' : 'Standby', 'binary_sensor.compressor': hp ? 'on' : 'off', 'sensor.hp_power': [hp ? '1200' : '0', 'W'],
      'sensor.hp_flow': ['36', '°C'], 'sensor.hp_return': ['30', '°C'], 'sensor.valve': valve, 'binary_sensor.inline_heater': 'off',
      'binary_sensor.boiler': boiler ? 'on' : 'off', 'sensor.boiler_power': [boiler ? '8000' : '0', 'W'], 'sensor.boiler_flow': ['52', '°C'],
      'sensor.dhw': ['48', '°C'], 'sensor.hc_flow': ['35', '°C'],
    });
    const cfg = { mode_map: { Heating: 'heating', Standby: 'idle' }, entities: ids };
    const card = mount(cfg, hassOf(state(true, false))); await wait(20);
    const el = (id) => card.shadowRoot.getElementById(id);
    check(el('boiler') && !el('boiler').classList.contains('on') && el('f-boiler').classList.contains('on') && !el('heater-inline').classList.contains('on')
      && card._flowModel().generatorMode === 'hp_only', 'HP-only: water crosses the idle boiler, which stays separate from the inline heater');
    card.hass = hassOf(state(false, true)); await wait(10);
    check(el('boiler').classList.contains('on') && el('f-vl').classList.contains('on') && el('f-vl-buf').classList.contains('on') && !el('hp-box').classList.contains('on')
      && card._flowModel().generatorMode === 'boiler_only', 'boiler-only: the common heating flow runs while the heat pump stays off');
    check(el('t-boiler-power').textContent === '8.0 kW' && el('t-boiler-flow').textContent === '52.0 °C' && /Boiler: running/.test(el('boiler').dataset.a11y),
      `boiler power, flow and accessible state are shown (${el('t-boiler-power').textContent}, ${el('t-boiler-flow').textContent})`);
    card.hass = hassOf(state(true, true)); await wait(10);
    check(card._flowModel().generatorMode === 'both' && el('boiler').classList.contains('on') && el('hp-box').classList.contains('on'), 'simultaneous operation identifies both generators');
    card.hass = hassOf(state(false, true, 'Tank')); await wait(10);
    check(el('f-vl-dhw').classList.contains('on') && !el('f-vl-buf').classList.contains('on'), 'boiler-only hot water follows the existing diverter valve');
    card.remove();
    // Forum, 8 November: the flow label stood in the boiler box. Between the heat pump block and the box it drops its prefix and
    // ends in front of the box, with and without a primary pump.
    for (const extra of [{}, { primary_pump: true }]) {
      const lc = mount({ ...cfg, ...extra }, hassOf(state(true, false))); lc.style.display = 'block'; lc.style.width = '900px'; await wait(30);
      const box = (sel) => (sel.startsWith('.') ? lc.shadowRoot.querySelector(sel) : lc.shadowRoot.getElementById(sel)).getBBox();
      // The right edge is exact (the label ends at the box); the left edge depends on the font, so it is only bounded loosely.
      const vl = box('t-vl'); const hp = box('hp-box'); const bx = box('.boiler-box'); const t = lc.shadowRoot.getElementById('t-vl');
      check(vl.x + vl.width <= bx.x + 0.5 && vl.x > hp.x + hp.width - 20 && !t.querySelector('.pre') && t.textContent === '36.0 °C',
        `with a boiler the flow label ends in front of the boiler box, without its prefix${extra.primary_pump ? ', also with a primary pump' : ''} (${Math.round(vl.x)}–${Math.round(vl.x + vl.width)}, box from ${bx.x}, "${t.textContent}")`);
      lc.remove();
    }

    const noBoiler = mount({ entities: { flow: ids.flow, return: ids.return } }, hassOf(state(false, false))); await wait(10);
    check(!noBoiler.shadowRoot.getElementById('boiler') && JSON.parse(noBoiler._layoutSignature()).boiler === false, 'without boiler entities the existing geometry is unchanged');
    noBoiler.remove();
    const powerOnly = mount({ entities: { flow: ids.flow, return: ids.return, boiler_power: ids.boiler_power } }, hassOf(state(false, true))); await wait(10);
    check(powerOnly._flowModel().generatorMode === 'boiler_only' && powerOnly.shadowRoot.getElementById('boiler').classList.contains('on'), 'boiler power alone can supply the running state');
    powerOnly.remove();
    const boilerGroup = C._formSchema({}).schema.find((g) => g.type === 'expandable' && g.title === HFC_EDITOR.en.sec_boiler);
    check(boilerGroup?.schema.map((f) => f.name).join() === 'boiler_state,boiler_power,boiler_flow'
      && ['boiler_state', 'boiler_power', 'boiler_flow'].every((key) => HFC_DIAGNOSTIC_KEYS.includes(key)), 'editor and diagnostics expose the three manual boiler fields');

    // Review of #229: boiler-only operation supplies the common flow to circuits without their own sensor
    const { hc_flow: _hcFlow, ...noHcFlow } = ids;
    const direct = mount({ ...cfg, entities: noHcFlow }, hassOf(state(false, true))); await wait(10);
    const pc = (id) => direct.shadowRoot.getElementById(id)?.style.getPropertyValue('--pc');
    check(pc('p-hc-vl') === direct._vlColor(52) && pc('p-hc-vl') !== direct._vlColor(36), `boiler-only: a circuit without a flow sensor takes the boiler flow temperature (${pc('p-hc-vl')})`);
    direct.hass = hassOf(state(true, false)); await wait(10);
    check(pc('p-hc-vl') === direct._vlColor(36), 'heat-pump-only: the circuit keeps the heat pump flow temperature');
    direct.remove();

    // Review of #229: without a drawn tank, a valve on DHW keeps the boiler's water out of the heating side
    const { dhw_top: _dhwTop, ...noTank } = ids;
    const tankless = mount({ ...cfg, entities: noTank }, hassOf(state(false, true, 'Tank'))); await wait(10);
    const tf = tankless._flowModel();
    check(tf.boilerRunning && !tf.toHeat && !tf.flowHeat && !tankless.shadowRoot.getElementById('f-vl-buf')?.classList.contains('on'),
      'boiler-only with the valve on DHW and no tank: the heating side stays still');
    tankless.hass = hassOf(state(false, true)); await wait(10);
    check(tankless._flowModel().toHeat, 'boiler-only with the valve on heating and no tank: the heating side flows');
    tankless.remove();

    // Review of #229: a running boiler can charge the tank while the heat pump reports standby, so it excludes standby-loss windows
    const lc = mount(cfg, hassOf(state(false, false))); await wait(10);
    const lossIds = lc._lossIds();
    check(lossIds?.extra.includes('binary_sensor.boiler') && lossIds.extra.includes('sensor.boiler_power'), `boiler state and power are standby-loss exclusions (${lossIds?.extra.join()})`);
    const H = 3600000; const end = Date.now(); const start = end - 48 * H;
    const tank = []; for (let h = 48; h >= 0; h -= 0.2) tank.push({ t: end - h * H, s: (55 - 0.4 * (48 - h)).toFixed(1) });
    const lossHist = (boiler) => ({ 'sensor.mode': [{ t: start, s: 'Standby' }], 'sensor.dhw': tank,
      'binary_sensor.boiler': [{ t: start, s: boiler ? 'on' : 'off' }], 'sensor.boiler_power': [{ t: start, s: boiler ? '8000' : '0' }] });
    const idle = lc._dhwLoss(lossHist(false), lossIds, start, end);
    check(idle && Math.abs(idle.rate - 0.4) < 0.03, `boiler off: the standby slope is measured (${JSON.stringify(idle)})`);
    check(lc._dhwLoss(lossHist(true), lossIds, start, end) === null, 'boiler running all the time: no window counts as standby');
    lc.remove();
  }

  // 22. narrow_focus (#4): on a narrow schematic the key values grow, secondary values move to one line under it or are hidden
  {
    const byName = (name, sub = '') => setups.find((s) => s.name === name && s.sub.startsWith(sub));
    const lambda = byName('Lambda', 'legacy naming'); const ems = byName('Buderus / Bosch'); const ground = byName('Ground source heat pump');
    const cooling = byName('Cooling dew-point safety');
    const hassFor = (s, scen = 'heat') => hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s);
    const at = async (s, px, extra = {}, scen = 'heat') => {
      const c = mount({ ...s.config, ...extra }, hassFor(s, scen)); c.style.display = 'block'; c.style.width = `${px}px`; await wait(40);
      c.hass = hassFor(s, scen); await wait(20); return c;
    };
    const el = (c, id) => c.shadowRoot.getElementById(id);
    const shown = (c, id) => !!el(c, id) && getComputedStyle(el(c, id)).display !== 'none';
    const size = (c, id) => parseFloat(getComputedStyle(el(c, id)).fontSize);
    // invalid values, editor switch and labels
    let threw = false; try { new C().setConfig({ narrow_focus: 'yes' }); } catch (e) { threw = /narrow_focus/.test(e.message); }
    check(threw, 'narrow_focus: a value other than true or false is rejected');
    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    check(C._formSchema({}).schema.flatMap(keysOf).includes('narrow_focus') && Object.keys(HFC_LANGUAGES).every((l) => HFC_EDITOR[l]?.narrow_focus),
      'narrow_focus: switch in the editor, labelled in every built-in language');

    // option off: nothing of the focus view is drawn
    let off = await at(lambda, 400);
    check(!off.shadowRoot.querySelector('ha-card').classList.contains('narrow-focus') && !el(off, 'focus-line') && !el(off, 't-hp-heat')
      && !off.shadowRoot.querySelector('.nf-big, .nf-moved, .nf-tail, .nf-two'), 'narrow_focus off: no focus line, no extra label, no extra class');
    const offSizes = { vl: size(off, 't-vl'), cop: size(off, 't-hp-cop'), target: size(off, 't-room-target') };
    off.remove();

    // option on below 500 px: key values grow, secondary values move or hide
    let c = await at(lambda, 400, { narrow_focus: true });
    check(c.shadowRoot.querySelector('ha-card').classList.contains('narrow-focus'), 'narrow_focus: the card carries the class');
    check(shown(c, 't-hp-heat') && size(c, 't-hp-heat') === 32 && el(c, 't-hp-heat').textContent === '6.3 kW'
      && !shown(c, 't-hp-power') && !shown(c, 't-hp-status'),
    `narrow_focus: heat output alone in the heat pump block, input power and status hidden ("${el(c, 't-hp-heat').textContent}", ${size(c, 't-hp-heat')})`);
    check(size(c, 't-hp-cop') === 32 && size(c, 't-vl') === 30 && size(c, 't-rl') === 30 && size(c, 't-room-target') === 28
      && size(c, 't-hp-cop') > offSizes.cop && size(c, 't-vl') > offSizes.vl && size(c, 't-room-target') > offSizes.target,
    `narrow_focus: COP, flow, return and room target grow (${['t-hp-cop', 't-vl', 't-rl', 't-room-target'].map((id) => size(c, id)).join(', ')})`);
    check(!shown(c, 't-hc') && !shown(c, 't-hc-mode') && !shown(c, 't-src-in') && !shown(c, 't-outdoor-hp')
      && [...c.shadowRoot.querySelectorAll('.src text')].every((t) => getComputedStyle(t).display === 'none'),
    'narrow_focus: circuit label, circuit status, air inlet, outdoor and power source texts leave the drawing');
    const line = el(c, 'focus-line');
    check(getComputedStyle(line).display === 'block' && line.textContent === 'Outdoor 10.4 °C · Air inlet 9.8 °C · PV 820 W · Battery 0 W · Grid 420 W'
      && line.querySelectorAll('span').length === 5, `narrow_focus: one line under the schematic ("${line.textContent}")`);
    check(getComputedStyle(el(c, 't-rl')).transform !== 'none', 'narrow_focus: the return label moves beside the return riser');
    c.remove();
    // only the parts that exist: no power sources, no humidity
    c = await at(ems, 400, { narrow_focus: true });
    check(el(c, 'focus-line').textContent === 'Outdoor 2.8 °C · Air inlet 3.4 °C', `narrow_focus: missing sources are left out ("${el(c, 'focus-line').textContent}")`);
    c.remove();
    // the heat pump is off: a short, smaller status instead of the values
    c = await at(ems, 400, { narrow_focus: true }, 'idle');
    check(el(c, 't-hp-heat').textContent === 'Compressor off' && el(c, 't-hp-heat').classList.contains('off') && size(c, 't-hp-heat') === 22,
      `narrow_focus: an idle heat pump shows the compressor state in smaller type ("${el(c, 't-hp-heat').textContent}")`);
    c.remove();
    // the humidity leaves the target line and joins the line under the schematic; a dew-point warning stays in the drawing
    c = await at(cooling, 400, { narrow_focus: true }, 'defrost');
    const tail = el(c, 't-room-target').querySelector('.nf-tail');
    check(!!tail && getComputedStyle(tail).display === 'none' && /(^| · )Humidity \d+ %$/.test(el(c, 'focus-line').textContent),
      `narrow_focus: humidity moves to the line ("${el(c, 'focus-line').textContent}")`);
    check(el(c, 't-hc').classList.contains('dew-warning') && shown(c, 't-hc'), 'narrow_focus: a dew-point warning stays in the drawing');
    c.remove();
    // several circuits: up to three rows in two lines, the value larger than before
    c = await at(ground, 400, { narrow_focus: true });
    check(el(c, 'house-row2').classList.contains('nf-two') && size(c, 't-house-room') === 26 && size(c, 't-house-room2') === 26
      && !shown(c, 't-outdoor') && /Outdoor -6.5 °C/.test(el(c, 'focus-line').textContent),
    `narrow_focus: two circuits get two-line room rows; the outdoor temperature moves to the line (${size(c, 't-house-room')})`);
    c.remove();

    // 500 px and wider: the option changes nothing that is shown
    for (const s of [lambda, ground]) {
      off = await at(s, 900); c = await at(s, 900, { narrow_focus: true });
      const look = (card) => [...card.shadowRoot.querySelectorAll('#svg text')].filter((t) => t.id !== 't-hp-heat')
        .map((t) => { const cs = getComputedStyle(t); return `${t.id}|${t.textContent}|${cs.display}|${cs.fontSize}|${cs.transform}|${cs.textAnchor}`; }).join('\n');
      check(look(off) === look(c) && !shown(c, 't-hp-heat') && getComputedStyle(el(c, 'focus-line')).display === 'none',
        `narrow_focus: no effect on a wide schematic (${s.name})`);
      off.remove(); c.remove();
    }

    // together with narrow_values: its kept values stay, narrow_focus decides the rest
    c = await at(lambda, 400, { narrow_focus: true, narrow_values: true, hc_return_label: true });
    check(shown(c, 't-buf-bottom') && shown(c, 't-dhw-mode') && !shown(c, 't-hc') && size(c, 't-vl') === 30 && shown(c, 'focus-line'),
      'narrow_focus with narrow_values: tank sub-values stay, circuit label hidden, flow enlarged');
    c.remove();
  }

  // 23. EMS-ESP hot-water target: the setpoint the boiler works to (dhw/settemp) comes before the selected temperature (dhw/seltemp)
  {
    // Bosch Compress in Eco+, the ids and values of a real installation (EMS-ESP MQTT discovery, short names).
    const base = {
      'sensor.boiler_hpactivity': 'Heizen', 'sensor.boiler_hptc1': ['28.2', '°C'], 'sensor.boiler_hptc0': ['25.4', '°C'],
      'sensor.boiler_dhw_curtemp': ['49.8', '°C'],
    };
    const resolve = (extra) => {
      const states = toStates({ ...base, ...extra });
      const registry = Object.fromEntries(Object.keys(states).map((id) => [id, { platform: 'mqtt' }]));
      return { hass: hassOf(states, registry), e: C._resolve({ preset: 'emsesp' }, hassOf(states, registry)).entities };
    };
    const eco = resolve({ 'sensor.boiler_dhw_settemp': ['50.0', '°C'], 'number.boiler_dhw_seltemp': ['48', '°C'] });
    check(eco.e.dhw_target === 'sensor.boiler_dhw_settemp', `EMS-ESP: the active hot-water setpoint before the selected temperature (${eco.e.dhw_target})`);
    const card = mount({ preset: 'emsesp' }, eco.hass); await wait(20);
    check(card._n('dhw_target') === 50, `EMS-ESP: the tank shows the setpoint of the active mode, 50 °C, not the selected 48 °C (${card._n('dhw_target')})`);
    card.remove();
    const older = resolve({ 'sensor.boiler_wwsettemp': ['50.0', '°C'], 'number.boiler_wwseltemp': ['48', '°C'] });
    check(older.e.dhw_target === 'sensor.boiler_wwsettemp', `EMS-ESP: older ww names, the active setpoint wwsettemp first (${older.e.dhw_target})`);
    const selectedOnly = resolve({ 'number.boiler_dhw_seltemp': ['48', '°C'] });
    check(selectedOnly.e.dhw_target === 'number.boiler_dhw_seltemp', `EMS-ESP: without settemp the selected temperature stays the target (${selectedOnly.e.dhw_target})`);
  }

  log.push(`${checks} checks, ${fails.length} failed`);
  document.getElementById('log').textContent = [...log, ...fails.map((f) => `FAIL ${f}`)].join('\n');
  document.getElementById('result').textContent = fails.length ? 'FAIL' : 'PASS';
  document.title = fails.length ? `FAIL: ${fails[0]}` : `PASS: ${checks} checks`;
})().catch((e) => {
  const message = String(e && e.stack || e);
  document.getElementById('result').textContent = 'FAIL'; document.getElementById('log').textContent = message;
  document.title = `FAIL: ${message.split('\n')[0]}`;
});
</script>
</body>
</html>
