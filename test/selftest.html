<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heatpump Flow Card – self-test</title>
<!--
  Runs in a headless browser (see .github/workflows/validate.yml):
  every demo installation in every scenario, broken entity states, edge-case configs,
  preset detection (including gas boilers that must not be taken for heat pumps) and the computed values.
  Result: <pre id="result">PASS</pre> or FAIL with the failed checks.
-->
</head>
<body>
<pre id="result">RUNNING</pre>
<pre id="log"></pre>
<script>
  // Without Home Assistant the editor falls back to the browser language. The checks expect English texts, so the browser
  // language is fixed here: a self-test run in a German (or any other) browser gives the same result as the English CI.
  // Checks of the language fallback set the Home Assistant locale themselves.
  Object.defineProperty(navigator, 'language', { get: () => 'en-US', configurable: true });
  Object.defineProperty(navigator, 'languages', { get: () => ['en-US', 'en'], configurable: true });
</script>
<script src="../dist/heatpump-hydraulic-card.js"></script>
<script src="../demo/setups.js"></script>
<script>
(async () => {
  const C = customElements.get('heatpump-flow-card');
  const fails = []; const log = []; let checks = 0;
  const check = (ok, label) => { checks++; if (!ok) fails.push(label); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // Same state format as the demo: value, [value, unit] or {state, attributes}.
  const toStates = (obj) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { out[k] = { entity_id: k, attributes: {}, ...v }; continue; }
      const [state, unit] = Array.isArray(v) ? v : [v];
      out[k] = { entity_id: k, state, attributes: unit ? { unit_of_measurement: unit } : {} };
    }
    return out;
  };
  const hassOf = (states, registry = {}, energy, setup = {}) => ({
    states, entities: registry, locale: { language: 'en' }, language: 'en',
    callWS: (m) => (m.type === 'recorder/statistic_during_period' ? statChange(setup, m)
      : m.type === 'history/history_during_period' && setup.states ? historySim(setup, m)
      : m.type === 'energy/get_prefs' && energy ? Promise.resolve(energy) : Promise.reject(new Error('n/a'))),
    callService: () => Promise.resolve(),
  });
  const mount = (config, hass) => {
    C._energyPrefs = null; C._energyPrefsValue = null;
    const card = document.createElement('heatpump-flow-card');
    card.setConfig(config);
    document.body.appendChild(card);
    card.hass = hass; card.hass = { ...hass };
    return card;
  };
  // Rendered without an error: the drawing, or the start state of a card without preset and entities (#142).
  const ok = (card) => !card._failed && (!!card.shadowRoot.getElementById('svg') || !!card.shadowRoot.getElementById('start-hint'));

  // 1. every installation and scenario renders, presets are detected
  for (const [i, s] of setups.entries()) {
    for (const [scen] of scenarios) {
      const card = mount(s.config, hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s));
      await wait(5);
      check(ok(card), `render ${i}/${scen}`);
      check(card.shadowRoot.getElementById('chip-mode')?.textContent.trim().length > 0, `mode chip ${i}/${scen}`);
      if (s.config.preset) check(!card._needsBuild, `preset detected ${i}/${scen}`);
      card.remove();
    }
  }

  // 2. broken states never break the card
  const variants = ['unavailable', 'unknown', '', 'abc', '-999', '1e9', 'NaN'];
  for (const [i, s] of setups.entries()) {
    const base = toStates(s.states('heat'));
    for (const v of variants) {
      const broken = {}; for (const [k, o] of Object.entries(base)) broken[k] = { ...o, state: v, attributes: v === '' ? {} : o.attributes };
      const card = mount(s.config, hassOf(broken, s.registry || {}));
      check(ok(card), `broken state "${v}" in setup ${i}`);
      card.remove();
    }
  }

  // 3. edge-case configs
  const edge = [{}, { preset: 'none' }, { entities: { flow: 'sensor.nope', power: 'sensor.nope2' } }, { hc_count: 3, hc2_type: 'radiator' },
    { hc_count: '7' }, { controls: ['switch.nope', { entity: 'select.nope' }, null, 5] }, { details: ['sensor.nope', null] },
    { badges: [{ entity: 'x' }] }, { stats: [{ entity: 'sensor.nope' }] }, { source_type: 'brine' },
    { source_type: 'water', entities: { heater: 'sensor.h', dhw_heater: 'sensor.d' } }, { preset: 'lambda' },
    { tiles: [null, {}, 'spread', { entity: 'sensor.nope' }] }, { preset: 'lambda', tiles: ['cop_heating:year', 'load_classes', 'cost'] }];
  for (const cfg of edge) { const card = mount(cfg, hassOf(toStates({ 'sensor.h': '7', 'sensor.d': 'weird' }))); check(ok(card), `edge config ${JSON.stringify(cfg)}`); card.remove(); }

  // 4. invalid configs give a readable error
  for (const cfg of [{ preset: 'foo' }, { hc_type: 'x' }, { source_type: 'lava' }, null, { tiles: ['nope'] }, { tiles: ['cop_heating:fortnight'] }, { tiles: 'cop_heating' },
    { price: { v: 1 } }, { tiles: [{ key: 'spread', tap_action: 'navigate' }] }, { stats: [{ entity: 'sensor.x', hold_action: true }] },
    { layout: 'huge' }, { actions: [] }, { actions: { mode: 'navigate' } }, { actions: { mode: { tap_action: 'navigate' } } },
    { badges: [{ entity: 'sensor.x', hold_action: 'toggle' }] },
    { program_map: [] }, { program_map: 'eco' }, { sg_ready_map: [] }, { sg_ready_map: { on: 'maybe' } }, { compressor_speed_max: 0 }, { compressor_speed_max: 'fast' },
    { errors: 'sensor.error' }, { error_ok: 'No Error' }, { error_ok: ['No Error', 0] },
    { timeline: 'yes' }, { timeline_hours: 0 }, { timeline_marks: 'yes' }, { timeline_marks: [{ label: 'x' }] }, { timeline_marks: [7] }, { wall_timeout: -1 }, { wall_timeout: 'soon' }, { unit_style: 'tesla' }, { unit_size: 'huge' },
    { animations: 'sometimes' }, { flow_speed: 0 }, { flow_speed: 3.1 }, { source_spread: 'yes' }, { dew_point_margin: -0.1 }, { dew_point_margin: 11 }, { dew_point_margin: 'near' }, { buffer: 'yes' }, { series_buffer: 'yes' }, { primary_pump: 'yes' }, { theme: 'sepia' }, { fullscreen: 'yes' },
    { texts: [] }, { texts: { NL: { title: 'x' } } }, { texts: { nl: { title: 7 } } }, { texts: { nl: { missing_key: 'x' } } },
    { brine_pressure_min: -0.1 }, { hc_pressure_crit: 1.2, hc_pressure_min: 1.0 }, { hc_pressure_min: 3, hc_pressure_max: 2 },
    { tile_sources: ['sensor.x'] }, { tile_sources: { nope: 'sensor.x' } }, { tile_sources: { cost: 'sensor.x' } }, { tile_sources: { spread: 'sensor.x' } },
    { tile_sources: { energy_heating: { fortnight: 'sensor.x' } } }, { tile_sources: { energy_heating: { now: 'sensor.x' } } }, { tile_sources: { energy_heating: { total: 7 } } }]) {
    let threw = false; try { new C().setConfig(cfg); } catch (e) { threw = true; }
    check(threw, `invalid config rejected ${JSON.stringify(cfg)}`);
  }

  // 5. detection: the right preset for each installation, nothing for gas boilers or foreign entities
  check(HFC_PRESETS.heishamon.tested === true, 'HeishaMon preset is marked real-installation tested');
  check(HFC_PRESETS.vicare.tested === true && HFC_PRESETS.ebusd.tested === true, 'ViCare (#282) and ebusd (#295) presets are marked real-installation tested');
  check(HFC_PRESETS.espaltherma.tested === true, 'ESPAltherma preset is marked real-installation tested on an EPRA12EAV3 (#254)');

  // 5-00. Two integrations for one heat pump (#143): the preset with more live core entities wins, a tie keeps the order
  {
    const vaillant = setups.find((s) => s.config.preset === 'vaillant'); const ebusd = setups.find((s) => s.config.preset === 'ebusd');
    const both = hassOf(toStates({ ...vaillant.states('heat'), ...ebusd.states('heat') }), { ...(vaillant.registry || {}), ...(ebusd.registry || {}) });
    const matches = C._presetMatches(both);
    const score = (name) => matches.find((m) => m.name === name)?.score;
    check(matches.map((m) => m.name).join() === 'ebusd,vaillant' && score('ebusd') > score('vaillant'),
      `myPyllant and ebusd: both match, ebusd finds more core entities (${matches.map((m) => `${m.name} ${m.score}`).join(', ')})`);
    check(C.getStubConfig(both).preset === 'ebusd', 'the stub takes the richer match, not the first preset in the list');
    const tie = hassOf(toStates({ 'binary_sensor.vitocal_compressor': 'on', 'sensor.vitocal_refrigeration_circuit_mode': 'heating' }), {
      'binary_sensor.vitocal_compressor': { platform: 'vicare', translation_key: 'compressor' },
      'sensor.vitocal_refrigeration_circuit_mode': { platform: 'open3e', translation_key: 'refrigeration_circuit_mode' },
    });
    const tieMatches = C._presetMatches(tie);
    check(tieMatches.length === 2 && tieMatches[0].score === tieMatches[1].score && C.getStubConfig(tie).preset === 'vicare',
      `ViCare and Open3E with one core entity each: the order of the presets decides (${tieMatches.map((m) => `${m.name} ${m.score}`).join(', ')})`);
    const unavailable = hassOf(toStates({ ...vaillant.states('heat'), ...Object.fromEntries(Object.keys(ebusd.states('heat')).map((id) => [id, 'unavailable'])) }), { ...(vaillant.registry || {}), ...(ebusd.registry || {}) });
    check(C.getStubConfig(unavailable).preset === 'vaillant', 'an integration whose entities are all unavailable does not win');

    // #145: the editor marks detected presets and lists them first; zero, one and two matches
    const options = (opts) => C._formSchema({}, undefined, opts).schema.find((f) => f.name === 'preset').selector.select.options.slice(1);
    const plainOrder = Object.keys(HFC_PRESETS).join();
    let opt = options({});
    check(opt.map((o) => o.value).join() === plainOrder && !opt.some((o) => /Detected|Erkannt/.test(o.label)), 'no match: the preset list keeps its order and marks nothing');
    const ebusdOnly = hassOf(toStates(ebusd.states('heat')), ebusd.registry || {});
    opt = options({ matches: C._presetMatches(ebusdOnly) });
    check(opt[0].value === 'ebusd' && /(Detected|Erkannt) \(\d+ /.test(opt[0].label) && opt.filter((o) => /Detected|Erkannt/.test(o.label)).length === 1
      && opt.slice(1).map((o) => o.value).join() === Object.keys(HFC_PRESETS).filter((k) => k !== 'ebusd').join(), `one match: ebusd first and marked, the others in their order (${opt[0].label})`);
    opt = options({ matches });
    check(opt.slice(0, 2).map((o) => o.value).join() === 'ebusd,vaillant' && opt.slice(0, 2).every((o) => /Detected|Erkannt/.test(o.label)), 'two matches: both first, best first, both marked');
    const real = C._presetMatches; let runs = 0; C._presetMatches = (h) => { runs++; return real.call(C, h); };
    const ed = document.createElement('heatpump-flow-card-editor'); ed.setConfig({ preset: 'vaillant' }); ed.hass = both;
    ed.setConfig({ preset: 'vaillant', title: 'a' }); ed.setConfig({ preset: 'vaillant', title: 'ab' });
    const helper = ed._form?.computeHelper?.({ name: 'preset' }) || '';
    C._presetMatches = real;
    check(runs === 1, `the editor detects the presets once per registry, not on every change (${runs} runs)`);
    check(/also detected here:|ebenfalls erkannt:/i.test(helper) && helper.includes(HFC_PRESETS.ebusd.name) && !helper.includes(`${HFC_PRESETS.vaillant.name}.`), `the helper names the other detected preset (${helper.slice(-80)})`);
    ed.remove();
  }

  // 5-0. No supported integration (#142): the stub has no preset and the card shows its start state, not an error
  {
    const plain = hassOf(toStates({ 'sensor.living_room_temperature': ['21.0', '°C'], 'light.kitchen': 'on' }), {});
    const stubbed = C.getStubConfig(plain);
    check(stubbed.preset === undefined && !Object.keys(stubbed).length, `without a supported integration the stub has no preset (${JSON.stringify(stubbed)})`);
    let card = mount(stubbed, plain); await wait(20);
    const hint = card.shadowRoot.getElementById('start-hint');
    check(!!hint && !card.shadowRoot.getElementById('svg') && !card._failed && /preset/i.test(hint.textContent) && hint.querySelector('a[href*="#quick-start"]'),
      'the card without preset and entities shows the start hint with a link, no drawing and no error');
    card.hass = { ...plain }; await wait(10);
    check(!!card.shadowRoot.getElementById('start-hint') && !card._failed, 'state updates keep the start state without errors');
    card.remove();
    card = mount({ entities: { room: 'sensor.living_room_temperature' } }, plain); await wait(20);
    check(!card.shadowRoot.getElementById('start-hint') && !!card.shadowRoot.getElementById('svg'), 'one mapped entity ends the start state');
    card.remove();
    card = mount({ preset: 'lambda' }, plain); await wait(20);
    check(!card.shadowRoot.getElementById('start-hint') && /preset/i.test(card.shadowRoot.querySelector('.hint')?.textContent || ''), 'an explicit preset that finds nothing keeps its own hint');
    card.remove();
  }

  // 5-0a. No-preset mapping assistant (#149): exact names on one selected device, explicit confirmation, no guesses
  {
    const other = setups.find((s) => s.name === 'Any other heat pump');
    const states = toStates({ ...other.states('heat'),
      'binary_sensor.wp_verdichter': 'on', 'sensor.wp_umschaltventil': 'Heating',
      'sensor.wp_room_temperature': ['21.5', '°C'], 'sensor.wp_heat_output': ['6200', 'W'],
      'sensor.second_vorlauf': ['33', '°C'], 'sensor.hp_thermal_power': ['6200', 'W'] });
    const registry = Object.fromEntries(Object.keys(states).map((id) => [id, { device_id: id === 'sensor.second_vorlauf' ? 'device-second'
      : id === 'sensor.hp_thermal_power' ? 'device-thermal' : 'device-any' }]));
    const h = hassOf(states, registry);
    const proposals = C._assistantProposals(h, 'device-any', {});
    const proposed = Object.fromEntries(proposals.map((p) => [p.key, p.id]));
    check(Object.keys(proposed).sort().join() === ['compressor', 'dhw_top', 'flow', 'mode', 'outdoor', 'power', 'return', 'valve'].sort().join()
      && proposed.flow === 'sensor.wp_vorlauf' && proposed.return === 'sensor.wp_ruecklauf'
      && proposed.power === 'sensor.wp_leistung' && proposed.mode === 'sensor.wp_betriebsart'
      && proposed.compressor === 'binary_sensor.wp_verdichter' && proposed.valve === 'sensor.wp_umschaltventil'
      && proposed.dhw_top === 'sensor.ww_temperatur' && proposed.outdoor === 'sensor.aussen',
      `assistant proposes the eight exact demo mappings and no distractor (${JSON.stringify(proposed)})`);
    check(!Object.values(proposed).includes('sensor.wp_room_temperature') && !Object.values(proposed).includes('sensor.wp_heat_output')
      && !Object.values(proposed).includes('sensor.second_vorlauf'), 'assistant ignores other fields and entities on another device');
    check(!C._assistantProposals(h, 'device-thermal', {}).some((p) => p.key === 'power'),
      'assistant preserves the thermal qualifier and never proposes thermal power as electrical power');
    const ambiguousStates = { ...states, 'sensor.supply_temperature': { entity_id: 'sensor.supply_temperature', state: '34', attributes: { unit_of_measurement: '°C' } } };
    const ambiguousRegistry = { ...registry, 'sensor.supply_temperature': { device_id: 'device-any' } };
    check(!C._assistantProposals(hassOf(ambiguousStates, ambiguousRegistry), 'device-any', {}).some((p) => p.key === 'flow'),
      'assistant omits an ambiguous field instead of choosing one flow sensor');

    let changed = 0; let out;
    const ed = document.createElement('heatpump-flow-card-editor');
    ed.addEventListener('config-changed', (ev) => { changed++; out = ev.detail.config; });
    ed.setConfig({}); ed.hass = h; await wait(20);
    check(ed._form.schema.some((f) => f.name === 'assistant_device'), 'editor shows the assistant device selector without a detected preset');
    ed._changed({ ...ed._form.data, assistant_device: 'device-any' }); await wait(10);
    const boxes = [...ed.querySelectorAll('input[data-hfc-assistant]')];
    check(changed === 0 && boxes.length === 8 && boxes.every((box) => !box.checked) && !ed._config.entities,
      'choosing a device only shows unchecked proposals and writes no configuration');
    boxes.forEach((box) => { box.checked = true; });
    ed._assistant.dispatchEvent(new Event('change', { bubbles: true }));
    const apply = ed.querySelector('[data-hfc-assistant-apply]');
    check(apply && !apply.disabled, 'selecting proposals enables their confirmation');
    apply.click(); await wait(10);
    check(changed === 1 && JSON.stringify(out.entities) === JSON.stringify(proposed), `only confirmed proposals are written (${JSON.stringify(out?.entities)})`);
    let roundTrip = true; try { const card = document.createElement('heatpump-flow-card'); card.setConfig(out); card.hass = h; } catch (err) { roundTrip = false; }
    check(roundTrip, 'assistant configuration survives the card configuration round trip');
    ed.remove();

    const lambda = setups.find((s) => s.config.preset === 'lambda');
    const supported = document.createElement('heatpump-flow-card-editor'); supported.setConfig({});
    supported.hass = hassOf(toStates(lambda.states('heat')), lambda.registry || {}); await wait(20);
    check(!supported._form.schema.some((f) => f.name === 'assistant_device'), 'a detected preset keeps priority and suppresses the assistant');
    supported.remove();
  }
  const stub = (states, registry) => C.getStubConfig(hassOf(toStates(states), registry));
  const expect = { 0: 'lambda', 1: 'lambda', 2: 'vicare', 3: 'vaillant', 4: 'emsesp', 5: 'heishamon', 6: 'emsesp', 8: 'wolf', 9: 'kronoterm', 10: 'ebusd', 11: 'samsung', 12: 'luxtronik', 15: 'stiebel_isg' };
  for (const [i, p] of Object.entries(expect)) {
    const s = setups[i]; const st = stub(s.states('heat'), s.registry || {});
    check(st.preset === p, `stub preset ${i} = ${p} (got ${st.preset})`);
    if (+i === 6) { check(st.source_type === 'brine', 'stub source_type brine'); check(st.hc_count === 2, `stub hc_count 2 (got ${st.hc_count})`); }
    if (+i === 9) check(st.hc_count === 2 && !st.source_type, `Kronoterm stub counts its two loops (${JSON.stringify(st)})`);
    // The controller also reports inactive circuits (hc3 pump "0"), so the stub must not count them.
    if (+i === 10) check(st.hc_count === undefined, `ebusd stub leaves hc_count to the user (got ${st.hc_count})`);
  }
  {
    const s = setups[10]; const hass = hassOf(toStates(s.states('heat')), s.registry);
    const r = C._resolve(s.config, hass);
    check(r.prefix === 'ebusd', `ebusd prefix detected (got ${r.prefix})`);
    check(r.entities.evap_temp === 'sensor.ebusd_hmu_rundataevaporationtemp', 'ebusd: optional entities stay in the selected entity group');
    check(r.entities.hc2_flow === 'sensor.ebusd_ctlv2_hc2flowtemp' && r.entities.hc2_pump === 'sensor.ebusd_ctlv2_hc2pumpstatus', 'ebusd: second circuit from the controller');
    check(r.entities.hc_pressure === 'sensor.ebusd_hmu_flowpressure' && r.entities.hc2_pressure === undefined, 'ebusd: one system pressure, not copied to circuit 2');
    // #1: a mixed circuit's signed mixer movement from the controller draws the mixer; a circuit without it draws none.
    // #189: fallbacks seen on an aroTHERM plus where the selected daemon lacks the usual messages.
    const alt = toStates({
      'sensor.ebus_x_hmu_rundatastatuscode': 'heat_compressor_active', 'sensor.ebus_x_hmu_rundataflowtemp': ['27.2', '°C'],
      'sensor.ebus_x_hmu_rundataelectricpowerconsumption': ['383.6', 'W'], 'sensor.ebus_x_hmu_currentcompressorutil': ['40', '%'],
      'sensor.ebus_x_hmu_rundatafan1speed': ['419', 'rpm'], 'sensor.ebus_x_ctlv2_outsidetemp': ['9.9', '°C'],
      'number.ebus_x_ctlv2_hwctempdesired': ['50', '°C'], 'select.ebus_x_ctlv2_hwcopmode': 'auto',
    });
    const altReg = Object.fromEntries(Object.keys(alt).map((id) => [id, { platform: 'mqtt' }]));
    const ae = C._resolve({ preset: 'ebusd' }, hassOf(alt, altReg)).entities;
    check(ae.power === 'sensor.ebus_x_hmu_rundataelectricpowerconsumption' && ae.compressor === 'sensor.ebus_x_hmu_currentcompressorutil'
      && ae.fan_speed === 'sensor.ebus_x_hmu_rundatafan1speed' && ae.outdoor === 'sensor.ebus_x_ctlv2_outsidetemp'
      && ae.dhw_target === 'number.ebus_x_ctlv2_hwctempdesired' && ae.dhw_mode === 'select.ebus_x_ctlv2_hwcopmode',
    `ebusd fallbacks: power, compressor utilisation, fan, outdoor, hot-water target (number) and mode (select) (${JSON.stringify([ae.power, ae.dhw_target, ae.dhw_mode])})`);
    const withMixer = C._resolve(s.config, hassOf(toStates({ ...s.states('heat'), 'sensor.ebusd_ctlv2_hc2mixermovement': ['-15', '%'] }), s.registry)).entities;
    check(withMixer.hc2_mixer_opening === 'sensor.ebusd_ctlv2_hc2mixermovement' && withMixer.hc_mixer_opening === undefined,
      `ebusd: the controller's mixer movement maps to the circuit's mixer (${withMixer.hc2_mixer_opening} / ${withMixer.hc_mixer_opening})`);
    // #1: the controller and the VR 71 answer the same error message as the heat pump; another daemon's group stays out.
    const errStates = toStates({ ...s.states('heat'), 'sensor.ebusd_hmu_currenterror_error': '-', 'sensor.ebusd_ctlv2_currenterror_error': '-',
      'sensor.ebusd_vr_71_currenterror_error': '-', 'sensor.ebusd_other_hmu_rundatastatuscode': 'standby', 'sensor.ebusd_other_hmu_currenterror_error': '-' });
    const errReg = { ...s.registry, ...Object.fromEntries(Object.keys(errStates).filter((id) => !s.registry[id]).map((id) => [id, { platform: 'mqtt' }])) };
    const er = C._resolve({ ...s.config, prefix: 'ebusd' }, hassOf(errStates, errReg));
    check(JSON.stringify(er.errors) === JSON.stringify(['sensor.ebusd_hmu_currenterror_error', 'sensor.ebusd_ctlv2_currenterror_error', 'sensor.ebusd_vr_71_currenterror_error']),
      `ebusd: errors of the heat pump, the controller and the VR 71, not of another daemon (${JSON.stringify(er.errors)})`);
    // Review of #265: the other daemon stays out even when its status code is missing.
    const { 'sensor.ebusd_other_hmu_rundatastatuscode': _status, ...withoutStatus } = errStates;
    const ns = C._resolve({ ...s.config, prefix: 'ebusd' }, hassOf(withoutStatus, errReg));
    check(!ns.errors.includes('sensor.ebusd_other_hmu_currenterror_error') && ns.errors.length === 3,
      `ebusd: another daemon without its status code stays out of the errors (${JSON.stringify(ns.errors)})`);
    check(r.entities.buffer_top === undefined, 'ebusd: buffer stays unmapped');
    check(r.tiles.env_energy?.total === 'sensor.ebusd_hmu_statenvironmentenergysum', 'ebusd: environmental energy tile');

    const multi = toStates({
      'sensor.ebus_arotherm_hmu_rundatastatuscode': 'standby', 'sensor.ebus_arotherm_hmu_rundataflowtemp': ['31', '°C'],
      'sensor.ebus_arotherm_hmu_rundatareturntemp': ['27', '°C'],
      'sensor.ebusd_arotherm_ebusd_arotherm_hmu_rundatastatuscode': 'heat_compressor_active',
      'sensor.ebusd_arotherm_ebusd_arotherm_hmu_rundataflowtemp': ['35', '°C'],
      'sensor.ebusd_arotherm_ebusd_arotherm_hmu_rundatareturntemp': ['30', '°C'],
      'sensor.ebusd_arotherm_ebusd_arotherm_hmu_currentconsumedpower': ['1.2', 'kW'],
      'sensor.ebusd_arotherm_ebusd_arotherm_hmu_currentyieldpower': ['4.8', 'kW'],
    });
    const multiReg = Object.fromEntries(Object.keys(multi).map((id) => [id, { platform: 'mqtt' }]));
    const grouped = C._resolve({ preset: 'ebusd' }, hassOf(multi, multiReg));
    check(grouped.prefix === 'ebusd_arotherm_ebusd_arotherm'

    for (const [legacy, resource] of Object.entries(aliases)) semantic.registry[byKey(legacy)].unique_id = `demo-pointt:${resource}`;
    const semanticResult = C._resolve(cfg, hassOf(toStates(semantic.states), semantic.registry));
    check(semanticResult.entities.flow === r.entities.flow && semanticResult.entities.return === r.entities.return, 'PointT semantic temperature identities');
    check(semanticResult.entities.energy_total === r.entities.energy_total && semanticResult.tiles.heat.total === r.tiles.heat.total, 'PointT semantic energy identities');

    const lateStates = toStates(fixture.states);
    const lateId = byKey('gateway:outdoor_temperature'); const late = lateStates[lateId]; delete lateStates[lateId];
    const lateHass = hassOf(lateStates, fixture.registry); const lateCard = mount(cfg, lateHass);
    const lateEditor = document.createElement('heatpump-flow-card-editor'); lateEditor.setConfig(cfg); lateEditor.hass = lateHass;
    check(!lateCard._e.outdoor, 'PointT missing state is initially omitted');
    const arrived = { ...lateHass, states: { ...lateStates, [lateId]: late } };
    lateCard.hass = arrived; lateEditor.hass = arrived;
    check(lateCard._e.outdoor === lateId, 'PointT state arriving after registry is mapped without a reload');
    check(lateEditor._fromPreset.outdoor === lateId, 'PointT editor also detects late states');
    const exchangedStates = { ...lateStates, [lateId]: late }; delete exchangedStates[r.entities.flow];
    lateCard.hass = { ...lateHass, states: exchangedStates }; lateEditor.hass = { ...lateHass, states: exchangedStates };
    check(!lateCard._e.flow && lateCard._e.outdoor === lateId && !lateEditor._fromPreset.flow,
      'PointT removal refreshes both card and editor');
    lateCard.hass = lateHass; lateEditor.hass = lateHass;
    check(lateCard._e.flow === r.entities.flow && !lateCard._e.outdoor
      && lateEditor._fromPreset.flow === r.entities.flow && !lateEditor._fromPreset.outdoor,
      'PointT detects exchanged entities even when the matching state count stays the same');
    lateCard.remove(); lateEditor.remove();

    const editor = document.createElement('heatpump-flow-card-editor');
    editor.setConfig(cfg); editor.hass = hass;
    check(editor._form.data.controls.length === 3, 'PointT editor shows the short default control list');
    editor._changed({ ...editor._form.data, title: 'Renamed card' });
    check(editor._config.controls === undefined, 'PointT editor preserves automatic controls on unrelated edits');
    editor._changed({ ...editor._form.data, controls: [] });
    check(Array.isArray(editor._config.controls) && !editor._config.controls.length, 'PointT editor can hide all automatic controls');
    editor.remove();
  }

  // PointT registry loading is local, shared, bounded and isolated by HA connection.
  {
    const fixture = pointtSetup();
    const compact = Object.fromEntries(Object.entries(fixture.registry).map(([id, { unique_id, ...e }]) => [id, e]));
    const entries = Object.entries(fixture.registry).map(([entity_id, e]) => ({ entity_id, ...e }));
    const cfg = { preset: 'bosch_buderus_heating', power_sources: 'manual', tiles: [] };
    let requests = 0; let finish;
    const pending = new Promise((resolve) => { finish = resolve; });
    const hass = { ...hassOf(toStates(fixture.states), compact), connection: {}, callWS: (m) => {
      if (m.type !== 'config/entity_registry/list') return Promise.reject(new Error('Unexpected request'));
      requests++; return pending;
    } };
    check(C.getStubConfig(hass).preset === cfg.preset, 'PointT offered from compact registry before loading unique ids');
    const a = mount(cfg, hass); const b = mount(cfg, hass);
    const editor = document.createElement('heatpump-flow-card-editor'); editor.setConfig(cfg); editor.hass = hass;
    await wait(5);
    check(requests === 1 && a._needsBuild, 'PointT card and editor share one pending registry request');
    finish(entries); await wait(20);
    check(!a._needsBuild && !b._needsBuild && !!a._e.flow, 'PointT automatically rebuilds after registry arrives');
    check(editor._fromPreset.flow === a._e.flow, 'PointT editor refreshes after registry arrives');
    for (let n = 0; n < 5; n++) a.hass = { ...hass };
    await wait(5);
    check(requests === 1, 'PointT ordinary polling does not reload the registry');
    const builtCard = a.shadowRoot.querySelector('ha-card');
    a.hass = { ...hass, entities: { ...compact } }; await wait(20);
    check(requests === 2, 'PointT a compact registry change refreshes stable identities');
    check(a.shadowRoot.querySelector('ha-card') === builtCard && !!a._e.flow,
      'PointT a reloaded registry with the same entries keeps the card as it is (#164)');
    const separate = mount(cfg, { ...hass, connection: {} }); await wait(20);
    check(requests === 3, 'PointT registry cache is isolated between connections');
    a.remove(); b.remove(); editor.remove(); separate.remove();

    let deniedRequests = 0;
    const denied = { ...hass, connection: {}, callWS: () => { deniedRequests++; return Promise.reject(new Error('Unauthorized')); } };
    const manual = Object.keys(fixture.states)[1];
    const c = mount({ ...cfg, entities: { flow: manual }, controls: [] }, denied);
    await wait(20);
    for (let n = 0; n < 5; n++) c.hass = { ...denied };
    check(ok(c) && c._e.flow === manual && c._needsBuild, 'PointT denied registry access leaves manual mappings usable');
    check(deniedRequests === 1, 'PointT failed registry request does not flood HA');
    c.remove();
    const generic = mount({ power_sources: 'manual' }, denied); await wait(5);
    check(deniedRequests === 1, 'Manual cards never request the full registry'); generic.remove();
    const malformed = mount(cfg, { ...hass, connection: {}, callWS: () => Promise.resolve({ invalid: true }) });
    await wait(10);
    check(ok(malformed) && malformed._needsBuild, 'PointT malformed registry response fails without breaking the card');
    malformed.remove();
  }

  // PointT updates do not scan unrelated states, and registry changes still refresh mappings.
  {
    const fixture = pointtSetup(); const cfg = { preset: 'bosch_buderus_heating', power_sources: 'manual', tiles: [] };
    const baseStates = toStates(fixture.states);
    for (let n = 0; n < 2000; n++) baseStates[`sensor.unrelated_${n}`] = { state: '1', attributes: {} };
    let stateScans = 0; let registryScans = 0;
    const registry = new Proxy({ ...fixture.registry }, { ownKeys(target) { registryScans++; return Reflect.ownKeys(target); } });
    const hass = hassOf(baseStates, registry);
    const card = mount(cfg, hass);
    const editor = document.createElement('heatpump-flow-card-editor'); editor.setConfig(cfg); editor.hass = hass;
    await wait(20);
    const initialRegistryScans = registryScans;
    const originalControl = card.shadowRoot.getElementById('ctl-0');
    const flowId = card._e.flow;
    for (let n = 0; n < 4; n++) {
      const states = new Proxy({ ...baseStates, [flowId]: { ...baseStates[flowId], state: String(35 + n) },
        [`sensor.unrelated_new_${n}`]: { state: '1', attributes: {} } },
      { ownKeys(target) { stateScans++; return Reflect.ownKeys(target); } });
      const next = { ...hass, states };
      card.hass = next; editor.hass = next;
    }
    check(stateScans === 0 && registryScans === initialRegistryScans,
      'PointT value updates with thousands of unrelated states do not enumerate states or rescan the registry');
    check(card.shadowRoot.getElementById('ctl-0') === originalControl && card._hass.states[flowId].state === '38',
      'PointT value updates preserve existing controls while displaying the latest state');

    // HA sends a new registry object after a change to any entity; with the same PointT entities nothing is rebuilt, so styles
    // that card-mod put into the shadow root (here a marker) survive (#164)
    const marker = document.createElement('style'); marker.id = 'card-mod-marker'; card.shadowRoot.appendChild(marker);
    const sameRegistry = { ...hass, states: { ...baseStates }, entities: { ...fixture.registry, 'sensor.other_integration': { platform: 'other' } } };
    card.hass = sameRegistry; editor.hass = sameRegistry; await wait(20);
    check(card.shadowRoot.getElementById('ctl-0') === originalControl && card.shadowRoot.getElementById('card-mod-marker'),
      'a new registry object with the same PointT entities does not rebuild the card (card-mod styles survive)');

    const renamedId = 'sensor.renamed_pointt_flow';
    const renamedRegistry = { ...fixture.registry, [renamedId]: fixture.registry[flowId] }; delete renamedRegistry[flowId];
    const renamedStates = { ...baseStates, [renamedId]: baseStates[flowId] }; delete renamedStates[flowId];
    const renamed = { ...hass, entities: renamedRegistry, states: renamedStates };
    card.hass = renamed; editor.hass = renamed; await wait(20);
    check(card._e.flow === renamedId && editor._fromPreset.flow === renamedId,
      'PointT registry replacement with the same entity count refreshes renamed mappings');
    const disabled = { ...renamed, entities: { ...renamedRegistry, [renamedId]: { ...renamedRegistry[renamedId], disabled_by: 'user' } } };
    card.hass = disabled; editor.hass = disabled; await wait(20);
    check(!card._e.flow && !editor._fromPreset.flow, 'PointT registry updates remove newly disabled entities');
    card.hass = renamed; editor.hass = renamed; await wait(20);
    check(card._e.flow === renamedId && editor._fromPreset.flow === renamedId, 'PointT re-enabled entities recover without a reload');
    card.remove(); editor.remove();
  }

  // 5a. Wolf (wolf_smartset): found by translation key with any entity ids, wolflink unchanged, wolf_smartset wins when both exist,
  // Wolf's capitalised state texts (Heizbetrieb, Warmwasser, Ein, Aus, Betrieb) map like the wolflink slugs
  {
    const ws = setups.find((s) => s.name === 'Wolf CHA (wolf_smartset)'); const wl = setups.find((s) => s.name === 'Wolf CHA');
    const regAs = (reg, patch) => Object.fromEntries(Object.entries(reg).map(([id, r]) => [id, { ...r, ...patch }]));
    const without = (o, id) => Object.fromEntries(Object.entries(o).filter(([k]) => k !== id));
    const hassS = (scen) => hassOf(toStates(ws.states(scen)), ws.registry, null, ws);
    const r = C._resolve(ws.config, hassS('heat')); const e = r.entities;
    check(r.ready && r.prefix === '' && HFC_PRESETS.wolf.tested === true, `wolf_smartset detected with prefix '' and marked real-installation tested (${r.prefix} / ${r.ready})`);
    check(C.getStubConfig(hassS('heat')).preset === 'wolf', 'stub config picks the wolf preset for wolf_smartset');
    check(e.mode === 'sensor.heizgerat_betriebsart_heizgerat' && e.status === 'sensor.heizgerat_verdichterstatus' && e.compressor === 'sensor.heizgerat_verdichterfrequenz'
      && e.compressor_speed === 'sensor.heizgerat_aktuelle_leistungsvorgabe_verdichter', `wolf_smartset mode, status and compressor (${e.mode} / ${e.status} / ${e.compressor})`);
    check(e.power === 'sensor.heizgerat_leistungsaufnahme_wp_ehz' && e.heat === 'sensor.heizgerat_aktuelle_sekundarleistung' && e.flow === 'sensor.heizgerat_kesseltemperatur'
      && e.return === 'sensor.heizgerat_rucklauftemperatur' && e.volume === 'sensor.heizgerat_heizkreisdurchfluss' && e.outdoor === 'sensor.heizgerat_aussentemperatur_heizung',
      `wolf_smartset power, heat, flow, return, volume and outdoor (${e.power} / ${e.flow} / ${e.outdoor})`);
    check(e.valve === 'sensor.heizgerat_3_wege_umschaltventil_hz_ww' && e.heater === 'sensor.heizgerat_e_heizung' && e.dhw_top === 'sensor.heizgerat_warmwassertemperatur'
      && e.dhw_target === 'sensor.heizgerat_warmwassersolltemperatur', `wolf_smartset valve, heater, tank and the sensor as DHW target (${e.valve} / ${e.dhw_target})`);
    // without the sensor the number (the configured value) is the fallback
    const numId = 'number.wolf_cha_warmwassersolltemperatur_eingestellt'; const adjId = 'sensor.heizgerat_warmwassersolltemperatur';
    check(C._resolve({ preset: 'wolf' }, hassOf(toStates(without(ws.states('heat'), adjId)), without(ws.registry, adjId))).entities.dhw_target === numId,
      'wolf_smartset DHW target falls back to the number');
    check(e.hc_flow === 'sensor.bedienmodul_bm_2_0_vorlauftemperatur' && e.hc_pump === 'sensor.wolf_cha_mischerkreispumpe' && e.hc_mode === 'sensor.bedienmodul_bm_2_0_mischerkreis_status'
      && e.hc_pressure === 'sensor.heizgerat_anlagendruck' && e.room_target === 'number.bedienmodul_bm_2_0_tagtemperatur_heizung_mischerkreis_1',
      `wolf_smartset circuit: flow, system-tab pump, mode, pressure and the number as room target (${e.hc_pump} / ${e.room_target})`);
    check(e.hours === 'sensor.heizgerat_betriebsstunden_verdichter' && e.aux_hours === 'sensor.heizgerat_betriebsstunden_e_heizung' && e.buffer_top === 'sensor.heizgerat_sammlertemperatur',
      'wolf_smartset hours counters and the manual buffer line');
    check(e.room === undefined && e.program === 'sensor.bedienmodul_bm_2_0_anforderung_mischerkreis', `wolf_smartset: no room sensor, program from the mixer circuit demand (${e.room} / ${e.program})`);
    // one mixer circuit only: a second circuit maps nothing instead of repeating circuit 1 (both branches)
    const two = C._resolve({ ...ws.config, hc_count: 2 }, hassS('heat')).entities;
    const twoL = C._resolve({ ...wl.config, hc_count: 2 }, hassOf(toStates(wl.states('heat')), wl.registry)).entities;
    check(two.hc_flow && !two.hc2_flow && !two.hc2_pump && !two.hc2_mode && twoL.hc_flow && !twoL.hc2_flow && !twoL.hc2_pump && !twoL.hc2_mode,
      `hc_count 2 leaves circuit 2 empty (${two.hc2_flow} / ${twoL.hc2_flow})`);
    check(JSON.stringify(r.errors) === '[]', `wolf_smartset has no fault code, errors stay empty (${JSON.stringify(r.errors)})`);
    check(r.tiles.heat?.yesterday === 'sensor.heizgerat_erzeugte_warmemenge_vortag' && r.tiles.heat?.month === 'sensor.heizgerat_erzeugte_warmemenge_aktueller_monat'
      && r.tiles.heat_heating?.total === 'sensor.heizgerat_energiemenge_hz' && r.tiles.heat_dhw?.total === 'sensor.heizgerat_energiemenge_ww' && r.tiles.hours?.total === e.hours,
      `wolf_smartset heat counter tiles by translation key (${JSON.stringify(r.tiles)})`);
    // entity ids are irrelevant: rename every entity
    const rename = (o) => Object.fromEntries(Object.entries(o).map(([id, v]) => [id.replace('.', '.x_'), v]));
    const x = C._resolve({ preset: 'wolf' }, hassOf(toStates(rename(ws.states('heat'))), rename(ws.registry)));
    check(x.ready && x.entities.mode === 'sensor.x_heizgerat_betriebsart_heizgerat' && x.entities.room_target === 'number.x_bedienmodul_bm_2_0_tagtemperatur_heizung_mischerkreis_1',
      `wolf_smartset with arbitrary entity ids (${x.entities.mode})`);
    // "Ausgang MKP" is the pump fallback when the system-tab pump is missing (it starts disabled in the integration)
    const mkpId = 'sensor.mischermodul_mm1_ausgang_mkp'; const sysPump = 'sensor.wolf_cha_mischerkreispumpe';
    const m = C._resolve({ preset: 'wolf' }, hassOf(toStates({ ...without(ws.states('heat'), sysPump), [mkpId]: 'Ein' }),
      { ...without(ws.registry, sysPump), [mkpId]: { platform: 'wolf_smartset', translation_key: 'mkp_mixer_circuit_pump' } }));
    check(m.entities.hc_pump === mkpId, `Ausgang MKP as the pump fallback (${m.entities.hc_pump})`);
    // a boiler (no compressor status) and the same keys on another platform are not detected
    const boiler = { 'sensor.heizgerat_kesseltemperatur': ['62', '°C'], 'sensor.heizgerat_aussentemperatur_heizung': ['5', '°C'],
      'sensor.heizgerat_warmwassertemperatur': ['50', '°C'], 'sensor.heizgerat_anlagendruck': ['1.8', 'bar'] };
    check(!detects('wolf', boiler, Object.fromEntries(Object.keys(boiler).map((id) => [id, ws.registry[id]]))), 'wolf_smartset boiler without a compressor status is not a heat pump');
    check(!detects('wolf', ws.states('heat'), regAs(ws.registry, { platform: 'other' })), 'same translation keys on another platform are not Wolf');
    // both installed: wolf_smartset wins; wolflink alone is unchanged
    const both = C._resolve({ preset: 'wolf' }, hassOf(toStates({ ...wl.states('heat'), ...ws.states('heat') }), { ...wl.registry, ...ws.registry }));
    check(both.prefix === '' && both.entities.mode === 'sensor.heizgerat_betriebsart_heizgerat' && both.errors.length === 0, `wolf_smartset wins over wolflink (${both.prefix} / ${both.entities.mode})`);
    const l = C._resolve(wl.config, hassOf(toStates(wl.states('heat')), wl.registry)); const le = l.entities;
    check(l.prefix === 'zuhause' && le.mode === 'sensor.zuhause_operating_mode_heater' && le.hc_pump === 'sensor.zuhause_mkp_mixer_circuit_pump' && le.room_target === 'sensor.zuhause_day_temperature'
      && le.program === 'sensor.zuhause_holiday_mode' && JSON.stringify(l.errors) === '["sensor.zuhause_sub_fault_code"]' && l.tiles.heat_heating?.total === 'sensor.zuhause_energy_amount_htg',
      `wolflink mapping unchanged (${l.prefix} / ${le.hc_pump} / ${le.program} / ${JSON.stringify(l.errors)})`);
    // the entities sit on several HA devices (Heizgerät, Bedienmodul BM-2, the system), so the device option must stay unset:
    // it keeps the heat pump keys but loses the circuit, or fails to detect altogether
    const devReg = Object.fromEntries(Object.entries(ws.registry).map(([id, r]) => [id, { ...r, device_id: id.includes('heizgerat_') ? 'dev-hg' : (id.includes('bm_2_') ? 'dev-bm2' : 'dev-sys') }]));
    const onHg = C._resolve({ preset: 'wolf', device: 'dev-hg' }, hassOf(toStates(ws.states('heat')), devReg));
    check(onHg.ready && onHg.entities.mode && !onHg.entities.hc_flow && !onHg.entities.hc_pump && !onHg.entities.hc_mode && !onHg.entities.room_target && onHg.entities.dhw_target === 'sensor.heizgerat_warmwassersolltemperatur',
      `device: Heizgerät keeps the heat pump and the DHW target sensor but loses the circuit (${onHg.entities.hc_flow} / ${onHg.entities.dhw_target})`);
    check(!C._resolve({ preset: 'wolf', device: 'dev-bm2' }, hassOf(toStates(ws.states('heat')), devReg)).ready, 'device: Bedienmodul is not detected at all');
    // capitalised Wolf texts: the maps are case-insensitive, the four slugged AT/RT mixer states exist in both spellings
    const card = mount(ws.config, hassS('heat')); await wait(20);
    const $ = (id) => card.shadowRoot.getElementById(id);
    const modes = { Heizbetrieb: 'heating', Warmwasser: 'dhw', Abtaubetrieb: 'defrost', Standby: 'idle', 'Aktive Kühlung': 'cooling', Antilegionellenfunktion: 'dhw' };
    Object.entries(modes).forEach(([raw, mode]) => check(card._norm(card._maps.mode, raw) === mode, `wolf_smartset mode ${raw} = ${mode} (got ${card._norm(card._maps.mode, raw)})`));
    const hc = { Heizbetrieb: 'heating', Aus: 'off', Absenkbetrieb: 'heating', 'AT Abschaltung': 'off', 'RT Frostschutz': 'frost', Warmwasservorrang: 'idle', at_abschaltung: 'off' };
    Object.entries(hc).forEach(([raw, mode]) => check(card._norm(card._maps.hc, raw) === mode, `wolf_smartset circuit ${raw} = ${mode} (got ${card._norm(card._maps.hc, raw)})`));
    check($('chip-mode').classList.contains('mode-heat') && $('impeller').classList.contains('on') && !$('heater-inline').classList.contains('on') && $('t-valve').textContent === 'Heating',
      `Heizbetrieb, pump Ein, heater Aus, valve Heizen (${$('t-valve').textContent})`);
    check(/1,200 W → 4\.1 kW/.test($('t-hp-power').textContent), `wolf_smartset kW power and heat (${$('t-hp-power').textContent})`);
    card.remove();
    const still = mount(ws.config, hassOf(toStates({ ...ws.states('heat'), 'sensor.heizgerat_verdichterfrequenz': ['0', 'Hz'], 'sensor.heizgerat_leistungsaufnahme_wp_ehz': ['0', 'kW'],
      'sensor.heizgerat_aktuelle_sekundarleistung': ['0', 'kW'] }), ws.registry)); await wait(20);
    check(still.shadowRoot.getElementById('t-hp-power').textContent !== still._i.compressor_off, `status Betrieb alone counts as running (${still.shadowRoot.getElementById('t-hp-power').textContent})`);
    still.remove();
    const dhw = mount(ws.config, hassS('dhw')); await wait(20);
    check(dhw.shadowRoot.getElementById('chip-mode').classList.contains('mode-dhw') && dhw.shadowRoot.getElementById('t-valve').textContent === 'DHW', 'Warmwasser = DHW, valve Warmwasser = DHW');
    dhw.remove();
    const idle = mount(ws.config, hassS('idle')); await wait(20);
    check(!idle.shadowRoot.getElementById('impeller').classList.contains('on') && idle.shadowRoot.getElementById('t-hp-power').textContent === idle._i.compressor_off,
      `Standby: pump Aus, compressor off (${idle.shadowRoot.getElementById('t-hp-power').textContent})`);
    idle.remove();
    const opt = C._formSchema({}).schema[0].selector.select.options.find((o) => o.value === 'wolf');
    check(/wolf_smartset/.test(opt.label), `preset dropdown names both integrations (${opt.label})`);
  }

  // 6. computed values
  {
    const s = setups[1];
    const card = mount(s.config, hassOf(toStates(s.states('heat')), {}, s.energy));
    await wait(20);
    const txt = (id) => card.shadowRoot.getElementById(id)?.textContent || '';
    check(card._powerMode() === 'energy', 'Energy dashboard mode');
    check(/1,094/.test(txt('t-src-pv-v')) && /146/.test(txt('t-src-grid-v')), `Energy dashboard split (${txt('t-src-pv-v')} / ${txt('t-src-grid-v')})`);
    card.remove();
  }
  {
    // One configured Energy-dashboard source has only an energy counter: give it the unexplained remainder.
    const prefs = { energy_sources: [
      { type: 'solar', stat_rate: 'sensor.pv' }, { type: 'battery', stat_rate: 'sensor.battery' },
      { type: 'grid', stat_energy_from: 'sensor.grid_energy' },
    ] };
    const hass = hassOf(toStates({ 'sensor.hp': ['1200', 'W'], 'sensor.pv': ['400', 'W'], 'sensor.battery': ['100', 'W'] }), {}, prefs);
    const card = mount({ entities: { power: 'sensor.hp' } }, hass);
    await wait(20);
    const split = card._energySplit();
    check(split.pv === 400 && split.battery === 100 && split.grid === 700, `missing grid power gets the remainder (${JSON.stringify(split)})`);
    check(/no power sensor for grid/i.test(card.shadowRoot.textContent), 'card explains a missing Energy-dashboard power sensor');
    card._hass.states['sensor.hp'].state = '40';
    check(Object.values(card._energySplit()).every((v) => v === 0), 'no source split below 50 W');
    const ed = document.createElement('heatpump-flow-card-editor');
    ed.setConfig({ entities: { power: 'sensor.hp' } }); ed.hass = hass; await wait(20);
    check(ed._energyMissing?.includes('grid') && /Energy dashboard|Energie-Dashboard/.test(ed.textContent),
      `editor explains a missing Energy-dashboard power sensor (${JSON.stringify(ed._energyMissing)} / ${ed.textContent.trim()})`);
    card.remove(); ed.remove();
  }
  {
    const prefs = { energy_sources: [
      { type: 'solar', stat_energy_from: 'sensor.pv_energy' },
      { type: 'battery', stat_energy_from: 'sensor.battery_energy' },
      { type: 'grid', stat_energy_from: 'sensor.grid_energy' },
    ] };
    const card = mount({ entities: { power: 'sensor.hp' } }, hassOf(toStates({ 'sensor.hp': ['1200', 'W'] }), {}, prefs));
    await wait(20);
    check(card._powerMode() === '' && /no power sensor for (PV|solar).*battery.*grid/i.test(card.shadowRoot.textContent),
      'the card explains when every automatic Energy-dashboard source lacks a power sensor');
    card.remove();
  }
  {
    // #357: the report lists every Energy-dashboard source with its power sensor, so a source without one (its share becomes the
    // remainder) and a battery with the opposite sign can be seen.
    const prefs = { energy_sources: [
      { type: 'solar', stat_energy_from: 'sensor.pv1_energy', stat_rate: 'sensor.pv1_power' },
      { type: 'solar', stat_energy_from: 'sensor.pv2_energy' },
      { type: 'battery', stat_energy_from: 'sensor.bat_out', power_config: { stat_rate: 'sensor.bat_power', stat_rate_inverted: true } },
      { type: 'grid', stat_energy_from: 'sensor.grid_in', power_config: { stat_rate_from: 'sensor.grid_import', stat_rate_to: 'sensor.grid_export' } },
    ] };
    const hass = hassOf(toStates({ 'sensor.hp': ['955', 'W'], 'sensor.pv1_power': ['812', 'W'], 'sensor.bat_power': ['-1924', 'W'],

  {

    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Comfort' }))[0] === '', 'comfort shows no chip');
    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Reduziert' }))[0] === 'night', 'German "reduziert" is night');
    check((await prog(s, 'heat', { 'select.heatpump_heating_program': 'Comfort' }, { program_map: { Comfort: 'party' } }))[0] === 'party', 'program_map maps a raw state');
    check((await prog(s, 'heat', {}, { program_map: { Eco: 'none' } }))[0] === '', 'program_map none hides the chip');
    const noProgram = { ...s.config, entities: { ...s.config.entities, program: null } };
    check((await prog({ ...s, config: noProgram }, 'heat', { 'sensor.eu08l_hc1_operating_state': 'ECO' }))[0] === 'eco', 'without a program entity the circuit mode ECO shows eco');
    check((await prog({ ...s, config: noProgram }, 'heat', {}))[0] === '', 'circuit mode HEATING shows no chip');
    const hm = setups[5];
    check((await prog(hm, 'heat', { 'sensor.panasonic_heat_pump_main_holiday_mode_state': 'Active' }))[0] === 'holiday', 'HeishaMon holiday mode Active');
    check((await prog(hm, 'heat', { 'sensor.panasonic_heat_pump_main_holiday_mode_state': 'Scheduled' }))[0] === '', 'HeishaMon holiday mode Scheduled shows nothing');
    {
      const c = mount(s.config, hassWith(s, 'heat')); await wait(20);
      const ev = []; c.addEventListener('hass-more-info', (e) => ev.push(e.detail.entityId));

    // 5b. Wolf (wolf_smartset): effective DHW target and program from the mixer circuit demand
    {

      const adjId = 'sensor.heizgerat_warmwassersolltemperatur'; const numId = 'number.wolf_cha_warmwassersolltemperatur_eingestellt';

      check(off._e.dhw_target === adjId && off._n('dhw_target') === 10 && off._hass.states[numId].state === '48',

      check((await prog(ws, 'heat', { [demand]: 'Automatik aus' }))[0] === 'night', 'Automatik aus shows the night chip');
      check((await prog(ws, 'heat', { [demand]: 'Automatik ein' }))[0] === '', 'Automatik ein shows no chip');

      check(C._resolve(wl.config, hassWith(wl, 'heat')).entities.program === 'sensor.zuhause_holiday_mode', 'wolflink still maps program to holiday_mode');

    // solar thermal
    const sol = async (scen, cfg = {}, setup = s, extra = {}, reg = {}) => {
      const c = mount({ ...setup.config, ...cfg }, hassWith(setup, scen, extra, reg)); await wait(20);

  // 12. wall display: large type, controls appear on touch and fade out
  {
    const s = setups[0];

    c.remove();

    check(!C._formSchema({ layout: 'default' }).schema.flatMap(keysOf).includes('wall_timeout') && C._formSchema({ layout: 'wall' }).schema.flatMap(keysOf).includes('wall_timeout'), 'editor offers wall_timeout only for the wall layout');
  }

  // 13. appearance: narrow schematics, chip contrast, source labels, tank scale, idle pipes, bridge at crossing risers
  {
    const s = setups[1];
    const hass = hassOf(toStates(s.states('heat')), s.registry || {}, s.energy, s);
    const q = (c, id) => c.shadowRoot.getElementById(id);
    // narrow: larger type tiers and hidden secondary labels, driven by the width of the schematic
    const sized = async (px) => {
      const c = mount(s.config, hass); c.style.display = 'block'; c.style.width = `${px}px`; await wait(30);
      const svg = q(c, 'svg'); const cs = getComputedStyle(svg);
      const out = { k: cs.getPropertyValue('--k').trim(), vol: getComputedStyle(c.shadowRoot.querySelector('.vol-label')).display, pre: getComputedStyle(c.shadowRoot.querySelector('#t-vl .pre')).display, valve: getComputedStyle(q(c, 't-valve')).display };
      c.remove(); return out;
    };
    let o = await sized(900);
    check(o.k === '' && o.vol !== 'none' && o.pre !== 'none', `wide schematic keeps the normal type (${JSON.stringify(o)})`);
    o = await sized(560);
    check(o.k === '1.2' && o.vol !== 'none', `medium schematic: type 1.2x, labels stay (${JSON.stringify(o)})`);
    o = await sized(400);
    check(o.k === '1.4' && o.vol === 'none' && o.pre === 'none' && o.valve === 'none', `narrow schematic: type 1.4x, secondary labels hidden (${JSON.stringify(o)})`);
    const kept = mount({ ...s.config, hc_return_label: true, narrow_values: true }, hass); kept.style.display = 'block'; kept.style.width = '400px'; await wait(30);
    check(getComputedStyle(q(kept, 't-buf-bottom')).display !== 'none' && getComputedStyle(q(kept, 't-hc-rl')).display !== 'none'
      && getComputedStyle(q(kept, 't-valve')).display === 'none',
    'narrow_values keeps buffer sub-values and circuit return, but not unrelated secondary labels');
    // #360: the flow rates of the heat pump, the circuits and the source stay with narrow_values and grow like the other kept values.
    check([...kept.shadowRoot.querySelectorAll('.vol-label')].every((t) => getComputedStyle(t).display !== 'none') && parseFloat(getComputedStyle(q(kept, 't-vol')).fontSize) > 15,
      `#360: narrow_values keeps the flow rates (${getComputedStyle(q(kept, 't-vol')).fontSize})`);
    // #257: on a phone the tank bottom tells how much hot water is left; narrow_values keeps it and the target line.
    check(getComputedStyle(q(kept, 't-dhw-bottom')).display !== 'none' && getComputedStyle(q(kept, 't-dhw-mode')).display !== 'none'
      && parseFloat(getComputedStyle(q(kept, 't-dhw-bottom')).fontSize) > 15,
    `narrow_values keeps the hot-water tank bottom and target line (${getComputedStyle(q(kept, 't-dhw-bottom')).fontSize})`);
    // #214 feedback: the kept circuit return grows like the other secondary labels instead of staying at 13 px.
    check(parseFloat(getComputedStyle(q(kept, 't-hc-rl')).fontSize) > 15, `narrow_values: the circuit return label scales on a narrow card (${getComputedStyle(q(kept, 't-hc-rl')).fontSize})`);
    kept.remove();
    const bufferCard = async (keys, equal = true) => {
      const entities = Object.fromEntries(keys.map((key) => [key, `sensor.${key}`]));
      const states = toStates(Object.fromEntries(keys.map((key, n) => [`sensor.${key}`, [`${40 - n * 5}`, '°C']])));
      const c = mount({ buffer_values: equal ? 'equal' : 'default', entities }, hassOf(states)); await wait(20); return c;
    };
    let bc = await bufferCard(['buffer_top']);
    check(q(bc, 't-buf-top').getAttribute('y') === '446', 'equal buffer layout centres one configured value'); bc.remove();
    bc = await bufferCard(['buffer_top', 'buffer_bottom']);

      && getComputedStyle(q(bc, 't-buf-top')).fontSize === getComputedStyle(q(bc, 't-buf-bottom')).fontSize, 'equal buffer layout distributes two equally sized values'); bc.remove();

      && getComputedStyle(q(bc, 't-buf-top')).fontSize !== getComputedStyle(q(bc, 't-buf-bottom')).fontSize, 'default buffer emphasis is unchanged'); bc.remove();
    const card = mount(s.config, hass); await wait(20);

    check(q(card, 't-vl').textContent.startsWith('VL ') && !!q(card, 't-vl').querySelector('.pre'), 'flow label keeps its VL prefix as a separate part');
    // chip text follows the theme text colour (readable in light and dark themes)
    check(/var\(--primary-text-color/.test(card.shadowRoot.querySelector('style').textContent), 'chip text mixes in the theme text colour');
    // power sources: name above, value below
    check(q(card, 't-src-pv').textContent === 'PV' && /W$/.test(q(card, 't-src-pv-v').textContent), `source label and value are separate lines (${q(card, 't-src-pv').textContent} / ${q(card, 't-src-pv-v').textContent})`);
    // tank scale: four steps, mixed in oklch
    const tank = (t) => card._tankColor(t);
    check(/--hfc-tank-cold/.test(tank(21)) && /--hfc-tank-cool/.test(tank(30)) && /--hfc-tank-warm/.test(tank(45)) && /--hfc-tank-hot/.test(tank(57)) && /oklch/.test(tank(45)), 'tank scale has four steps in oklch');
    check(/disabled-text-color/.test(tank(NaN)), 'tank without a temperature is grey');

    const p = q(idle, 'p-vl');

  // 13b. Samsung EHS: text valve "Tank (DHW)", text error code with "No Error", tiles from the example.yaml template sensors

  }

  // 13c. Luxtronik (integration luxtronik2): entities by translation key, mixing circuits only where they report, status values
  {
    const s = setups[12]; const reg = s.registry; const px = 'luxtronik2';
    const hass = (scen, extra = {}) => hassOf(toStates({ ...s.states(scen), ...extra }), reg);
    const r = C._resolve(s.config, hass('heat')); const e = r.entities;
    check(HFC_PRESETS.luxtronik.tested === true && r.ready && r.prefix === '', 'Luxtronik is detected through translation keys and marked tested');
    check(e.mode === `sensor.${px}_status` && e.compressor === `binary_sensor.${px}_compressor`
      && e.flow === `sensor.${px}_flow_in_temperature` && e.return === `sensor.${px}_flow_out_temperature`, `Luxtronik mode, compressor, flow (Vorlauf) and return (Rücklauf) (${e.flow} / ${e.return})`);
    check(e.power === `sensor.${px}_current_power_consumption` && e.heat === `sensor.${px}_current_heat_output` && e.volume === `sensor.${px}_heat_amount_flow_rate`, 'Luxtronik power, heat output and heating flow rate');
    check(e.dhw_top === `sensor.${px}_dhw_temperature` && e.dhw_target === `number.${px}_dhw_target_temperature` && e.program === `select.${px}_heating_mode`, 'Luxtronik hot water, its target (number) and the heating mode select');
    check(e.hc_flow === `sensor.${px}_flow_in_circuit1_temperature` && e.hc_setpoint === `sensor.${px}_flow_in_circuit1_target_temperature` && e.hc_pump === `binary_sensor.${px}_circulation_pump_heating`, 'Luxtronik mixing circuit 1');
    check(e.source_in === `sensor.${px}_heat_source_input_temperature` && e.hot_gas === `sensor.${px}_hot_gas_temperature` && e.superheat === `sensor.${px}_overheating_temperature`
      && e.errors === undefined && e.circulation === undefined, 'Luxtronik source, refrigerant circuit; no error and circulation mapping');
    // Without the target number the controller's current target (calc 18, upstream review #242) is the fallback.
    const luxTarget = `sensor.${px}_dhw_target_temperature_controller`;
    const luxReg = { ...Object.fromEntries(Object.entries(reg).filter(([id]) => id !== `number.${px}_dhw_target_temperature`)),
      [luxTarget]: { entity_id: luxTarget, platform: 'luxtronik2', translation_key: 'dhw_target_temperature_controller' } };
    const luxStates = Object.fromEntries(Object.entries(toStates(s.states('heat'))).filter(([id]) => id !== `number.${px}_dhw_target_temperature`));
    const luxFallback = C._resolve(s.config, hassOf({ ...luxStates, ...toStates({ [luxTarget]: ['48.0', '°C'] }) }, luxReg)).entities;
    check(luxFallback.dhw_target === luxTarget, `Luxtronik: the controller's hot-water target stands in for a missing target number (${luxFallback.dhw_target})`);
    const two = C._resolve({ ...s.config, hc_count: 2 }, hass('heat')).entities;
    check(two.hc2_flow === undefined && two.hc2_setpoint === undefined, 'Luxtronik: mixing circuit 2 without a target counts as not installed');
    const two2 = C._resolve({ ...s.config, hc_count: 2 }, hass('heat', { [`sensor.${px}_flow_in_circuit2_target_temperature`]: ['36.0', '°C'], [`sensor.${px}_flow_in_circuit2_temperature`]: ['35.2', '°C'] })).entities;
    check(two2.hc2_flow === `sensor.${px}_flow_in_circuit2_temperature` && two2.hc2_setpoint === `sensor.${px}_flow_in_circuit2_target_temperature`, 'Luxtronik: an installed mixing circuit 2 is mapped');
    check(C.getStubConfig(hass('heat')).hc_count === undefined, 'Luxtronik stub leaves hc_count to the user');
    const t = r.tiles;
    check(t.energy_heating?.total === `sensor.${px}_heat_energy_input` && t.heat_dhw?.total === `sensor.${px}_dhw_heat_amount` && t.heat?.total === `sensor.${px}_heat_amount_counter`
      && t.hours?.total === `sensor.${px}_compressor1_operation_hours` && t.energy_cooling === undefined, 'Luxtronik tiles: counters per use where they exist');
    const lux = async (scen, extra = {}) => {
      const card = mount(s.config, hass(scen, extra)); await wait(20);
      const q = (id) => card.shadowRoot.getElementById(id);
      const out = { mode: q('chip-mode').className, flow: q('t-vl')?.textContent, rl: q('t-rl')?.textContent, hc: q('t-hc')?.textContent, prog: q('chip-program')?.className };
      card.remove(); return out;

    o = await isg('defrost'); check(/mode-defrost/.test(o.mode), `Stiebel ISG defrost flag (${o.mode})`);

    c.remove();
    c = mount({ ...s.config, timeline: true, timeline_marks: false }, mock(() => [{ state: '0', last_updated: iso(0) }])(hass('heat'))); await wait(80);
    check(![...c.shadowRoot.querySelectorAll('#timeline .seg')].some((x) => x.classList.contains('k-pv')), 'without a PV period the timeline has no PV surplus kind');

    // share tile: yesterday, 24 h of history, heating 6 h to 21 h of it, PV surplus 6 h to 12 h of it
    const share = async (period) => {
      const card = mount({ ...s.config, tiles: [`pv_boost_share:${period}`] }, mock(pvHist)(hass('heat'))); await wait(80);
