        buffer_top: 'sensor.bt', buffer_bottom: 'sensor.bb' } }, hassOf(bufStates)); await wait(20);
      const t = q(c, 't-hc'); const b = t.getBBox(); const [top, sub] = t.querySelectorAll('tspan');
      check(t.dataset.lines === '2' && /^(Soll|Target) 36 °C$/.test(top?.textContent) && /^\((Kurve|curve) 34 °C \+ 2 K( (Verschiebung|shift))?\)$/.test(sub?.textContent)
        && b.x >= 641 && b.x + b.width <= 801 && b.y + b.height <= 344,
      `${language}${storage ? ' combined' : ''}: next to the tank the target and the curve stand in two lines right of it (${top?.textContent} | ${sub?.textContent}, x ${b.x.toFixed(0)}–${(b.x + b.width).toFixed(0)})`);
      c.remove();
    }
    const none = mount({ preset: 'heishamon', entities: { hc_curve_offset: null } }, hassOf(st())); await wait(20);
    check(!q(none, 't-hc-now') && /^36,8 °C · Soll 36,0$|^36\.8 °C · Target 36\.0$/.test(q(none, 't-hc').textContent), `without the shift the label stays as before (${q(none, 't-hc').textContent})`);
    none.remove();
    const names = (config) => C._formSchema(config).schema.flatMap(function k(n) { return n.schema ? n.schema.flatMap(k) : [n.name]; });
    const lab = C._formSchema({}).computeLabel;
    check(names({ hc_count: 3 }).includes('hc_curve_offset') && names({ hc_count: 3 }).includes('hc3_curve_offset') && lab({ name: 'hc3_curve_offset' }) === lab({ name: 'hc_curve_offset' }),
      `editor offers the curve shift of each circuit (${lab({ name: 'hc_curve_offset' })})`);
    check(/- hc_curve_offset: number\.panasonic_heat_pump_main_z1_heat_request_temp = 2/.test(C._diagnosticReport({ preset: 'heishamon' }, hassOf(st()))), 'diagnostic report lists the curve shift');
  }

  // 18m. series buffer in the return: the bypass valve follows the defrost signal (or its own entity) and then stops the circuits
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.c': ['30', 'Hz'], 'binary_sensor.d': 'off', 'binary_sensor.b': 'off', ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', defrost: 'binary_sensor.d' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const on = (c, id) => q(c, `p-${id}`)?.classList.contains('on');
    let card = mount({ entities: ents, series_buffer: true, language: 'de' }, hassOf(st())); await wait(20);
    check(q(card, 'sb-tank') && q(card, 'sb-arrow') && /Reihenpuffer/.test(card.shadowRoot.querySelector('.series-title')?.textContent), 'series buffer and its valve are drawn');
    check(on(card, 'byp-vl') && on(card, 'sb-vl') && on(card, 'sb-b') && !on(card, 'sb-a') && on(card, 'hc-vl') && on(card, 'byp-rl'), 'heating: circuit return through the buffer, bypass closed');
    check(q(card, 't-bypass').textContent === '' && q(card, 'sb-arrow').getAttribute('d').startsWith('M614'), 'heating: valve from B to AB');
    check(q(card, 'sb-arrow').closest('.tap').dataset.entity === 'binary_sensor.d', 'a tap on the valve opens the defrost signal');
    card.hass = hassOf(st({ 'binary_sensor.d': 'on' })); await wait(5);
    check(on(card, 'sb-a') && !on(card, 'sb-vl') && !on(card, 'sb-b') && !on(card, 'hc-vl') && on(card, 'byp-rl') && on(card, 'byp-vl'), 'defrost: flow through the bypass into the buffer, circuit stopped');
    check(q(card, 't-bypass').textContent === 'Bypass' && q(card, 'sb-arrow').getAttribute('d').startsWith('M600 481'), 'defrost: valve from A to AB');
    card.remove();
    card = mount({ entities: { ...ents, bypass_valve: 'binary_sensor.b' }, series_buffer: true }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(!on(card, 'sb-a') && on(card, 'sb-b') && q(card, 'sb-arrow').closest('.tap').dataset.entity === 'binary_sensor.b', 'an own bypass valve entity wins over the defrost signal');
    card.hass = hassOf(st({ 'binary_sensor.b': 'on' })); await wait(5);
    check(on(card, 'sb-a') && !on(card, 'hc-vl'), 'bypass valve on: circuit stopped');
    card.remove();
    card = mount({ entities: { ...ents, buffer_top: 'sensor.bt' }, series_buffer: true }, hassOf(st({ 'sensor.bt': ['40', '°C'] }))); await wait(20);
    check(!q(card, 'sb-tank') && q(card, 't-buf-top'), 'a parallel buffer with its own sensors wins over the series buffer');
    card.remove();
    card = mount({ entities: ents }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(!q(card, 'sb-tank') && on(card, 'hc-vl'), 'without series_buffer nothing changes, the circuit runs in defrost');
    card.remove();
    // series_bypass: false: a series buffer without a bypass valve, the circuits keep running in defrost
    card = mount({ entities: ents, series_buffer: true, series_bypass: false }, hassOf(st({ 'binary_sensor.d': 'on' }))); await wait(20);
    check(q(card, 'sb-tank') && !q(card, 'sb-arrow') && !q(card, 'p-sb-a') && !q(card, 't-bypass'), 'series_bypass: false draws the buffer without a bypass valve');
    check(on(card, 'sb-vl') && on(card, 'sb-b') && on(card, 'byp-rl') && on(card, 'hc-vl'), 'series_bypass: false: the circuit runs in defrost, its return flows through the buffer');
    card.remove();
    let bad = '';
    try { document.createElement('heatpump-flow-card').setConfig({ series_bypass: 'no' }); } catch (e) { bad = e.message; }
    check(/series_bypass must be true or false/.test(bad), 'series_bypass is checked to be a boolean');
    // More circuits: the buffer, its valve and its text keep clear of the risers and pipes of circuit 2 and up
    for (const hc_count of [2, 3]) {
      card = mount({ entities: ents, series_buffer: true, hc_count }, hassOf(st())); await wait(20);
      const box = (el) => { const b = el.getBBox(); const m = el.getCTM(); return { x: b.x + m.e, y: b.y + m.f, w: b.width, h: b.height }; };
      const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
      const own = ['sb-tank', 'sb-arrow', 't-bypass'].map((id) => q(card, id)).concat([...card.shadowRoot.querySelectorAll('.series-title, circle.valve[cx="600"]')]);
      const others = [...card.shadowRoot.querySelectorAll('[id^="p-hc-"], [id^="t-hc"], circle.pump, .radiator, .screed')].filter((el) => /[2-6]$/.test(el.id || '') || el.closest('g[transform^="translate(0 "]:not([transform="translate(0 0)"])'));
      const clashes = own.flatMap((a) => others.filter((b) => hit(box(a), box(b))).map((b) => `${a.id || a.getAttribute('class')} / ${b.id || b.getAttribute('class')}`));
      check(others.length > 0 && clashes.length === 0, `${hc_count} circuits: the series buffer keeps clear of the other circuits (${clashes.join(', ') || others.length + ' parts checked'})`);
      check(on(card, 'sb-b') && on(card, 'hc-vl2'), `${hc_count} circuits: the return of all circuits flows through the series buffer`);
      card.remove();
    }
    const keys = C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; });
    check(keys.includes('series_buffer') && keys.includes('bypass_valve'), 'editor offers the series buffer and its bypass valve');
    const keysWith = C._formSchema({ series_buffer: true }).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; });
    check(!keys.includes('series_bypass') && keysWith.includes('series_bypass'), 'editor offers series_bypass only with a series buffer');
  }

  // 18n. fan speed: the fan follows its own speed entity (it runs on after the compressor stops), else the running state
  {
    const p = 'panasonic_heat_pump';
    const st = (extra = {}) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['34', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_fan1_motor_speed`]: ['700', 'R/min'], ...extra,
    });
    const r = C._resolve({ preset: 'heishamon' }, hassOf(st()));
    check(r.entities.fan_speed === `sensor.${p}_main_fan1_motor_speed`, `HeishaMon fan speed from fan 1 (${r.entities.fan_speed})`);
    const fan = (c) => c.shadowRoot.getElementById('fan');
    let card = mount({ preset: 'heishamon' }, hassOf(st())); await wait(20);
    check(fan(card).classList.contains('on') && card._speedDurs.fan > 0, 'the fan runs on after the compressor stops');
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['0', 'R/min'], [`sensor.${p}_main_compressor_freq`]: ['30', 'Hz'] })); await wait(5);
    check(!fan(card).classList.contains('on'), 'a fan speed of 0 stops the fan, also with the compressor running');
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['900', 'R/min'] })); await wait(5);
    const fast = card._speedDurs.fan;
    card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: ['300', 'R/min'] })); await wait(5);
    check(fast < card._speedDurs.fan, 'a higher fan speed turns the fan faster');
    for (const state of ['unavailable', 'unknown']) {
      card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: state, [`sensor.${p}_main_compressor_freq`]: ['30', 'Hz'] })); await wait(5);
      check(fan(card).classList.contains('on'), `a fan speed entity that is ${state} falls back to the running state (compressor on)`);
      card.hass = hassOf(st({ [`sensor.${p}_main_fan1_motor_speed`]: state, [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] })); await wait(5);
      check(!fan(card).classList.contains('on'), `a fan speed entity that is ${state} falls back to the running state (compressor off)`);
    }
    card.remove();
    card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.c', fan_speed: 'binary_sensor.fan' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.c': 'off', 'binary_sensor.fan': 'on' }))); await wait(20);
    check(fan(card).classList.contains('on'), 'a binary fan entity turns the fan');
    card.remove();
    card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.c' } }, hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.c': 'on' }))); await wait(20);
    check(fan(card).classList.contains('on'), 'without a fan entity the fan follows the running state');
    card.remove();
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('fan_speed'), 'editor offers the fan speed');
  }

  // 18l. primary pump inside the heat pump (primary_pump): drawn on the flow pipe under the flow temperature and over the flow rate, the single direct circuit has none
  {
    const p = 'panasonic_heat_pump';
    const st = (extra = {}) => toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['36', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['32', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['19', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
      [`sensor.${p}_main_pump_flow`]: ['10.9', 'l/min'], [`sensor.${p}_main_z1_water_temp`]: ['-78', '°C'], ...extra,
    });
    const q = (c, sel) => c.shadowRoot.querySelector(sel);
    let card = mount({ preset: 'heishamon' }, hassOf(st())); await wait(20);
    check(q(card, '#impeller-primary'), 'HeishaMon: the card draws the primary pump of the heat pump');
    const box = q(card, '#hp-box').getBBox(); const pump = q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getBBox();
    const apart = (a, b) => a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y;
    check(pump.x >= box.x + box.width && pump.x + pump.width <= 402 && pump.y < 250 && pump.y + pump.height > 250, 'the primary pump sits on the flow pipe between the heat pump block and the valve');
    const mid = (r) => r.x + r.width / 2;
    check(Math.abs(mid(pump) - mid(q(card, '#t-vl').getBBox())) < 1 && Math.abs(mid(pump) - mid(q(card, '#t-vol').getBBox())) < 1, 'the primary pump stands centred under the flow temperature and over the flow rate');
    check(apart(pump, q(card, '#t-vl').getBBox()) && apart(pump, q(card, '#t-vol').getBBox()), `the primary pump keeps clear of the flow temperature and the flow rate (${[pump, q(card, '#t-vl').getBBox(), q(card, '#t-vol').getBBox()].map((r) => [r.x, r.y, r.width, r.height].map(Math.round).join(',')).join(' / ')})`);
    check(q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getAttribute('r') === '16', 'the primary pump has the size of the circuit pump (r 16)');
    check(!q(card, 'circle.pump[cx="720"]') && !q(card, '#impeller'), 'the single direct circuit has no pump of its own');
    check(q(card, '#impeller-primary').classList.contains('on'), 'the primary pump turns with a flow rate');
    check(q(card, '#impeller-primary').closest('.tap').dataset.entity === `sensor.${p}_main_pump_flow`, 'a tap on the primary pump opens the flow rate');
    card.remove();
    card = mount({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    check(!q(card, '#impeller-primary').classList.contains('on'), 'the primary pump stands still without a flow rate');
    card.remove();
    // #312: EMS-ESP reports PC0 below about 50 % speed as -1 l/h. A negative flow rate is unknown: the pump follows the
    // running heat pump, no "-1 l/h" label, no estimated heat from it.
    card = mount({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['-1', 'l/h'] }))); await wait(20);
    check(q(card, '#impeller-primary').classList.contains('on') && q(card, '#t-vol').textContent === '' && q(card, '#p-vl').classList.contains('on'),
      `#312: a negative flow rate is unknown, the primary pump turns while the heat pump runs (${q(card, '#t-vol').textContent})`);
    card.hass = hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['-1', 'l/h'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] })); await wait(5);
    check(!q(card, '#impeller-primary').classList.contains('on'), '#312: with a negative flow rate and the heat pump off the primary pump stands still');
    card.remove();
    // Sniffing: the compressor is off, the primary pump moves a few l/h. The water circulates slowly, the mode stays idle.
    card = mount({ preset: 'heishamon', hc_type: 'radiator' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0.13', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    const imp = q(card, '#impeller-primary');
    check(imp.classList.contains('on') && card._speedDurs.primary >= 29, `sniffing: the primary pump turns slowly (${card._speedDurs.primary}s)`);
    check(q(card, '#p-vl').classList.contains('on') && q(card, '#p-rl').classList.contains('on') && q(card, '#p-hc-vl').classList.contains('on'), 'sniffing: the water circulates through the heating circuit');
    check(q(card, '#t-vol').textContent === '8 l/h' && card._speedDurs.flow >= 29, `sniffing: slow flow with its flow rate (${q(card, '#t-vol').textContent})`);
    check(!q(card, '#chip-mode').className.includes('mode-heat'), 'sniffing: the mode stays idle');
    check(!q(card, '#waves').classList.contains('on'), 'sniffing: the emitter gives off no heat');
    card.remove();
    card = mount({ preset: 'heishamon', hc_type: 'radiator' }, hassOf(st())); await wait(20);
    check(card._speedDurs.primary < 2, `heating: the primary pump turns at normal speed (${card._speedDurs.primary}s)`);
    check(q(card, '#waves').classList.contains('on'), 'heating: the emitter gives off heat');
    card.remove();
    // The flow dashes follow the pump: double the flow rate, half the cycle time.
    const durAt = async (lmin) => {
      card = mount({ preset: 'heishamon' }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: [lmin, 'l/min'] }))); await wait(20);
      const d = +card._speedDurs.flow.toFixed(2); card.remove(); return d;
    };
    const d10 = await durAt('10'), d20 = await durAt('20');
    check(Math.abs(d10 / d20 - 2) < 0.05 && d10 < 2, `the flow speed is proportional to the flow rate (10 l/min ${d10}s, 20 l/min ${d20}s)`);
    card = mount({ preset: 'heishamon', primary_pump: false }, hassOf(st({ [`sensor.${p}_main_pump_flow`]: ['0.13', 'l/min'], [`sensor.${p}_main_compressor_freq`]: ['0', 'Hz'] }))); await wait(20);
    check(!q(card, '#p-vl').classList.contains('on'), 'without the primary pump a flow rate alone does not start the flow');
    card.remove();
    card = mount({ preset: 'heishamon', primary_pump: false }, hassOf(st())); await wait(20);
    check(!q(card, '#impeller-primary') && q(card, 'circle.pump[cx="720"]'), 'primary_pump: false draws the pump in the circuit again');
    card.remove();
    card = mount({ preset: 'heishamon', entities: { hc_pump: 'binary_sensor.z1_pump' } }, hassOf({ ...st(), 'binary_sensor.z1_pump': { state: 'on', attributes: {} } })); await wait(20);
    check(q(card, '#impeller-primary') && q(card, 'circle.pump[cx="720"]'), 'a circuit pump sensor keeps the circuit pump next to the primary pump');
    card.remove();
    card = mount({ ...setups[0].config }, hassOf(toStates(setups[0].states('heat')), setups[0].registry || {}, setups[0].energy, setups[0])); await wait(20);
    check(!q(card, '#impeller-primary'), 'presets without primary_pump keep the circuit pump only');
    card.remove();
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('primary_pump'), 'editor offers the primary pump in the heat pump');
  }

  // 18o. primary pump of the Samsung and Kronoterm presets: the pump of the heat pump stands on the flow pipe
  {
    const mountSetup = async (name, scenario = 'heat', extra = {}) => {
      const s = setups.find((x) => x.name === name);
      const c = mount({ ...s.config, ...extra }, hassOf(toStates(s.states(scenario)), s.registry || {}, s.energy, s)); await wait(20);
      return c;
    };
    const q = (c, sel) => c.shadowRoot.querySelector(sel);
    for (const name of ['Samsung EHS', 'Kronoterm ADAPT']) {
      let card = await mountSetup(name);
      check(ok(card) && !!q(card, '#impeller-primary'), `${name}: the preset draws the primary pump of the heat pump`);
      check(q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump turns while heating`);
      const box = q(card, '#hp-box').getBBox(); const pump = q(card, '#impeller-primary').parentNode.querySelector('circle.pump').getBBox();
      check(pump.x >= box.x + box.width && pump.x + pump.width <= 402 && pump.y < 250 && pump.y + pump.height > 250, `${name}: the pump sits on the flow pipe between the heat pump block and the valve`);
      card.remove();
      card = await mountSetup(name, 'dhw');
      check(q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump turns for hot water, too`);
      card.remove();
      card = await mountSetup(name, 'idle');
      check(!q(card, '#impeller-primary').classList.contains('on'), `${name}: the primary pump stands still in standby`);
      card.remove();
      card = await mountSetup(name, 'heat', { primary_pump: false });
      check(!q(card, '#impeller-primary') && !!q(card, 'circle.pump[cx="720"]'), `${name}: primary_pump: false draws the pump in the circuit again`);
      card.remove();
    }
    let card = await mountSetup('Samsung EHS');
    check(!q(card, 'circle.pump[cx="720"]'), 'Samsung: the single direct circuit has no pump of its own');
    card.remove();
    card = await mountSetup('Kronoterm ADAPT');
    check(!!q(card, 'circle.pump[cx="720"]'), 'Kronoterm: the loop pump stays in the circuit next to the primary pump');
    card.remove();
    check(Object.entries(HFC_PRESETS).filter(([, p]) => p.primary_pump).map(([k]) => k).sort().join() === 'espaltherma,heishamon,kronoterm,samsung', 'presets with a primary pump: ESPAltherma, HeishaMon, Kronoterm, Samsung');
  }

  // 18p. hot-water standby loss (#32): cool-down in K/h only in verified standby windows, charging and draw-off excluded
  {
    const H = 3600000; const end = Date.now(); const start = end - 48 * H;
    // Temperature points every 12 minutes from `from` to `to` hours ago, falling by `rate` K/h (0.1 K resolution).
    const cool = (from, to, t0, rate) => { const out = []; for (let h = from; h >= to - 1e-9; h -= 0.2) out.push([h, (t0 - rate * (from - h)).toFixed(1)]); return out; };
    const hist = (spec) => Object.fromEntries(Object.entries(spec).map(([id, pts]) => [id, pts.map(([h, s]) => ({ t: end - h * H, s: String(s) }))]));
    const ids = { temps: ['sensor.top', 'sensor.bottom'], run: { comp: 'binary_sensor.comp', valve: 'binary_sensor.valve' }, extra: ['switch.rod'] };
    const base = {
      'binary_sensor.comp': [[48, 'on'], [46, 'off']], 'binary_sensor.valve': [[48, 'on'], [46, 'off']], 'switch.rod': [[48, 'off']],
      'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 0, 52, 0.4)], 'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 0, 50, 0.3)],
    };
    const card = mount({ entities: { flow: 'sensor.f', compressor: 'binary_sensor.comp', valve: 'binary_sensor.valve', dhw_top: 'sensor.top' } },
      hassOf(toStates({ 'sensor.f': ['35', '°C'], 'binary_sensor.comp': 'off', 'binary_sensor.valve': 'off', 'sensor.top': ['40', '°C'] }))); await wait(20);
    const loss = (spec) => card._dhwLoss(hist({ ...base, ...spec }), ids, start, end);
    const near = (r, v) => r && Math.abs(r.rate - v) < 0.03;
    let r = loss({});
    // The window starts after the charge, its settling time and the last rise of the charge (about 45.3 of 48 hours).
    check(near(r, 0.4) && r.windows === 1 && r.hours > 45 && r.hours <= 45.5, `clean standby after a charge: 0.4 K/h over about 45 h (${JSON.stringify(r)})`);
    // Draw-off: the top sensor drops 2 K, the bottom 12 K; the drop itself must not count as loss.
    r = loss({ 'sensor.top': [...cool(48, 46.2, 45, -3.5), ...cool(46, 20.2, 52, 0.4), ...cool(20, 0, 52 - 0.4 * 26 - 2, 0.4)],
      'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 20.2, 50, 0.3), ...cool(20, 0, 50 - 0.3 * 26 - 12, 0.3)] });
    check(near(r, 0.4) && r.windows === 2, `draw-off is cut out of the standby window (${JSON.stringify(r)})`);
    // Small draw-off seen only at the bottom sensor (cold water enters at the bottom).
    r = loss({ 'sensor.bottom': [...cool(48, 46.2, 40, -5), ...cool(46, 30.2, 50, 0.3), ...cool(30, 0, 50 - 0.3 * 16 - 6, 0.3)] });
    check(r && r.windows === 2, `a draw-off seen only at the bottom sensor splits the window (${JSON.stringify(r)})`);
    // A hot-water charge in between: compressor on with the valve on hot water, the tank warms up.

    const { hc_pump, ...noPump } = ents;
    check(lossOf({ entities: noPump, storage: 'combined' }) === null, 'combined storage without a circuit pump entity: no standby-loss tile');
    check(!lossOf({ entities: ents })?.extra.includes('binary_sensor.p'), 'separate storages: the circuit pump does not matter for the tank');
    const H = 3600000; const end = Date.now(); const start = end - 48 * H;
    const cool = (from, to, t0, rate) => { const out = []; for (let h = from; h >= to - 1e-9; h -= 0.2) out.push([h, (t0 - rate * (from - h)).toFixed(1)]); return out; };
    const hist = (spec) => Object.fromEntries(Object.entries(spec).map(([id, pts]) => [id, pts.map(([h, s]) => ({ t: end - h * H, s: String(s) }))]));
    const lc = mount({ entities: ents, storage: 'combined' }, hassOf(st())); await wait(20);
    const ids = { temps: ['sensor.t1'], run: { comp: 'binary_sensor.comp' }, extra: ['binary_sensor.p'] };
    // The circuit pump runs from 30 to 10 hours ago and draws heat from the tank (1.0 K/h); otherwise it loses 0.4 K/h.
    const r = lc._dhwLoss(hist({ 'binary_sensor.comp': [[48, 'off']], 'binary_sensor.p': [[48, 'off'], [30, 'on'], [10, 'off']],
      'sensor.t1': [...cool(48, 30.2, 55, 0.4), ...cool(30, 10.2, 55 - 0.4 * 18, 1.0), ...cool(10, 0, 55 - 0.4 * 18 - 20, 0.4)] }), ids, start, end);
    check(r && Math.abs(r.rate - 0.4) < 0.03 && r.windows === 2, `combined storage: windows with a running circuit pump are left out (${JSON.stringify(r)})`);
    lc.remove();
  }

  // 18t. review follow-ups of #130–#132: valve position, editor rules and defaults, editor tile probe, late combined sensors
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['0', 'Hz'], 'binary_sensor.valve': 'on', 'binary_sensor.p': 'on',

    ed.setConfig({ entities: ents, buffer: true }); ed.hass = hassOf(st());

    check(tileHas({ entities: { flow: 'sensor.f', compressor: 'sensor.c', dhw_top: 'sensor.t1' } }), 'editor still offers the standby-loss tile for a plain hot-water tank');
  }

  // 18u. edge cases: shared circuit trunk, sensor without value in a combined storage, cooling, hot water without a tank, station with solar
  {
    const st = (extra = {}) => toStates({
      'sensor.m': 'heating', 'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['40', 'Hz'], 'binary_sensor.p1': 'off', 'binary_sensor.p2': 'on',

    card = mount({ entities: { ...base, dhw_top: 'sensor.t1', dhw_bottom: 'sensor.t3', buffer_top: 'sensor.t4' }, storage: 'combined' }, hassOf(st({ 'sensor.t3': 'unavailable' }))); await wait(20);

    card.hass = hassOf(st({ 'sensor.t3': ['44', '°C'] })); await wait(5);
    check(col('g-cs-dhw_bottom') !== col('g-cs-dhw_top'), 'the sensor gets its own colour back with a value');
    // Cooling runs through the heating zone, like through a parallel buffer.

    check(on(card, 'p-vl-buf') && !on(card, 'p-vl-dhw'), 'combined storage, cooling: through the heating zone');

    // Hot-water mode without any hot-water key: the heat pump runs in hot water, no pipe flows.

  // 18v. #135 and #129: dash animations loop without a jump, circuit 1 shows its room with several circuits, the pressure label clears the buffer
  {
    // Every dash animation moves by whole periods of its own dash pattern.
    const css = C.styles;
    const shift = (name) => Math.abs(parseFloat(new RegExp(`@keyframes ${name} \\{ to \\{ stroke-dashoffset: (-?[\\d.]+)`).exec(css)?.[1]));
    const loop = (sel) => {
      const rule = new RegExp(`\\${sel} \\{[^}]*stroke-dasharray: ([\\d.]+) ([\\d.]+)`).exec(css);
      const anim = new RegExp(`\\${sel}\\.on \\{[^}]*animation: (hfc-[a-z]+)`).exec(css);
      const period = rule ? parseFloat(rule[1]) + parseFloat(rule[2]) : NaN; const s = anim ? shift(anim[1]) : NaN;
      return { period, s, whole: Math.abs(s / period - Math.round(s / period)) < 1e-6 };
    };
    for (const sel of ['.flow', '.eflow']) { const r = loop(sel); check(r.whole, `${sel}: the animation moves by whole dash periods (${r.s} / ${r.period})`); }
    const coil = /\.coil\.on \{[^}]*stroke-dasharray: ([\d.]+) ([\d.]+); animation: (hfc-[a-z]+)/.exec(css);
    const cs = shift(coil[3]); const cp = parseFloat(coil[1]) + parseFloat(coil[2]);
    check(Math.abs(cs / cp - Math.round(cs / cp)) < 1e-6, `.coil: the animation moves by whole dash periods (${cs} / ${cp})`);
    // Several circuits: every room moves into the overview in the house; status lines keep the mode.
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['40', 'Hz'], 'binary_sensor.p1': 'on', 'binary_sensor.p2': 'on',
      'sensor.r1': ['21.4', '°C'], 'number.rt1': ['21', '°C'], 'sensor.r2': ['20.1', '°C'], 'sensor.p': ['1.8', 'bar'], 'sensor.bt': ['32', '°C'], ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', hc_pump: 'binary_sensor.p1', hc2_pump: 'binary_sensor.p2', room: 'sensor.r1', room_target: 'number.rt1', hc2_room: 'sensor.r2' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    let card = mount({ entities: ents, hc_count: 2 }, hassOf(st())); await wait(20);
    check(/21\.4/.test(q(card, 't-house-room')?.textContent || '') && /21\.0|21/.test(q(card, 't-house-room').textContent) && /20\.1/.test(q(card, 't-house-room2')?.textContent || ''),
      `two circuits: the house shows both room rows (${q(card, 't-house-room')?.textContent} / ${q(card, 't-house-room2')?.textContent})`);
    check(q(card, 'house-row').dataset.entity === 'sensor.r1' && !q(card, 't-hc-room'), 'the first room row opens its sensor and is not repeated under the emitter');
    card.remove();
    card = mount({ entities: ents }, hassOf(st())); await wait(20);
    check(!q(card, 't-hc-room') && /21\.4/.test(q(card, 't-room').textContent), 'one circuit: the room stays in the house only');
    card.remove();
    // Pressure label (#129): starts right of the buffer, also in German, and right of the risers with several circuits.
    for (const [hc_count, minX] of [[1, 645], [2, 681]]) {
      card = mount({ entities: { ...ents, hc_pressure: 'sensor.p', buffer_top: 'sensor.bt' }, hc_count, language: 'de' }, hassOf(st())); await wait(20);
      const b = q(card, 't-hc-pressure').getBBox();

  // 18w. #125 value maps in the diagnostic report; #126 valve states in the visual editor and tolerant valve_map values
  {
    const st = (valve = '1', extra = {}) => toStates({ 'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.c': ['40', 'Hz'], 'sensor.v': valve, 'binary_sensor.bv': 'on', 'sensor.top': ['48', '°C'], ...extra });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', valve: 'sensor.v', dhw_top: 'sensor.top' };
    // Report: each map with its source, "none" without maps, a map under entities named as ignored.
    const report = (cfg) => C._diagnosticReport(cfg, hassOf(st()));
    const withMap = report({ entities: ents, valve_map: { 0: 'dhw', 1: 'heating' } });
    check(/\nMaps:\n- valve_map: 0=dhw, 1=heating \(configuration\)\n/.test(withMap), 'report lists the valve_map of the configuration');
    check(/\nMaps:\n- none\n/.test(report({ entities: ents })), 'report without any map says none');
    const lambda = report({ preset: 'lambda' });
    check(/- mode_map: .+ \(preset\)/.test(lambda) && /- dhw_mode_map: .+ \(preset\)/.test(lambda), 'report lists the maps of the preset with their source');
    const misplaced = report({ entities: { ...ents, valve_map: { 1: 'heating' } } });
    check(/- valve_map under entities: ignored/.test(misplaced) && !/- valve_map: \[object/.test(misplaced), 'report names a valve_map placed under entities');
    // Tolerant values: any case and the usual synonyms; the error names the wrong entry.
    const run = async (valve, cfg) => { const card = mount({ entities: ents, ...cfg }, hassOf(st(valve))); await wait(20); const m = card.shadowRoot.getElementById('chip-mode').className; card.remove(); return m; };
    check(/mode-heat/.test(await run('1', { valve_map: { 1: 'Heating', 0: 'DHW' } })) && /mode-dhw/.test(await run('0', { valve_map: { 1: 'Heating', 0: 'DHW' } })), 'valve_map values in any case');
    check(/mode-heat/.test(await run('1', { valve_map: { 1: 'heat', 0: 'hot water' } })) && /mode-dhw/.test(await run('0', { valve_map: { 0: 'hot_water' } })), 'valve_map synonyms heat, hot water, hot_water');

    ed._changed({ ...ed._form.data, valve_dhw_text: '0', valve_heating_text: '1' });
    let bad = ''; try { document.createElement('heatpump-flow-card').setConfig(out.config); } catch (e) { bad = e.message; }
    check(JSON.stringify(out.config.valve_map) === '{"0":"dhw","1":"heating"}' && !('valve_dhw_text' in out.config) && !bad, `editor writes the valve states as valve_map (${JSON.stringify(out.config.valve_map)} ${bad})`);

    check(ed._form.data.valve_dhw_text === '0' && ed._form.data.valve_heating_text === '1' && !/reads 1 as hot water/.test(ed._warn.innerHTML), 'the fields show the map again, the warning is gone');

    check(JSON.stringify(out.config.valve_map) === '{"1":"Heat","ON":"hot water"}', `a YAML map stays as written on an unrelated edit (${JSON.stringify(out.config.valve_map)})`);
    [ed, out] = editor({ entities: { ...ents, valve: 'binary_sensor.bv' } }, hassOf(st('1')));
    check(!/reads 1 as hot water/.test(ed._warn.innerHTML), 'no warning for a binary valve');
    [ed, out] = editor({ entities: { flow: 'sensor.f', return: 'sensor.r' } }, hassOf(st('1')));
    check(!names(ed).includes('valve_dhw_text'), 'no valve fields without a valve entity');
    // A preset map is shown and only differences are written back.
    HFC_PRESETS.__valvetest = { name: 'Valve test', detect: () => '', entities: () => ({ valve: 'sensor.v', flow: 'sensor.f' }), valve_map: { 1: 'heating' } };
    try {
      [ed, out] = editor({ preset: '__valvetest' }, hassOf(st('1')));
      check(ed._form.data.valve_heating_text === '1' && ed._form.data.valve_dhw_text === '', 'the preset map is prefilled');
      ed._changed({ ...ed._form.data, valve_dhw_text: '0' });
      check(JSON.stringify(out.config.valve_map) === '{"0":"dhw"}', `only the difference from the preset is written (${JSON.stringify(out.config.valve_map)})`);
    } finally { delete HFC_PRESETS.__valvetest; }
  }

  // 18x. before 0.14.0: a preset with a combined storage, own texts for the storage parts, the standby loss with several circuits
  {
    const q = (c, id) => c.shadowRoot.getElementById(id);
    // Lambda: the hot-water tank and buffer sensors of the preset become heights in one tank.
    const s = setups[0];
    let card = mount({ preset: 'lambda', storage: 'combined' }, hassOf(toStates(s.states('heat')), s.registry || {})); await wait(30);
    const present = ['dhw_top', 'dhw_middle', 'dhw_bottom', 'buffer_top', 'buffer_middle', 'buffer_bottom'].filter((k) => card._has(k));
    const stops = [...card.shadowRoot.querySelectorAll('#g-cs stop')].map((st) => st.id.replace('g-cs-', ''));
    check(q(card, 'cs-tank') && card.shadowRoot.querySelectorAll('rect.tank').length === 1 && present.length >= 3 && stops.join() === present.join(),
      `Lambda preset with a combined storage: one tank, one stop per preset sensor (${stops.join(', ')})`);
    check(/°C/.test(q(card, 't-dhw-top').textContent) && /°C/.test(q(card, 't-buf-top').textContent), 'Lambda preset with a combined storage: tank and buffer temperatures in their zones');
    card.remove();
    // Own texts for the new storage parts.
    const texts = { en: { combined_tank: 'Layered tank', heating_zone: 'Space heating', fresh_water_station: 'Tap water station' } };
    const st = toStates({ 'sensor.f': ['35', '°C'], 'sensor.c': ['40', 'Hz'], 'sensor.t1': ['50', '°C'], 'sensor.t4': ['32', '°C'], 'binary_sensor.p1': 'on', 'binary_sensor.p2': 'off' });
    const ents = { flow: 'sensor.f', compressor: 'sensor.c', dhw_top: 'sensor.t1', buffer_top: 'sensor.t4' };
    card = mount({ entities: ents, storage: 'combined', texts }, hassOf(st)); await wait(20);
    const titles = [...card.shadowRoot.querySelectorAll('.tank-title, .zone-title')].map((t) => t.textContent);
    check(titles.includes('Layered tank') && titles.includes('Space heating'), `own texts for the combined storage and its heating zone (${titles.join(', ')})`);
    card.remove();
    card = mount({ entities: ents, dhw_type: 'fresh_water', texts }, hassOf(st)); await wait(20);
    check([...card.shadowRoot.querySelectorAll('.tank-title')].some((t) => t.textContent === 'Tap water station'), 'own text for the fresh-water station');
    card.remove();
    // Standby loss with a combined storage needs the pump of every circuit (Codex review of #133).
    const loss = (extra) => { const c = mount({ entities: { ...ents, ...extra }, storage: 'combined', hc_count: 2 }, hassOf(st)); const ids = c._lossIds(); c.remove(); return ids; };
    check(loss({ hc_pump: 'binary_sensor.p1' }) === null, 'two circuits, one pump known: no standby-loss tile');
    const both = loss({ hc_pump: 'binary_sensor.p1', hc2_pump: 'binary_sensor.p2' });
    check(both && both.extra.includes('binary_sensor.p1') && both.extra.includes('binary_sensor.p2'), 'two circuits, both pumps known: both are part of the standby check');
  }

  // 18y. code audit before 0.14.0: no series_bypass default on save, hydraulic options in the report, a map under entities in the editor
  {
    const hass = hassOf(toStates({ 'sensor.f': ['35', '°C'], 'sensor.r': ['30', '°C'], 'sensor.c': ['40', 'Hz'] }));
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c' };
    const editor = (cfg) => {
      const ed = document.createElement('heatpump-flow-card-editor'); const out = {};
      ed.addEventListener('config-changed', (ev) => { out.config = ev.detail.config; });
      ed.setConfig(cfg); ed.hass = hass; return [ed, out];
    };
    // An unrelated edit writes no series_bypass; false next to a series buffer stays.
    let [ed, out] = editor({ entities: ents });
    ed._changed({ ...ed._form.data, title: 'Renamed' });
    check(!('series_bypass' in out.config), `an unrelated edit writes no series_bypass (${JSON.stringify(out.config)})`);
    [ed, out] = editor({ entities: ents, series_buffer: true, series_bypass: false });
    ed._changed({ ...ed._form.data, title: 'Renamed' });
    check(out.config.series_buffer === true && out.config.series_bypass === false, 'series_bypass: false next to a series buffer is kept');
    ed._changed({ ...ed._form.data, series_bypass: true });
    check(out.config.series_buffer === true && !('series_bypass' in out.config), 'switching the bypass valve back on removes the option (default)');
    // Report: storage, hot-water preparation, parallel/series buffer and primary pump in one line.
    const line = (cfg) => (/\nStorage: [^\n]+/.exec(C._diagnosticReport(cfg, hass)) || [''])[0].trim();
    check(line({ entities: ents }) === 'Storage: separate · hot water: coil · parallel buffer: no · series buffer: no · primary pump: no', `report names the default hydraulics (${line({ entities: ents })})`);
    check(line({ entities: ents, storage: 'combined', dhw_type: 'fresh_water', primary_pump: true }) === 'Storage: combined · hot water: fresh_water · parallel buffer: combined storage · series buffer: no · primary pump: yes', 'report names a combined storage with a fresh-water station');
    check(line({ entities: ents, series_buffer: true, series_bypass: false }) === 'Storage: separate · hot water: coil · parallel buffer: no · series buffer: yes, no bypass valve · primary pump: no', 'report names a series buffer without bypass valve');
    check(/primary pump: yes$/.test(line({ preset: 'heishamon' })), 'report takes the primary pump from the preset');
    // Editor: a value map under entities is named as ignored, and saving keeps it where it is.
    [ed, out] = editor({ entities: { ...ents, valve_map: { 1: 'heating' } } });
    check(/valve_map is under entities/.test(ed._warn.innerHTML), 'editor warns about a valve_map under entities');
    ed._changed({ ...ed._form.data, title: 'Renamed' });
    check(JSON.stringify(out.config.entities.valve_map) === '{"1":"heating"}', 'saving in the editor does not drop the misplaced map');
    [ed, out] = editor({ entities: ents, valve_map: { 1: 'heating' } });
    check(!/is under entities/.test(ed._warn.innerHTML), 'no such warning for a valve_map at the top level');
  }

  // 18z. heater rods at the height of a tank sensor (dhw_heater_top/_middle/_bottom, buffer_heater_*): one rod per height
  {
    const st = (extra = {}) => toStates({
      'sensor.f': ['36', '°C'], 'sensor.r': ['31', '°C'], 'sensor.c': ['0', 'Hz'], 'binary_sensor.valve': 'off',
      'sensor.t1': ['52', '°C'], 'sensor.t2': ['47', '°C'], 'sensor.t3': ['42', '°C'], 'sensor.t4': ['35', '°C'], 'sensor.t5': ['33', '°C'], 'sensor.t6': ['30', '°C'],
      'sensor.rod1': ['0', 'W'], 'sensor.rod2': ['0', 'W'], 'sensor.rod3': ['2000', 'W'], 'switch.b1': 'off', 'switch.b2': 'on', 'switch.b3': 'off', ...extra,
    });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', valve: 'binary_sensor.valve',
      dhw_top: 'sensor.t1', dhw_middle: 'sensor.t2', dhw_bottom: 'sensor.t3', buffer_top: 'sensor.t4', buffer_middle: 'sensor.t5', buffer_bottom: 'sensor.t6',
      dhw_heater_top: 'sensor.rod1', dhw_heater_middle: 'sensor.rod2', dhw_heater_bottom: 'sensor.rod3',
      buffer_heater_top: 'switch.b1', buffer_heater_middle: 'switch.b2', buffer_heater_bottom: 'switch.b3' };
    const q = (c, id) => c.shadowRoot.getElementById(id);
    const box = (c, id) => q(c, id).getBBox();
    // A rod is where its flange is; the heat waves above it are not part of its height.
    const rodBox = (c, id) => q(c, id).querySelector('.heater-flange').getBBox();
    const mid = (b) => b.y + b.height / 2;
    const apart = (a, b) => a.y + a.height <= b.y || b.y + b.height <= a.y;
    let card = mount({ entities: ents }, hassOf(st())); await wait(20);
    const rods = ['dhw-top', 'dhw-middle', 'dhw-bottom', 'buf-top', 'buf-middle', 'buf-bottom'];
    check(rods.every((id) => q(card, `heater-${id}`)) && !q(card, 'heater-dhw') && !q(card, 'heater-buf'), 'one rod per configured height, no rod for the plain keys');
    check(['t-dhw-middle', 't-dhw-bottom', 't-buf-middle', 't-buf-bottom'].every((id) => /^\d+(\.\d)? °C$/.test(q(card, id).textContent)), 'the lower values carry no position word, their height tells them apart');
    for (const [rod, label] of [['dhw-middle', 't-dhw-middle'], ['dhw-bottom', 't-dhw-bottom'], ['buf-middle', 't-buf-middle']]) {
      const r = rodBox(card, `heater-${rod}`), l = box(card, label);
      check(mid(r) > l.y && mid(r) < l.y + l.height && l.x + l.width < r.x && l.x > 515, `the ${rod} rod stands at the height of its label, right of it (rod ${mid(r).toFixed(0)} from x ${r.x.toFixed(0)}, label ${l.y.toFixed(0)}–${(l.y + l.height).toFixed(0)}, x ${l.x.toFixed(0)}–${(l.x + l.width).toFixed(0)})`);
    }
    check(apart(rodBox(card, 'heater-dhw-top'), box(card, 't-dhw-top')) && apart(rodBox(card, 'heater-buf-top'), box(card, 't-buf-top')), 'the top rods keep clear of the large top value');
    check(rodBox(card, 'heater-dhw-top').y < box(card, 't-dhw-top').y && rodBox(card, 'heater-buf-top').y < box(card, 't-buf-top').y, 'the top rods sit above the top value');
    check(rods.slice(0, 3).every((id, n, a) => !n || apart(rodBox(card, `heater-${a[n - 1]}`), rodBox(card, `heater-${id}`))) && rods.slice(3).every((id, n, a) => !n || apart(rodBox(card, `heater-${a[n - 1]}`), rodBox(card, `heater-${id}`))), 'the rods of one tank do not overlap');
    const lit = rods.filter((id) => q(card, `heater-${id}`).classList.contains('on'));
    check(lit.join() === 'dhw-bottom,buf-middle', `each rod follows its own entity, a power above 0 W is on (${lit.join()})`);
    const waving = rods.filter((id) => q(card, `heater-${id}`).querySelector('.waves').classList.contains('on'));
    check(waving.join() === lit.join(), `a running rod shows heat waves, a rod that is off shows none (${waving.join()})`);
    const red = getComputedStyle(q(card, 'heater-dhw-bottom').querySelector('.heater-el')).stroke;
    check(red === 'rgb(220, 38, 38)' && red === getComputedStyle(q(card, 'heater-dhw-bottom').querySelector('.wave')).stroke && !getComputedStyle(q(card, 'heater-dhw-top').querySelector('.heater-el')).stroke.includes(red), `a running rod and its waves share the hot-water red, a rod that is off does not (${red})`);
    check(card._lossIds().extra.join() === 'sensor.rod1,sensor.rod2,sensor.rod3', `every rod in the hot-water tank excludes its run time from the standby loss (${card._lossIds().extra.join()})`);
    card.remove();
    // The plain key keeps its old place between the middle and the bottom sensor.
    card = mount({ entities: { ...ents, dhw_heater_middle: undefined, dhw_heater_bottom: undefined, dhw_heater: 'sensor.rod3' } }, hassOf(st())); await wait(20);
    const plain = rodBox(card, 'heater-dhw');
    check(mid(plain) > box(card, 't-dhw-middle').y + box(card, 't-dhw-middle').height && mid(plain) < box(card, 't-dhw-bottom').y, 'the plain dhw_heater keeps its place between the middle and the bottom label');
    card.remove();
    // A solar loop enters the right wall at the middle sensor: the middle rod moves below it.
    card = mount({ entities: { ...ents, solar_collector: 'sensor.t1' } }, hassOf(st())); await wait(20);
    check(rodBox(card, 'heater-dhw-middle').y > 168, `with solar thermal the middle rod moves below the solar loop (${rodBox(card, 'heater-dhw-middle').y.toFixed(0)})`);
    card.remove();
    // A combined storage with a fresh-water station: the bottom rod moves below the station pipes; the rods of the heating zone count for the loss.
    card = mount({ entities: { ...ents, hc_pump: 'binary_sensor.valve' }, storage: 'combined', dhw_type: 'fresh_water' }, hassOf(st())); await wait(20);
    check(rodBox(card, 'heater-dhw-bottom').y > 230, `next to a fresh-water station the bottom rod moves below its pipes (${rodBox(card, 'heater-dhw-bottom').y.toFixed(0)})`);
    card.remove();
    card = mount({ entities: { ...ents, hc_pump: 'binary_sensor.valve' }, storage: 'combined' }, hassOf(st())); await wait(20);
    check(card._lossIds()?.extra.filter((e) => /rod|switch\.b/.test(e)).length === 6, `in a combined storage every rod excludes its run time from the standby loss (${card._lossIds()?.extra.join()})`);
    card.remove();
    // The editor offers the new keys in the storage section.
    check(['dhw_heater_top', 'dhw_heater_middle', 'dhw_heater_bottom', 'buffer_heater_top', 'buffer_heater_middle', 'buffer_heater_bottom'].every((k) => HFC_ENTITY_GROUPS.sec_storage.includes(k) && HFC_EDITOR.en[k] && HFC_EDITOR.de[k]), 'the editor lists the rods per height with English and German labels');
  }

  // 19. diagnostic report, full-screen layer, custom texts and built-in card themes
  {
    const s = setups[0];
    const h = hassOf(toStates(s.states('heat')), s.registry || {}, null, s);
    h.config = { version: '2026.10.1', time_zone: 'Europe/Vienna' };
    const report = C._diagnosticReport(s.config, h);
    check(/Privacy: entity ids can contain personal names/.test(report) && /Card version: \d+\.\d+\.\d+/.test(report) && /Home Assistant: 2026\.10\.1/.test(report), 'diagnostic report identifies itself and starts with the privacy warning');
    check(/Loaded from: \S+/.test(report), 'diagnostic report names the file the card was loaded from');
    const notMapped = (report.match(/- Not mapped: ([^\n]*) \(an empty key is fine/) || [])[1] || '';
    check(/- flow: sensor\.eu08l_hp1_flow_line_temperature = 32\.4[^\n]*\[preset\]/.test(report) && /\bcompressor\b/.test(notMapped)
      && !/(^|, )flow(,|$)/.test(notMapped) && !/\bhc6_flow\b/.test(notMapped) && !/: not mapped$/m.test(report.split('Checks:')[0]), `diagnostic report: mapped states with their source, missing keys in one line (${notMapped.slice(0, 80)})`);
    check(/Detection:\n- lambda looked for: entity id \^sensor[^\n]*hp1_operating_state\$ \(lambda_heat_pumps\): found\n- Heat pump integrations here: [^\n]+\n- Presets that match here: lambda \(\d of 6 core entities\)/.test(report),
      'diagnostic report: what the lambda detection looked for, the integrations and the matching presets');
    check(/Preset: lambda/.test(report) && /Preset detected: yes/.test(report) && /Quick controls:/.test(report) && !/friendly_name/.test(report), 'diagnostic report contains detection and controls but no attribute dump');
    const card = mount(s.config, h); await wait(20);
    let copied = '';
    card._writeClipboard = async (text) => { copied = text; };
    card.shadowRoot.getElementById('diagnostic-copy').click(); await wait(0);
    check(copied === report && /copied/i.test(card.shadowRoot.getElementById('tool-status').textContent), 'diagnostic button copies the local report and announces success');

    const oldOverflow = document.body.style.overflow;
    card.shadowRoot.getElementById('fullscreen-toggle').click();
    let shell = card.shadowRoot.querySelector('ha-card');
    check(shell.classList.contains('fullscreen') && shell.getAttribute('role') === 'dialog' && shell.getAttribute('aria-modal') === 'true'
      && !card.shadowRoot.getElementById('fullscreen-backdrop').hidden && document.body.style.overflow === 'hidden', 'full-screen opens one modal card layer and locks background scrolling');
    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    shell = card.shadowRoot.querySelector('ha-card');
    check(!shell.classList.contains('fullscreen') && card.shadowRoot.getElementById('fullscreen-backdrop').hidden
      && document.body.style.overflow === oldOverflow && card.shadowRoot.activeElement?.id === 'fullscreen-toggle', 'Escape closes full-screen and returns focus to its button');
    card.shadowRoot.getElementById('fullscreen-toggle').click();
    card.shadowRoot.getElementById('fullscreen-backdrop').click();
    check(!card.shadowRoot.querySelector('ha-card').classList.contains('fullscreen'), 'a backdrop click closes full-screen');
    card.remove();
    const noFull = mount({ ...s.config, fullscreen: false }, h);
    check(!noFull.shadowRoot.getElementById('fullscreen-toggle'), 'fullscreen: false removes the button');
    noFull.remove();
    {
      // diagnostic: false hides the diagnostic report button; the editor shows it switched on by default and writes only false.
      const noDiag = mount({ ...s.config, diagnostic: false }, h);
      check(!noDiag.shadowRoot.getElementById('diagnostic-copy') && !!noDiag.shadowRoot.getElementById('fullscreen-toggle'),
        'diagnostic: false removes the diagnostic button and keeps the full-screen button');
      noDiag.remove();
      let threw = false; try { new C().setConfig({ ...s.config, diagnostic: 'no' }); } catch (e) { threw = true; }
      check(threw, 'diagnostic must be true or false');
      const keys = (n) => (n.schema ? n.schema.flatMap(keys) : [n.name]);
      check(C._formSchema(s.config).schema.flatMap(keys).includes('diagnostic'), 'editor offers the diagnostic button switch');
      const dEd = document.createElement('heatpump-flow-card-editor'); let dChanged;
      dEd.addEventListener('config-changed', (ev) => { dChanged = ev.detail.config; });
      dEd.setConfig(s.config); dEd.hass = h; await wait(10);
      const shownByDefault = dEd._form.data.diagnostic === true;
      dEd._changed({ ...dEd._form.data, diagnostic: false });
      const off = dChanged.diagnostic === false;
      dEd._changed({ ...dEd._form.data, diagnostic: true });
      check(shownByDefault && off && !('diagnostic' in dChanged), `editor: diagnostic button on by default, writes only false (${shownByDefault} / ${off} / ${JSON.stringify(dChanged.diagnostic)})`);
      dEd.remove();
    }

    const custom = { ...s.config, title: undefined, language: 'xy', texts: { xy: {
      title: 'Warmtepomp & huis', heat_pump: 'Warm <bron>', details: 'Details NL',
      modes: { heating: 'Verwarming' }, tiles: { spread: 'Verschil' },
    } } };
    const xy = mount(custom, { ...h, locale: { language: 'xy-NL' }, language: 'xy-NL' }); await wait(20);
    check(xy._lang === 'xy' && xy.shadowRoot.querySelector('.title').textContent === 'Warmtepomp & huis'
      && xy.shadowRoot.querySelector('.unit-title').textContent === 'Warm <bron>' && !xy.shadowRoot.querySelector('.unit-title').querySelector('bron'), 'custom language renders escaped labels');
    check(xy.shadowRoot.getElementById('chip-mode').textContent.startsWith('Verwarming')
      && xy.shadowRoot.getElementById('drawer-toggle').textContent.startsWith('Details NL') && xy._i.compressor_off === 'Compressor off', 'custom texts merge recursively and missing labels fall back to English');
    const tileOptions = C._tileOptions(custom, C._resolve(custom, h), h).options;
    check(tileOptions.some((o) => o.value === 'spread' && o.label === 'Verschil'), 'custom tile labels reach the editor options');
    xy.remove();

    for (const theme of ['auto', 'night', 'contrast']) {
      const themed = mount({ ...s.config, theme }, h); await wait(10);
      check(themed.shadowRoot.querySelector('ha-card').classList.contains(`theme-${theme}`), `theme ${theme} renders`);
      if (theme === 'night') check(getComputedStyle(themed.shadowRoot.querySelector('ha-card')).getPropertyValue('--card-background-color').trim() === '#111827', 'night theme supplies its dim surface');
      if (theme === 'contrast') check(getComputedStyle(themed.shadowRoot.querySelector('ha-card')).getPropertyValue('--divider-color').trim() === '#000', 'contrast theme supplies strong outlines');
      themed.remove();
    }
    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);
    const schema = C._formSchema(custom).schema;
    check(['theme', 'fullscreen', 'language'].every((key) => schema.flatMap(keysOf).includes(key)), 'editor offers theme, full-screen and language controls');
    const languageField = (() => { let found; const visit = (n) => { if (n.name === 'language') found = n; (n.schema || []).forEach(visit); }; schema.forEach(visit); return found; })();
    check(['nl', 'xy'].every((value) => languageField.selector.select.options.some((o) => o.value === value)), 'editor language selector includes built-in and configured custom languages');
    const ed = document.createElement('heatpump-flow-card-editor'); let changed;
    ed.addEventListener('config-changed', (ev) => { changed = ev.detail.config; });
    ed.setConfig(custom); ed.hass = h; await wait(10);
    ed._changed({ preset: 'lambda', language: 'xy', theme: 'night', fullscreen: false, entities: ed._form.data.entities });
    check(changed.texts.xy.title === 'Warmtepomp & huis' && changed.theme === 'night' && changed.fullscreen === false, 'editor preserves YAML translations and writes theme/full-screen options');
    ed.remove();
    // #262: own tile sources are YAML-only and survive a change in the editor.
    const tsEd = document.createElement('heatpump-flow-card-editor'); let tsChanged;
    tsEd.addEventListener('config-changed', (ev) => { tsChanged = ev.detail.config; });
    tsEd.setConfig({ ...custom, tile_sources: { energy_heating: 'sensor.x' } }); tsEd.hass = h; await wait(10);
    tsEd._changed({ preset: 'lambda', theme: 'night', entities: tsEd._form.data.entities });
    check(tsChanged?.tile_sources?.energy_heating === 'sensor.x', 'editor preserves YAML tile sources');
    tsEd.remove();
  }

  // 20. hydraulic pressure, three-point storage gradients, defrost vapour and column radiators
  {
    const states = toStates({
      'sensor.mode': 'defrost', 'sensor.flow': ['35', '°C'], 'sensor.return': ['29', '°C'], 'sensor.dhw_top': ['52', '°C'],
      'sensor.dhw_middle': ['44', '°C'], 'sensor.dhw_bottom': ['36', '°C'], 'sensor.buffer_top': ['34', '°C'],
      'sensor.buffer_middle': ['30', '°C'], 'sensor.buffer_bottom': ['26', '°C'], 'sensor.brine_pressure': ['82', 'kPa'],
      'sensor.heating_pressure': ['0.6', 'bar'], 'binary_sensor.pump': 'on',
    });
    const config = {
      source_type: 'brine', hc_type: 'column', details_open: true, tiles: ['brine_pressure', 'hc_pressure'],
      brine_pressure_min: 0.9, brine_pressure_crit: 0.6, brine_pressure_max: 2.5,
      hc_pressure_min: 1.0, hc_pressure_crit: 0.7, hc_pressure_max: 2.8,
      entities: { mode: 'sensor.mode', flow: 'sensor.flow', return: 'sensor.return', hc_pump: 'binary_sensor.pump',
        dhw_top: 'sensor.dhw_top', dhw_middle: 'sensor.dhw_middle', dhw_bottom: 'sensor.dhw_bottom',
        buffer_top: 'sensor.buffer_top', buffer_middle: 'sensor.buffer_middle', buffer_bottom: 'sensor.buffer_bottom',
        brine_pressure: 'sensor.brine_pressure', hc_pressure: 'sensor.heating_pressure' },
    };
    const card = mount(config, hassOf(states)); await wait(30);
    check(ok(card) && card.shadowRoot.querySelectorAll('.column-rib').length === 7, 'column radiator renders seven joined sections');
    check(card._pressure('brine_pressure') === 0.82, 'pressure converts kPa to bar');
    check(card.shadowRoot.getElementById('pressure-brine').classList.contains('warning') && /^! /.test(card.shadowRoot.getElementById('t-brine-pressure').textContent), 'brine pressure shows a non-colour warning');
    check(card.shadowRoot.getElementById('pressure-hc').classList.contains('critical') && /^⚠ /.test(card.shadowRoot.getElementById('t-hc-pressure').textContent), 'heating pressure shows a non-colour critical state');
    check(/bar/.test(card.shadowRoot.getElementById('pressure-hc').getAttribute('aria-label') || '') && /critical/.test(card.shadowRoot.getElementById('pressure-hc').getAttribute('aria-label') || ''), 'pressure accessibility label includes value and state');
    check(card.shadowRoot.querySelectorAll('#stats .stat').length === 2 && /0\.8 bar/.test(card.shadowRoot.getElementById('stats').textContent), 'pressure values are available as live tiles');
    check([...card.shadowRoot.querySelectorAll('#drawer-body .dsec-title')].some((x) => /Hydraulic/.test(x.textContent)) && /0\.6 bar/.test(card.shadowRoot.getElementById('drawer-body').textContent), 'pressure values are available in details');
    check(!!card.shadowRoot.getElementById('g-dhw-middle') && !!card.shadowRoot.getElementById('g-buf-middle')
      && /^44/.test(card.shadowRoot.getElementById('t-dhw-middle').textContent) && /^30/.test(card.shadowRoot.getElementById('t-buf-middle').textContent), 'middle sensors create three-point tank gradients and show the bare value at their height');
    card.remove();

    const old = setups[1];
    const twoPoint = mount(old.config, hassOf(toStates(old.states('heat')), old.registry || {}, old.energy, old)); await wait(20);

    for (const unit_style of HFC_UNIT_STYLES.filter((s) => s !== 'auto')) {

    const keysOf = (n) => (n.schema ? n.schema.flatMap(keysOf) : [n.name]);

    const emitter = (() => { let found; const visit = (n) => { if (n.name === 'hc_type') found = n; (n.schema || []).forEach(visit); }; schema.forEach(visit); return found; })();
    check(emitter.selector.select.options.some((o) => o.value === 'column'), 'editor offers column radiators');

  // 20a. return temperature label per heating circuit (#63)
  {
    const g = setups[6];

    c.remove();
    c = mount({ ...g.config, entities, hc_return_label: true }, hassOf(toStates(states), g.registry || {}, g.energy, g)); await wait(25);
    check(txt(c, 't-hc-rl') === 'RL 27.4 °C' && txt(c, 't-hc-rl2') === 'RL 31.8 °C', `circuit return labels (${txt(c, 't-hc-rl')} / ${txt(c, 't-hc-rl2')})`);
    check(c.shadowRoot.getElementById('t-hc-rl').parentNode.dataset.entity === 'sensor.floor_return', 'the label opens its own return sensor');

    const l2 = c.shadowRoot.getElementById('t-hc-rl2').getBBox(); const r2 = c.shadowRoot.getElementById('t-hc-mode2').getBBox();
    check(l2.x + l2.width <= r2.x + 1, `circuit 2: return label ends left of the status line (${Math.round(l2.x + l2.width)} / ${Math.round(r2.x)})`);

    // without an own return sensor nothing is shown, the buffer or heat pump return is not repeated
    c = mount({ ...g.config, hc_return_label: true }, hassOf(toStates(g.states('heat')), g.registry || {}, g.energy, g)); await wait(25);
    check(txt(c, 't-hc-rl') === '' && txt(c, 't-hc-rl2') === '', 'no label without a circuit return entity');
    c.remove();
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('hc_return_label'), 'editor offers the circuit return label');
  }

  // 20a2. hc_flow_label: false hides the flow temperature at the circuits, the target stays (#291)
  {
    const st = toStates({ 'sensor.f': ['48', '°C'], 'sensor.r': ['40', '°C'], 'sensor.c': ['40', 'Hz'], 'sensor.hcf': ['33', '°C'], 'sensor.set': ['34', '°C'], 'sensor.off': ['2', 'K'] });
    const ents = { flow: 'sensor.f', return: 'sensor.r', compressor: 'sensor.c', hc_setpoint: 'sensor.set' };
    const txt = (c, id) => c.shadowRoot.getElementById(id)?.textContent ?? '(missing)';
    // Direct circuit without its own sensor: it shows the heat pump flow by default.
    let c = mount({ entities: ents }, hassOf(st)); await wait(20);
    const shown = txt(c, 't-hc');
    c.remove();
    c = mount({ entities: ents, hc_flow_label: false }, hassOf(st)); await wait(20);
    check(shown === '48.0 °C · Target 34.0' && txt(c, 't-hc') === 'Target 34.0', `hc_flow_label: false leaves only the target at the circuit (${shown} / ${txt(c, 't-hc')})`);
    c.remove();
    // With a heating curve shift the flow stands below the pump; it goes as well, the target text stays.
    c = mount({ entities: { ...ents, hc_flow: 'sensor.hcf', hc_curve_offset: 'sensor.off' }, hc_flow_label: false }, hassOf(st)); await wait(20);
    check(txt(c, 't-hc-now') === '' && txt(c, 't-hc').startsWith('Target 34'), `hc_flow_label: false with a curve shift (${txt(c, 't-hc-now')} / ${txt(c, 't-hc')})`);
    c.remove();
    let error = '';
    try { new C().setConfig({ hc_flow_label: 'no' }); } catch (e) { error = e.message; }
    check(error === 'hc_flow_label must be true or false', `hc_flow_label must be a boolean (${error})`);
    check(C._formSchema({}).schema.flatMap(function keysOf(n) { return n.schema ? n.schema.flatMap(keysOf) : [n.name]; }).includes('hc_flow_label'), 'editor offers the circuit flow label');
    const report = C._diagnosticReport({ hc_flow_label: false, entities: ents }, hassOf(st));
    check(report.includes('Circuit labels: flow hidden · return hidden'), 'the report names the circuit label options');
  }

  // 20b. DHW tank with only a sensor near the bottom (HeishaMon has one tank sensor; its position depends on the tank)
  {
    const states = toStates({ 'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'], 'sensor.dhw': ['37', '°C'] });
    const card = mount({ entities: { flow: 'sensor.flow', return: 'sensor.return', dhw_bottom: 'sensor.dhw' } }, hassOf(states)); await wait(20);
    const $ = (id) => card.shadowRoot.getElementById(id);
    check(ok(card) && !!card.shadowRoot.querySelector('rect.tank'), 'DHW tank is drawn with only a bottom sensor');
    check($('t-dhw-top').textContent === '' && $('t-dhw-bottom').textContent === card._t(37), `the value shows at the bottom without a position label (${$('t-dhw-bottom').textContent})`);
    check($('g-dhw-top').getAttribute('stop-color') === card._tankColor(NaN)
      && $('g-dhw-top').getAttribute('stop-color') !== $('g-dhw-bottom').getAttribute('stop-color'), 'an unmeasured upper tank zone stays neutral instead of copying the bottom sensor');
    check(card.shadowRoot.querySelector('rect.tank').closest('.tap')?.getAttribute('data-entity') === 'sensor.dhw', 'tapping the tank opens the bottom sensor');
    card.remove();
    const preset = mount({ preset: 'heishamon', entities: { dhw_top: null, dhw_bottom: 'sensor.panasonic_heat_pump_main_dhw_temp' } }, hassOf(toStates({
      'sensor.panasonic_heat_pump_main_main_outlet_temp': ['36', '°C'], 'sensor.panasonic_heat_pump_main_main_inlet_temp': ['32', '°C'],
      'sensor.panasonic_heat_pump_main_dhw_temp': ['37', '°C'],
    }))); await wait(20);
    check(!preset._has('dhw_top') && /37/.test(preset.shadowRoot.getElementById('t-dhw-bottom').textContent), 'a preset sensor can be moved from top to bottom in the config');
    preset.remove();
    const layered = mount({ entities: { flow: 'sensor.flow', return: 'sensor.return', dhw_middle: 'sensor.mid', dhw_bottom: 'sensor.dhw' } }, hassOf(toStates({
      'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'], 'sensor.mid': ['44', '°C'], 'sensor.dhw': ['37', '°C'],
    }))); await wait(20);
    check(layered.shadowRoot.getElementById('g-dhw-top').getAttribute('stop-color') === layered._tankColor(NaN)
      && layered.shadowRoot.getElementById('g-dhw-middle').getAttribute('stop-color') === layered._tankColor(44)
      && layered.shadowRoot.getElementById('g-dhw-bottom').getAttribute('stop-color') === layered._tankColor(37), 'middle and bottom sensors colour only their measured tank zones');
    layered.remove();
  }

  // 20c. radiator ribs take the flow and return colours: every gradient id is unique, the ribs use the coloured one
  {
    const p = 'panasonic_heat_pump';
    const states = toStates({
      [`sensor.${p}_main_main_outlet_temp`]: ['33.5', '°C'], [`sensor.${p}_main_main_inlet_temp`]: ['27.5', '°C'],
      [`sensor.${p}_main_compressor_freq`]: ['30', 'Hz'], [`sensor.${p}_main_threeway_valve_state`]: 'Room',
    });
    for (const hc_count of [1, 2]) {
      const card = mount({ preset: 'heishamon', hc_type: 'radiator', hc_count }, hassOf(states)); await wait(20);
      const root = card.shadowRoot;
      const ids = [...root.querySelectorAll('[id]')].map((e) => e.id).filter((id) => id.startsWith('g-rad'));
      check(ids.length === new Set(ids).size, `${hc_count} circuit(s): the radiator gradient ids are unique (${ids.join(', ')})`);
      const rib = root.querySelector('rect.rib');
      const grad = root.getElementById(rib.style.fill.match(/#([^"')]+)/)[1]);
      const top = getComputedStyle(grad.querySelector('stop')).stopColor;
      check(grad.querySelector('stop').id === 'g-rad-top' && top !== 'rgb(0, 0, 0)', `${hc_count} circuit(s): the radiator ribs show the flow colour, not black (${top})`);
      card.remove();
    }
  }

  // 21. built-in languages: a partly translated language works without gaps and shows up in the editor (docs/TRANSLATING.md)
  {
    HFC_LANGUAGES.xx = 'Xxish';
    HFC_I18N.xx = { title: 'Xx title', det: { hours: 'Xx hours' }, modes: { heating: 'Xx heating' } };
    HFC_EDITOR.xx = { title: 'Xx editor title' };
    try {
      const options = C._formSchema({ texts: { xy: { title: 'x' } } }).schema.flatMap(function find(n) { return n.name === 'language' ? [n.selector.select.options] : n.schema ? n.schema.flatMap(find) : []; })[0];
      check(options[0].value === 'auto' && ['de', 'en', 'nl', 'xx', 'xy'].every((v) => options.some((o) => o.value === v)), 'the editor lists Auto, the built-in languages and the custom ones');
      check(options.find((o) => o.value === 'xx').label === 'Xxish' && options.find((o) => o.value === 'de').label === 'Deutsch', 'built-in languages are listed with their own name');
      check(options.filter((o) => o.value === 'de').length === 1 && options.filter((o) => o.value === 'xx').length === 1, 'a language is listed once');
      check(hfcBuiltin(HFC_EDITOR, 'xx').title === 'Xx editor title' && hfcBuiltin(HFC_EDITOR, 'xx').preset === HFC_EDITOR.en.preset, 'editor labels of a partial language fall back to English');
      check(hfcBuiltin(HFC_I18N, 'xx').det.hours === 'Xx hours' && hfcBuiltin(HFC_I18N, 'xx').det.starts_total === HFC_I18N.en.det.starts_total, 'nested texts of a partial language fall back to English');
      const states = toStates({ 'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'] });
      const xx = mount({ language: 'xx', entities: { flow: 'sensor.flow', return: 'sensor.return' } }, hassOf(states)); await wait(20);
      check(ok(xx) && xx._lang === 'xx' && xx.shadowRoot.querySelector('.title').textContent === 'Xx title' && xx._i.compressor_off === HFC_I18N.en.compressor_off,
        'a built-in language selects by code and the missing card texts are English');
      xx.remove();
      const regional = mount({ language: 'xx-yy', entities: { flow: 'sensor.flow', return: 'sensor.return' } }, hassOf(states)); await wait(20);
      check(regional._lang === 'xx', 'a regional variant uses the built-in language of its base code');
      regional.remove();
      check(C._language({}, { locale: { language: 'xx-YY' } }) === 'xx' && C._language({}, { locale: { language: 'qq' } }) === 'en', 'the Home Assistant language selects a built-in language, unknown ones use English');
    } finally { delete HFC_LANGUAGES.xx; delete HFC_I18N.xx; delete HFC_EDITOR.xx; }
  }

  // #192: plausibility checks of the mapped entities; #194: entity pickers filtered by the kind of the field
  {
    const codes = (cfg, states) => C._checks(cfg, hassOf(toStates(states))).map((f) => `${f.key}:${f.code}`).sort().join(' ');
    const base = { 'sensor.flow': ['35', '°C'], 'sensor.return': ['30', '°C'], 'sensor.power': ['1200', 'W'] };
    const ents = { flow: 'sensor.flow', return: 'sensor.return', power: 'sensor.power' };
    check(codes({ entities: ents }, base) === '', 'a correct mapping has no findings');
    for (const unit of ['W', 'kW', 'MW']) {
      check(codes({ entities: { ...ents, battery: 'sensor.source' } }, { ...base, 'sensor.source': { state: '1', attributes: { unit_of_measurement: unit, device_class: 'power', state_class: 'measurement' } } }) === '',
        `manual ${unit} power source has no plausibility finding`);
    }
    for (const unit of ['Wh', 'kWh']) {
      check(codes({ entities: { ...ents, battery: 'sensor.source' } }, { ...base, 'sensor.source': { state: '1', attributes: { unit_of_measurement: unit, device_class: 'energy', state_class: 'total_increasing' } } }) === 'battery:unit',
        `manual ${unit} energy counter is rejected as live power`);
    }
    // The mix-ups of the reports #75, #180, #186, #189
    check(codes({ entities: { ...ents, valve: 'sensor.ww_temp' } }, { ...base, 'sensor.ww_temp': ['unknown', '°C'] }) === 'valve:unit', '#186: a temperature as the valve');
    check(codes({ entities: { ...ents, heater: 'sensor.rod_starts' } }, { ...base, 'sensor.rod_starts': { state: '244', attributes: { state_class: 'total_increasing' } } }) === 'heater:counter',
      '#186: the heater starts counter as the heater');
    check(codes({ entities: { ...ents, room: 'select.room_mode' } }, { ...base, 'select.room_mode': 'internal' }) === 'room:domain', '#75: a select as the room temperature');
    check(codes({ entities: { ...ents, room: 'sensor.room_mode' } }, { ...base, 'sensor.room_mode': 'internal' }) === 'room:state', 'a text sensor as the room temperature');
    check(codes({ entities: { ...ents, buffer_top: 'sensor.flow' } }, base) === 'buffer_top:same', '#75/#180: the heat pump flow as the buffer top');
    check(codes({ entities: { ...ents, volume: 'sensor.hc_flow_rate', source_volume: 'sensor.hc_flow_rate' } }, { ...base, 'sensor.hc_flow_rate': ['1046', 'L/h'] })
      === 'source_volume:air source_volume:same', '#180: one flow rate as heat pump and source loop, on an air heat pump');
    check(codes({ source_type: 'brine', entities: { ...ents, volume: 'sensor.v1', source_volume: 'sensor.v2' } }, { ...base, 'sensor.v1': ['900', 'l/h'], 'sensor.v2': ['1500', 'l/h'] }) === '',
      'a brine heat pump with its own source flow rate has no findings');
    check(codes({ entities: { ...ents, starts_today: 'sensor.starts' } }, { ...base, 'sensor.starts': '6386' }) === 'starts_today:today', '#189: the total starts as starts today');
    check(codes({ entities: { ...ents, energy_today: 'sensor.heat_today', heat_total: 'sensor.heat_today' } }, { ...base, 'sensor.heat_today': ['12.4', 'kWh'] }) === 'energy_today:same',
      '#189: one daily heat counter as energy today and heat total');
    check(codes({ entities: { ...ents, energy_today: 'sensor.e' } }, { ...base, 'sensor.e': ['200000', 'Wh'] }) === 'energy_today:today'
      && codes({ entities: { ...ents, energy_today: 'sensor.e' } }, { ...base, 'sensor.e': ['5000', 'Wh'] }) === '', 'energy today converts Wh before comparing with one day');
    check(codes({ entities: { ...ents, mode: 'sensor.mode_temp' } }, { ...base, 'sensor.mode_temp': ['21', '°C'] }) === 'mode:unit', 'a temperature as the operating mode');
    // #276: the chosen operating mode (a select) as the current one keeps the card idle.
    const chosen = { ...base, 'select.hp_operating_mode_state': { state: 'Heat only', attributes: { options: ['Heat only', 'Cool only', 'Heat+DHW'] } } };
    check(codes({ entities: { ...ents, mode: 'select.hp_operating_mode_state' } }, chosen) === 'mode:setting'
      && codes({ entities: { ...ents, mode: 'input_select.hp_mode' } }, { ...base, 'input_select.hp_mode': 'Auto' }) === 'mode:setting'
      && codes({ entities: { ...ents, mode: 'sensor.hp_activity' } }, { ...base, 'sensor.hp_activity': 'heating' }) === '', '#276: a select as the operating mode is a setting, a sensor is not');
    const setting = C._checks({ entities: { ...ents, mode: 'select.hp_operating_mode_state' } }, hassOf(toStates(chosen)))[0];
    check(C._checkText(setting, HFC_EDITOR.de).startsWith('mode: select.hp_operating_mode_state ist eine Einstellung (select)'), `#276: the finding text (${C._checkText(setting, HFC_EDITOR.de)})`);
    // Mappings that look alike but are right
    check(codes({ entities: { ...ents, valve: 'binary_sensor.v', heater: 'sensor.rod', compressor: 'sensor.hz', hc_volume: 'sensor.vol', volume: 'sensor.vol', room: 'climate.house',
      room_target: 'climate.house', dhw_top: 'water_heater.dhw', dhw_target: 'water_heater.dhw', outdoor: 'sensor.out', source_in: 'sensor.out', hc_curve_offset: 'number.shift' } },
    { ...base, 'binary_sensor.v': 'on', 'sensor.rod': ['3000', 'W'], 'sensor.hz': ['48', 'Hz'], 'sensor.vol': ['0.69', 'm³/h'], 'climate.house': 'heat', 'water_heater.dhw': 'eco',
      'sensor.out': ['4', '°C'], 'number.shift': ['2', 'K'] }) === '', 'thermostats for reading and target, one flow rate without buffer, air inlet = outdoor: no findings');
    check(codes({ entities: { ...ents, dhw_top: 'sensor.tank' } }, { ...base, 'sensor.tank': 'unavailable' }) === '', 'an unavailable sensor without unit is not a finding');
    check(codes({ entities: { ...ents, dhw_top: 'sensor.t1', dhw_bottom: 'sensor.t2', hours: 'sensor.h' } }, { ...base, 'sensor.t1': ['48', 'ºC'], 'sensor.t2': ['40', '℃'], 'sensor.h': ['7900', 'hours'] }) === ''
      && C._fit('temperature', 'sensor.t1', { state: '48', attributes: { unit_of_measurement: 'ºC' } }).verdict === 'ok', 'other spellings of °C and hours are no finding');
    check(codes({ entities: { ...ents, heater: ['sensor.rod1', 'sensor.rod2'] } }, { ...base, 'sensor.rod1': ['0', 'W'], 'sensor.rod2': ['12', '°C'] }) === 'heater:unit',
      'each member of a sum is checked');
    // Every demo maps plausibly; ViCare names its start counter itself (stat_labels) and is no finding
    const demoFindings = setups.flatMap((s, i) => scenarios.flatMap(([scen]) => C._checks(s.config, hassOf(toStates(s.states(scen)), s.registry || {})).map((f) => `${i}/${scen} ${f.key}:${f.code}`)));
    check(!demoFindings.length, `no findings in the demos (${demoFindings.slice(0, 3).join(', ')})`);
    // Report and editor
    const vh = hassOf(toStates({ ...base, 'sensor.ww_temp': ['50', '°C'] }));
    const cfgBad = { entities: { ...ents, valve: 'sensor.ww_temp' } };
    check(/Checks:\n- valve: sensor\.ww_temp reports °C, expected on\/off, or a state like Tank\/Room\./.test(C._diagnosticReport(cfgBad, vh))
      && /Checks:\n- no findings/.test(C._diagnosticReport({ entities: ents }, vh)), 'the diagnostic report lists the checks in English');
    const ed = document.createElement('heatpump-flow-card-editor'); ed.setConfig(cfgBad); ed.hass = vh;
    check(ed._warn.innerHTML.includes(HFC_EDITOR.en.checks_title) && ed._warn.innerHTML.includes('sensor.ww_temp reports °C')
      && /^Diverter valve towards hot water: sensor\.ww_temp/.test(ed._form.computeHelper({ name: 'valve' })), 'the editor shows the finding above the form and at the field');
    check(!ed._warn.innerHTML.includes(HFC_EDITOR.en.warn_valve.slice(0, 40)), 'a valve that does not fit gets no value-map hint on top');
    ed.setConfig({ entities: ents });
    check(!ed._warn.innerHTML.includes(HFC_EDITOR.en.checks_title), 'no check box without findings');
    // #194: pickers
    const ph = hassOf(toStates({ ...base, 'sensor.nounit': '20', 'select.mode': 'auto', 'climate.house': 'heat', 'sensor.dc': { state: '22', attributes: { device_class: 'temperature' } },
      'sensor.flow_rate': ['900', 'l/h'], 'binary_sensor.pump': 'on' }));
    ed.hass = ph; ed.setConfig({ entities: { ...ents, room: 'sensor.nounit' } });
    const field = (name) => ed._form.schema.flatMap((s) => s.schema || [s]).flatMap((s) => s.schema || [s]).find((s) => s.name === name);
    const inc = (name) => field(name)?.selector.entity.include_entities;
    check(inc('flow')?.join() === 'climate.house,sensor.dc,sensor.flow,sensor.return', `a temperature field offers temperatures by unit, device class and thermostat (${inc('flow')})`);
    check(inc('room')?.includes('sensor.nounit') && !inc('flow').includes('sensor.nounit'), 'an entity already mapped stays selectable');
    check(inc('volume')?.join() === 'sensor.flow_rate' && inc('power')?.join() === 'sensor.power', 'flow rate and power fields offer their kind');
    check(field('hc_pump').selector.entity.domain?.includes('binary_sensor') && !inc('hc_pump') && !inc('mode') && !field('mode').selector.entity.domain,
      'on/off fields keep their domains, text fields are not filtered');
    let sent = 0; ed.addEventListener('config-changed', () => sent++);
    ed._changed({ ...ed._form.data, all_entities: true });
    check(sent === 0 && !('all_entities' in ed._config) && !inc('flow') && field('all_entities'), '"Show all entities" lifts the filter without changing the card configuration');
    ed._changed({ ...ed._form.data, title: 'x' });
    check(sent === 1 && !('all_entities' in ed._config) && !inc('flow'), 'the switch is not written with other changes');
    ed.remove();
    check(!C.getConfigForm().schema.some((s) => s.name === 'all_entities'), 'the plain form has no picker switch');
    // One table: the on/off keys of the pickers and the units in the labels follow the kinds
    check(['compressor', 'valve', 'hc_pump', 'hc6_pump', 'circulation', 'defrost', 'heater', ...HFC_TANK_HEATERS, 'bypass_valve', 'solar_pump'].every((k) => HFC_BINARY_KEYS.includes(k)),
      'the on/off keys follow from the kind table');
    const unitMismatch = ['en', 'de'].flatMap((lang) => Object.values(HFC_ENTITY_GROUPS).flat().filter((k) => !/^hc[2-6]_/.test(k)).filter((k) => {
      const unit = HFC_KINDS[hfcKindOf(k)]?.label; const label = HFC_EDITOR[lang][k];
      return unit && label && !label.includes(unit);
    }).map((k) => `${lang}.${k}`));
    check(!unitMismatch.length, `field labels name the unit of their kind (${unitMismatch.join(', ')})`);
    check(Object.values(HFC_ENTITY_GROUPS).flat().every((k) => hfcKindOf(k) || k === 'eev'), 'every entity key has a kind');
  }

  // #193: core fields first, further fields in "More fields", no source fields on an air heat pump
  {
    const groupOf = (cfg, sec) => C._formSchema(cfg).schema.find((g) => g.type === 'expandable' && g.name === 'entities' && g.title === HFC_EDITOR.en[sec]);
    const direct = (g) => g.schema.filter((f) => f.type !== 'expandable').map((f) => f.name);
