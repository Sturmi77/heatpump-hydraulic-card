<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heatpump Flow Card – topology test</title>
<!--
  Safety net for changes to the drawing and the flow logic (docs/TOPOLOGY.md, stage 0a). Runs in a headless browser like selftest.html.

  1. Snapshot: every demo installation in every layout and scenario, and every generated combination below in every operating state,
     is reduced to two fingerprints – the geometry of the schematic and its state (which pipe flows, classes, colours, texts) – and
     compared with test/topology-snapshot.js. A refactor that must not change what users see keeps both fingerprints.
  2. Combinations: the storage strategies the card draws (direct, parallel buffer, series buffer with and without bypass valve,
     combined storage) × hot-water tank (none, tank, tank with solar; a combined storage always holds it) × primary pump × 1–6 heating circuits,
     plus the hot-water preparations (fresh-water station on the buffer or the combined storage, tank in tank); source type, emitters, heaters, power
     sources and layout rotate through the cases. Each combination is checked for the same invariants: it renders, every pipe ends
     at another pipe or a component, a flowing pipe never ends at a closed one, components do not overlap, everything stays inside
     the drawing, and the schematic is one tab stop with labelled parts.

  ?dump writes the full descriptions as JSON into <pre id="dump"> instead of comparing (scripts/topology-snapshot.mjs uses it).
  Result: <pre id="result">PASS</pre> or FAIL with the failed checks.
-->
<!-- The card inherits the page font outside Home Assistant. The test draws in Roboto, the font of Home Assistant, from a copy in
     the repository (fonts/roboto.woff2, subset of the variable font, SIL Open Font License in fonts/OFL.txt), so every browser and
     system measures the same widths as a dashboard. Without it each browser fell back to its own default, a wide serif in Firefox
     on Ubuntu. Characters outside the subset fall back to Arial (Liberation Sans on Linux, same metrics). Chromium on Linux
     rounds glyph advances to whole pixels unless text is drawn with geometric precision, which made English labels about
     4 % wider than on Windows and macOS; geometricPrecision gives every system the font's own widths. -->
<style>
@font-face { font-family: "HFC Test Roboto"; src: url("fonts/roboto.woff2") format("woff2"); font-weight: 400 800; }
#stage { width: 900px; font-family: "HFC Test Roboto", Arial, "Liberation Sans", sans-serif; text-rendering: geometricPrecision; }
#stage.narrow { width: 420px; }
</style>
</head>
<body>
<pre id="result">RUNNING</pre>
<pre id="log"></pre>
<pre id="dump"></pre>
<div id="stage"></div>
<script src="../dist/heatpump-hydraulic-card.js"></script>
<script src="../demo/setups.js"></script>
<script src="topology-snapshot.js"></script>
<script src="drawing-collisions.js"></script>
<script src="field-cases.js"></script>
<script>
(async () => {
  const C = customElements.get('heatpump-flow-card');
  const params = new URLSearchParams(location.search);
  const dump = params.has('dump');
  const update = params.has('update');
  // ?only=<regular expression> draws only the matching cases and leaves them on the page (for a look or a screenshot); the
  // snapshot comparison is skipped then.
  const only = params.get('only') ? new RegExp(params.get('only')) : null;
  const want = (name) => !only || only.test(name);
  const done = (card) => { if (!only) card.remove(); };
  // ?sweep&lang=<code>&width=<px> is the nightly run (layout sweep in test/selftest.spec.mjs): instead of the snapshot and the
  // pseudo-localisation, the long-text passes (demos, combinations, zone matrices) draw in one real language at one card width.
  const sweep = params.has('sweep');
  const sweepLang = params.get('lang') || 'en';
  const sweepWidth = Number(params.get('width')) || 900;
  if (sweep && !HFC_LANGUAGES[sweepLang]) throw new Error(`unknown language ${sweepLang}`);
  const LONG = sweep ? `${sweepLang} ${sweepWidth} px` : 'long texts';
  const fails = []; let checks = 0;
  const check = (ok, label) => { checks++; if (!ok) fails.push(label); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const stage = document.getElementById('stage');
  // Every width depends on the test font: wait for it, and fail plainly when it is missing.
  await Promise.all(['400', '600', '700'].map((w) => document.fonts.load(`${w} 16px "HFC Test Roboto"`).catch(() => [])));
  if (![...document.fonts].some((f) => f.family.replace(/"/g, '') === 'HFC Test Roboto' && f.status === 'loaded')) {
    throw new Error('test font fonts/roboto.woff2 did not load (open the page over http, e.g. npm run dev)');
  }

  // Same state format and Home Assistant stub as selftest.html.
  const toStates = (obj) => {
    const out = {};
    for (const [k, v] of Object.entries(obj)) {
      if (v && typeof v === 'object' && !Array.isArray(v)) { out[k] = { entity_id: k, attributes: {}, ...v }; continue; }
      const [state, unit] = Array.isArray(v) ? v : [v];
      out[k] = { entity_id: k, state, attributes: unit ? { unit_of_measurement: unit } : {} };
    }
    return out;
  };
  const hassOf = (states, registry = {}, energy, setup = {}) => ({
    // Snapshot timestamps must use the same Home Assistant zone on developer machines and UTC CI runners.
    states, entities: registry, config: { time_zone: 'Europe/Vienna' }, locale: { language: 'en' }, language: 'en',
    callWS: (m) => (m.type === 'recorder/statistic_during_period' ? statChange(setup, m)
      : m.type === 'history/history_during_period' && setup.states ? historySim(setup, m)
      : m.type === 'energy/get_prefs' && energy ? Promise.resolve(energy) : Promise.reject(new Error('n/a'))),
    callService: () => Promise.resolve(),
  });
  const mount = (config, hass, narrow = false) => {
    C._energyPrefs = null;
    stage.className = narrow && !sweep ? 'narrow' : '';
    stage.style.width = sweep ? `${sweepWidth}px` : '';
    const card = document.createElement('heatpump-flow-card');
    card.setConfig(config);
    stage.appendChild(card);
    card.hass = hass; card.hass = { ...hass };
    return card;
  };

  /* ---------- fingerprints ---------- */
  // Geometry: the attributes that place and shape an element. Everything else (class, style, colours, labels, text) is state.
  const GEO = new Set(['d', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'width', 'height', 'points', 'transform',
    'viewBox', 'dx', 'dy', 'textLength', 'lengthAdjust', 'text-anchor', 'offset']);
  // Placed or shortened by measured text widths, which depend on the fonts of the browser: the position is recorded as present,
  // the text not at all. The room line of a circuit drops its target where it does not fit; the target is its own text, the
  // room value a tspan and still recorded.
  const measuredX = (el) => /^t-hc-(mode|room)\d*$/.test(el.id);
  const measuredText = (el, root) => {
    if (/^t-hc-room\d*$/.test(el.id)) return true;
    const m = /^t-hc(\d*)$/.exec(el.id); return !!m && !!root.getElementById(`t-hc-now${m[1]}`);
  };
  // Inline styles set by script are serialised by each browser in its own way: declarations sorted, spaces normalised, and the
  // depth of a transform origin (Firefox adds "0px") left out.
  const style = (value) => value.split(';').map((d) => d.trim().replace(/\s*:\s*/, ':').replace(/\s+/g, ' ').replace(/^(transform-origin:\S+ \S+) 0px$/, '$1'))
    .filter(Boolean).sort().join('; ');
  const describe = (card) => {
    const root = card.shadowRoot;
    const svg = root.getElementById('svg');
    if (!svg) return { geo: ['(no schematic)'], state: [`failed ${!!card._failed}`] };
    const geo = []; const state = [];
    for (const el of [svg, ...svg.querySelectorAll('*')]) {
      const name = `${el.tagName}${el.id ? `#${el.id}` : ''}`;
      const g = []; const s = [];
      for (const a of [...el.attributes].sort((p, q) => (p.name < q.name ? -1 : 1))) {
        if (a.name === 'id') continue;
        if (GEO.has(a.name)) g.push(`${a.name}=${a.name === 'x' && measuredX(el) ? '*' : a.value}`);
        else if (a.name === 'style') { if (style(a.value)) s.push(`style=${style(a.value)}`); } else s.push(`${a.name}=${a.value}`);
      }
      const own = [...el.childNodes].filter((n) => n.nodeType === 3).map((n) => n.textContent).join('');
      if (own.trim() && !measuredText(el, root)) s.push(`"${own}"`);
      geo.push(`${name} ${g.join(' ')}`);
      state.push(`${name} ${s.join(' ')}`);
    }
    return { geo, state };
  };
  // FNV-1a, 32 bit: enough to notice a change; ?dump shows what changed.
  const hash = (lines) => {
    let h = 0x811c9dc5;
    const text = lines.join('\n');
    for (let n = 0; n < text.length; n++) { h ^= text.charCodeAt(n); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  };
  // Waits until asynchronous answers (energy dashboard, statistics, history) have settled: three identical readings in a row, the
  // last two 5 ms apart. Two readings were not enough for the energy split of a demo, which once arrived between them.
  const settled = async (card) => {
    let last = ''; let same = 0; let d;
    for (let n = 0; n < 40; n++) {
      await wait(n < 2 ? 0 : 5);
      d = describe(card);
      const now = hash(d.geo) + hash(d.state);
      same = now === last ? same + 1 : 0;
      if (same >= 2) return d;
      last = now;
    }
    return d;
  };
  const base = window.HFC_TOPOLOGY_SNAPSHOT;
  // Known layout conflicts: found by the zone matrices, left for the layout step of #395 (stage 3, label positions and priorities
  // on narrow cards) because no fixed coordinate fits them. A matching collision is not counted; an entry that no longer matches
  // anything in a full run fails, so the fix that solves it also removes it here. Never add an entry to make a new change pass.
  const KNOWN = [
    { why: 'narrow card or long texts: with a heating curve shift the two-line target next to a buffer or further circuits reaches the circuit title',
      case: /^(zone circuit .*\bcurve\b.* narrow|[^:]+: zone circuit .*\bcurve\b.*)$/, hit: /^t-hc\d* (overlaps|is closer than \d+ units to) tank-title / },
    { why: 'cards narrower than 400 px (nightly sweep): with a heating curve shift and a mixer the flow temperature under the pump reaches the mixer bypass',
      case: /^[a-z]{2} 3\d\d px: zone circuit .*\bmixer curve\b/, hit: /^t-hc-now\d* lies on pipe p-hc-mix\d*$/, sweepOnly: true },
  ];
  const knownSeen = new Set();
  const known = (name, hit) => {
    const k = KNOWN.findIndex((x) => x.case.test(name) && x.hit.test(hit));
    if (k >= 0) knownSeen.add(k);
    return k >= 0;
  };
  const checkDrawing = (card, name) => {
    const svg = card.shadowRoot.getElementById('svg');
    check(!!svg, `${name}: missing schematic`);
    if (!svg) return;
    const hits = drawingCollisions(svg).filter((hit) => !known(name, hit));
    check(!hits.length, `${name}: ${hits.join(', ')}`);
  };
  // In English with the usual values every label fits its width budget: a shortened text or a dropped prefix there means the
  // budget is too tight and would hide information from most users.
  const checkFits = (card, name) => {
    const svg = card.shadowRoot.getElementById('svg'); if (!svg) return;
    // A label marked data-fit-pre="optional" stands where even English leaves its prefix out by design.
    const cut = [...svg.querySelectorAll('text[data-fit]')]
      .filter((el) => el.textContent.endsWith('…') || (el.querySelector('.fit-off') && el.dataset.fitPre !== 'optional'))
      .map((el) => el.id || el.getAttribute('class'));
    check(!cut.length, `${name}: English labels fit their width (${cut.join(', ')})`);
  };
  /* ---------- long texts and wide values (pseudo-localisation, used by sections 3 and 4) ---------- */
  // For each text the longest translation of all built-in languages, so a new language is included without a change here.
  const longest = (blocks) => {
    const out = {};
    for (const [key, ref] of Object.entries(blocks[0])) {
      if (Array.isArray(ref)) continue;
      if (ref && typeof ref === 'object') { out[key] = longest(blocks.map((b) => (b?.[key] && typeof b[key] === 'object' ? b[key] : {}))); continue; }
      if (typeof ref !== 'string') continue;
      out[key] = blocks.map((b) => b?.[key]).filter((v) => typeof v === 'string').reduce((a, v) => (v.length > a.length ? v : a), ref);
    }
    return out;
  };
  const texts = { en: longest(Object.keys(HFC_LANGUAGES).map((lang) => HFC_I18N[lang] || {})) };
  // Wide values: one decimal everywhere, two-digit negatives for low temperatures, four-digit flow rates, power in kW. Zero
  // stays zero and the sign of a temperature only changes below 10 °C, so running and standing parts keep their state.
  const wideValue = (state, unit) => {
    const v = parseFloat(state);
    if (!Number.isFinite(v) || typeof unit !== 'string') return state;
    const u = unit.toLowerCase();
    if (u === '°c' || u === '°f') return (v < 10 ? -(Math.abs(v) + 10.3) : v + 0.04).toFixed(1);
    if (u === 'w') return v >= 100 ? String(Math.round(v * 7.3 + 1234)) : state;
    if (u === 'kw') return v > 0 ? (v + 10.25).toFixed(2) : state;
    if (u === 'l/h') return v > 0 ? '1444' : state;
    if (u === 'l/min' || u === 'm³/h') return v > 0 ? (v + 10.06).toFixed(2) : state;
    if (u === 'bar') return '1.85';
    if (u === 'k') return (v < 0 ? v - 10.25 : v + 10.25).toFixed(1);
    return state;
  };
  const widen = (map) => Object.fromEntries(Object.entries(map).map(([id, v]) => {
    if (Array.isArray(v)) return [id, [wideValue(v[0], v[1]), ...v.slice(1)]];
    if (v && typeof v === 'object' && v.state !== undefined) return [id, { ...v, state: wideValue(v.state, v.attributes?.unit_of_measurement) }];
    return [id, v];
  }));
  const named = (config) => {
    const out = sweep ? { ...config, language: sweepLang } : { ...config, texts, language: 'en' };
    const count = config.hc_count || 1;
    out.hc_name = 'Fußbodenheizung Erdgeschoss';
    for (let n = 2; n <= count; n++) out[`hc${n}_name`] = `Heizkörper Obergeschoss ${n}`;
    return out;
  };
  // Waits until the schematic stops changing (cheaper than `settled`, for cases that are only checked, not recorded).
  const quiet = async (card) => {
    let last = null;
    for (let n = 0; n < 30; n++) {
      await wait(n < 2 ? 0 : 5);
      const now = card.shadowRoot.getElementById('svg')?.innerHTML ?? '';
      if (n >= 2 && now === last) return;
      last = now;
    }
  };
  // One checked case: drawn, collision-checked (and in English with the usual values: every label fits its budget), removed.
  const probe = async (name, config, states, { narrow = false, english = false, energy } = {}) => {
    if (!want(name)) return;
    const card = mount(config, hassOf(toStates(states), {}, energy), narrow);
    if (only) card.dataset.case = name;
    await quiet(card);
    checkDrawing(card, name);
    if (english) checkFits(card, name);
    done(card);
  };

  const results = {}; const full = {};
  const record = (key, d) => {
    const h = `${hash(d.geo)} ${hash(d.state)}`;
    results[key] = dump ? { h, ...d } : h;
    // Kept in full only for the first changed case of each setup or storage strategy, at most three.
    const group = key.split(' ').slice(0, 2).join(' ');
    if (!dump && !update && base && key in base && base[key] !== h && Object.keys(full).length < 3 && !Object.keys(full).some((k) => k.startsWith(`${group} `))) full[key] = d;
  };

  /* ---------- 1. demo installations ---------- */
  if (!sweep) for (const [i, s] of setups.entries()) {
    for (const layout of [...HFC_LAYOUTS, 'narrow']) {
      const narrow = layout === 'narrow';
      const config = narrow ? s.config : { ...s.config, layout };
      let card = null;
      for (const [scen] of scenarios) {
        const hass = hassOf(toStates(s.states(scen)), s.registry || {}, s.energy, s);
        const name = `demo ${i} ${layout} ${scen}`;
        if (only) { if (want(name)) { const c = mount(config, hass, narrow); await settled(c); checkDrawing(c, name); } continue; }
        if (!card) card = mount(config, hass, narrow); else card.hass = hass;
        record(name, await settled(card));
        if (!dump) { checkDrawing(card, name); checkFits(card, name); }
      }
      if (card) card.remove();
    }
  }

  /* ---------- 2. generated combinations ---------- */
  // New strategies go at the end, so the existing cases keep their index and with it their source type and layout.
  const STORAGE = ['direct', 'parallel', 'series', 'series-fixed', 'combined'];
  const DHW = ['none', 'tank', 'solar'];
  const SOURCES = ['air', 'brine', 'water'];
  const EMITTERS = ['underfloor', 'radiator', 'column'];
  const STATES = ['heat', 'dhw', 'defrost', 'idle', 'cool', 'sniff', 'pumps', 'heat1off'];
  const combos = [];
  // A combined storage always holds the hot water.
  for (const storage of STORAGE) for (const dhw of DHW.filter((x) => storage !== 'combined' || x !== 'none')) for (const primary of [false, true]) for (let hcs = 1; hcs <= 6; hcs++) combos.push({ storage, dhw, primary, hcs });
  // Hot-water preparation (dhw_type), appended for the same reason: a fresh-water station on the parallel buffer or the combined
  // storage ("fws"), a tank in the combined storage ("tit").
  for (const [storage, dhw] of [['parallel', 'fws'], ['combined', 'fws'], ['combined', 'tit']]) for (const primary of [false, true]) for (let hcs = 1; hcs <= 6; hcs++) combos.push({ storage, dhw, primary, hcs });
  // Representative second-generator layouts: direct, parallel buffer and combined storage, with and without a primary pump.
  combos.push({ storage: 'direct', dhw: 'tank', primary: false, hcs: 1, boiler: true });
  combos.push({ storage: 'parallel', dhw: 'tank', primary: true, hcs: 2, boiler: true });
  combos.push({ storage: 'combined', dhw: 'fws', primary: false, hcs: 3, boiler: true });
  // Sensorless parallel buffers (#266), appended so every older generated case keeps its index, source type and layout.
  for (const dhw of DHW) for (const primary of [false, true]) for (let hcs = 1; hcs <= 6; hcs++) combos.push({ storage: 'parallel-empty', dhw, primary, hcs });

  // A synthetic installation without preset: every entity is mapped by hand, so the case shows exactly the parts it names.
  const installation = (c, idx) => {
    const ent = {
      mode: 'sensor.t_mode', compressor: 'binary_sensor.t_compressor', power: 'sensor.t_power', flow: 'sensor.t_flow', return: 'sensor.t_return',
      volume: 'sensor.t_volume', outdoor: 'sensor.t_outdoor', room: 'sensor.t_room', room_target: 'sensor.t_room_target',
    };
    const config = { entities: ent, source_type: SOURCES[idx % 3], hc_count: c.hcs, layout: HFC_LAYOUTS[idx % HFC_LAYOUTS.length] };
    if (c.dhw !== 'none') Object.assign(ent, { valve: 'binary_sensor.t_valve', dhw_top: 'sensor.t_dhw_top', dhw_bottom: 'sensor.t_dhw_bottom' });
    if (c.dhw !== 'none' && idx % 2) ent.dhw_middle = 'sensor.t_dhw_middle';
    if (c.dhw === 'solar') Object.assign(ent, { solar_collector: 'sensor.t_collector', solar_pump: 'binary_sensor.t_solar_pump' });
    if (['parallel', 'combined'].includes(c.storage)) Object.assign(ent, { buffer_top: 'sensor.t_buffer_top', buffer_bottom: 'sensor.t_buffer_bottom' });
    if (c.storage === 'parallel-empty') config.buffer = true;
    if (c.storage === 'combined') config.storage = 'combined';
    if (c.dhw === 'fws') config.dhw_type = 'fresh_water';
    if (c.dhw === 'tit') config.dhw_type = 'tank_in_tank';
    if (c.storage.startsWith('series')) config.series_buffer = true;
    if (c.storage === 'series-fixed') config.series_bypass = false;
    if (c.primary) config.primary_pump = true;
    if (c.boiler) Object.assign(ent, { boiler_state: 'binary_sensor.t_boiler', boiler_power: 'sensor.t_boiler_power', boiler_flow: 'sensor.t_boiler_flow' });
    if (idx % 5 === 1) ent.heater = 'sensor.t_heater';
    if (idx % 5 === 2 && c.dhw !== 'none') ent.dhw_heater = 'sensor.t_dhw_heater';
    if (idx % 5 === 3 && ['parallel', 'parallel-empty', 'combined'].includes(c.storage)) ent.buffer_heater = 'sensor.t_buffer_heater';
    if (idx % 4 === 1) Object.assign(ent, { pv: 'sensor.t_pv', battery: 'sensor.t_battery', grid: 'sensor.t_grid' });
    if (idx % 4 === 1) config.power_sources = 'manual';
    for (let n = 1; n <= c.hcs; n++) {
      const k = (key) => (n === 1 ? `hc_${key}` : `hc${n}_${key}`);
      Object.assign(ent, { [k('flow')]: `sensor.t_hc${n}_flow`, [k('return')]: `sensor.t_hc${n}_return`, [k('pump')]: `binary_sensor.t_hc${n}_pump` });
      if (n > 1) config[`hc${n}_type`] = EMITTERS[(idx + n) % 3];
    }
    if (c.hcs === 1) config.hc_type = EMITTERS[idx % 3];
    return config;
  };
  const statesOf = (c, st) => {
    const run = !['idle', 'sniff', 'pumps'].includes(st);
    const mode = { heat: 'heating', dhw: 'dhw', defrost: 'defrost', idle: 'idle', cool: 'cooling', sniff: 'idle', pumps: 'idle', heat1off: 'heating' }[st];
    const out = {
      'sensor.t_mode': mode, 'binary_sensor.t_compressor': run && st !== 'defrost' ? 'on' : 'off',
      'sensor.t_power': [run ? '1400' : '8', 'W'], 'sensor.t_flow': [st === 'cool' ? '18' : st === 'dhw' ? '52' : '36', '°C'],
      'sensor.t_return': [st === 'cool' ? '22' : st === 'dhw' ? '45' : '30', '°C'], 'sensor.t_volume': [run ? '900' : st === 'sniff' ? '120' : '0', 'L/h'],
      'sensor.t_outdoor': ['3', '°C'], 'sensor.t_room': ['21.2', '°C'], 'sensor.t_room_target': ['21', '°C'],
      'binary_sensor.t_valve': st === 'dhw' ? 'on' : 'off', 'sensor.t_dhw_top': ['49', '°C'], 'sensor.t_dhw_middle': ['44', '°C'], 'sensor.t_dhw_bottom': ['38', '°C'],
      'sensor.t_collector': ['61', '°C'], 'binary_sensor.t_solar_pump': ['dhw', 'idle'].includes(st) ? 'on' : 'off',
      'sensor.t_buffer_top': ['34', '°C'], 'sensor.t_buffer_bottom': ['29', '°C'],
      'sensor.t_heater': st === 'defrost' ? '1' : '0', 'sensor.t_dhw_heater': st === 'dhw' ? '1' : '0', 'sensor.t_buffer_heater': st === 'defrost' ? '2' : '0',
      'sensor.t_pv': ['2100', 'W'], 'sensor.t_battery': ['0', 'W'], 'sensor.t_grid': [run ? '300' : '0', 'W'],
      'binary_sensor.t_boiler': c.boiler && ['heat', 'idle'].includes(st) ? 'on' : 'off', 'sensor.t_boiler_power': [c.boiler && ['heat', 'idle'].includes(st) ? '8000' : '0', 'W'],
      'sensor.t_boiler_flow': ['52', '°C'],
    };
    for (let n = 1; n <= c.hcs; n++) {
      out[`sensor.t_hc${n}_flow`] = [String(st === 'cool' ? 18 : 34 - n), '°C'];
      out[`sensor.t_hc${n}_return`] = [String(st === 'cool' ? 22 : 29 - n), '°C'];
      // The last of several circuits stays off while heating, so running and stopped circuits meet in one drawing. The circuit
      // pumps keep running while the tank is charged (blocked by the diverter valve without a parallel buffer), stand still while
      // the primary pump sniffs, and run alone while the heat pump idles ("pumps"). In "heat1off" the first circuit stands while the
      // others heat, so the trunk they share with it must flow on its own.
      const on = ['heat', 'cool', 'defrost', 'dhw', 'pumps', 'heat1off'].includes(st);
      out[`binary_sensor.t_hc${n}_pump`] = on && !(st === 'heat' && n > 1 && n === c.hcs) && !(st === 'heat1off' && n === 1) ? 'on' : 'off';
    }
    return out;
  };

  /* ---------- invariants ---------- */
  const visible = (el, svg) => {
    for (let n = el; n && n !== svg; n = n.parentNode) {
      const cs = getComputedStyle(n);
      if (cs.display === 'none' || cs.visibility === 'hidden') return false;
    }
    return true;
  };
  // The shapes of the schematic with their boxes and, for pipes, the end points of every sub-path (local and schematic coordinates).
  const scene = (svg) => {
    // Same matrix as rootBox (drawing-collisions.js), so pipe ends and shape boxes share one coordinate system in every browser.
    const toRoot = (el) => schematicMatrix(el, svg);
    const shapes = [...svg.querySelectorAll('path, rect, circle, ellipse, line, polyline, polygon')]
      .filter((el) => !el.classList.contains('flow') && !el.classList.contains('eflow') && visible(el, svg))
      .map((el) => ({ el, box: rootBox(el, svg), pipe: el.classList.contains('pipe') }));
    for (const s of shapes.filter((x) => x.pipe)) {
      const m = toRoot(s.el);
      s.ends = s.el.getAttribute('d').split(/(?=M)/).filter((d) => d.trim()).flatMap((d) => {
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d); s.el.parentNode.appendChild(p);
        const pts = [p.getPointAtLength(0), p.getPointAtLength(p.getTotalLength())].map((q) => ({ x: q.x, y: q.y }));
        p.remove();
        return pts.map((pt) => ({ pt, at: new DOMPoint(pt.x, pt.y).matrixTransform(m) }));
      });
    }
    return shapes;
  };
  // Whether the end point `e` of pipe `from` lies on the stroke or in the fill of shape `s` (2 units tolerance).
  const touches = (s, from, e, svg) => {
    const { box } = s; const { x, y } = e.at;
    if (x < box.l - 8 || x > box.r + 8 || y < box.t - 8 || y > box.b + 8) return false;
    const m = s.el.getCTM().inverse().multiply(from.el.getCTM());
    const fill = s.el.tagName !== 'path' || getComputedStyle(s.el).fill !== 'none';
    return [[0, 0], [2, 0], [-2, 0], [0, 2], [0, -2]].some(([dx, dy]) => {
      const p = new DOMPoint(e.pt.x + dx, e.pt.y + dy).matrixTransform(m);
      const sp = svg.createSVGPoint(); sp.x = p.x; sp.y = p.y;
      try { return s.el.isPointInStroke(sp) || (fill && s.el.isPointInFill(sp)); } catch (err) { return false; }
    });
  };
  const at = (s, e) => `${s.el.id}@${Math.round(e.at.x)},${Math.round(e.at.y)}`;
  const COMPONENTS = '#hp-box, rect.boiler-box, rect.tank, rect.fws, circle.valve, circle.pump, rect.radiator, rect.screed, rect.collector, path.house';
  // Components that sit on each other by design: the solar collector lies on the roof of the house.
  const ON_TOP = [['collector', 'house']];
  const kind = (el) => el.id || el.getAttribute('class');
  const invariants = (card, label) => {
    const root = card.shadowRoot; const svg = root.getElementById('svg');
    check(!card._failed && !!svg, `${label}: renders`);
    if (!svg) return;
    const vb = svg.viewBox.baseVal;
    const shapes = scene(svg);
    // every pipe ends at another pipe or a component
    const loose = [];
    for (const p of shapes.filter((s) => s.pipe)) for (const e of p.ends) if (!shapes.some((s) => s !== p && touches(s, p, e, svg))) loose.push(at(p, e));
    check(!loose.length, `${label}: every pipe ends at a pipe or a component (${loose.join(' ')})`);
    // components do not overlap (touching edges are fine)
    const comps = [...svg.querySelectorAll(COMPONENTS)].filter((el) => visible(el, svg)).map((el) => [el, rootBox(el, svg)]);
    const hits = [];
    comps.forEach(([a, ba], n) => comps.slice(n + 1).forEach(([b, bb]) => {
      if (a.contains(b) || b.contains(a) || ON_TOP.some(([x, y]) => [kind(a), kind(b)].sort().join() === [x, y].sort().join())) return;
      if (boxesOverlap(ba, bb)) hits.push(`${kind(a)}×${kind(b)}`);
    }));
    check(!hits.length, `${label}: components do not overlap (${hits.join(' ')})`);
    // everything stays inside the drawing
    const out = shapes.filter(({ box: b }) => b.l < vb.x - 1 || b.t < vb.y - 1 || b.r > vb.x + vb.width + 1 || b.b > vb.y + vb.height + 1);
    check(!out.length, `${label}: the drawing stays inside the view box ${vb.width}×${vb.height} (${out.map((s) => kind(s.el)).join(' ')})`);
    // one tab stop, every part a labelled button
    const parts = [...svg.querySelectorAll('[data-entity][tabindex]')];
    check(parts.filter((el) => el.getAttribute('tabindex') === '0').length === 1, `${label}: the schematic is one tab stop`);
    check(parts.every((el) => el.getAttribute('role') === 'button' && (el.getAttribute('aria-label') || '').trim()), `${label}: every part is a labelled button`);
    return shapes;
  };
  // A flowing pipe must continue in another flowing pipe or end at a component, never at a closed pipe.
  const flowing = (shapes, label, svg) => {
    const dead = [];
    for (const p of shapes.filter((s) => s.pipe && s.el.classList.contains('on'))) {
      for (const e of p.ends) {
        const ok = shapes.some((s) => s !== p && (!s.pipe || s.el.classList.contains('on')) && touches(s, p, e, svg));
        if (!ok) dead.push(at(p, e));
      }
    }
    check(!dead.length, `${label}: flowing pipes do not end at closed pipes (${dead.join(' ')})`);
  };

  if (!sweep) for (const [idx, c] of combos.entries()) {
    const config = installation(c, idx);
    const name = `combo ${c.storage} ${c.dhw} ${c.primary ? 'pp' : 'nopp'} hc${c.hcs}${c.boiler ? ' boiler' : ''}`;
    let card = null; let shapes = null; let lastSvg;
    // Hot-water operation only where a tank is drawn.
    for (const st of STATES.filter((x) => x !== 'dhw' || c.dhw !== 'none')) {
      const hass = hassOf(toStates(statesOf(c, st)));
      if (only) { if (want(`${name} ${st}`)) { const o = mount(config, hass); await settled(o); checkDrawing(o, `${name} ${st}`); } continue; }
      if (!card) card = mount(config, hass); else card.hass = hass;
      const d = await settled(card);
      record(`${name} ${st}`, d);
      if (dump) continue;
      checkDrawing(card, `${name} ${st} (${config.source_type}, ${config.layout})`);
      checkFits(card, `${name} ${st}`);
      // A state update can rebuild the schematic. Only reuse live shapes from the same SVG.
      const svg = card.shadowRoot.getElementById('svg');
      if (svg !== lastSvg) shapes = invariants(card, `${name} ${st} (${config.source_type}, ${config.layout})`);
      if (shapes) flowing(shapes, `${name} ${st}`, svg);
      lastSvg = svg;
    }
    if (card) card.remove();
  }

  // Each wall can carry a plain rod and one at each sensor height. Exhaust the subsets
  // on both walls independently of the snapshot rotation, including every combination
  // of solar and hot-water preparation that can occupy the same wall.
  if (!dump && !sweep) {
    for (const [storage, dhw] of [['parallel', 'tank'], ['parallel', 'fws'], ['combined', 'tank'], ['combined', 'fws'], ['combined', 'tit']]) {
      const station = storage === 'parallel' && dhw === 'fws';
      for (const solar of station ? [false] : [false, true]) for (let mask = 0; mask < 16; mask++) {
        const c = { storage, dhw, hcs: mask % 2 ? 6 : 1, primary: true, boiler: true };
        const config = installation(c, mask);
        config.language = mask % 2 ? 'de' : 'en';
        config.narrow_values = true;
        config.hc_return_label = true;
        config.buffer_values = 'equal';
        const ent = config.entities;
        Object.assign(ent, { dhw_middle: 'sensor.t_dhw_middle', buffer_middle: 'sensor.t_buffer_middle', hc_mixer: 'sensor.t_mix',
          hc_setpoint: 'sensor.t_set', hc_pressure: 'sensor.t_pressure', room_humidity: 'sensor.t_humidity' });
        if (solar) Object.assign(ent, { solar_collector: 'sensor.t_collector', solar_pump: 'binary_sensor.t_solar_pump' });
        const suffixes = ['', '_top', '_middle', '_bottom'];
        const present = suffixes.filter((_, i) => mask & (1 << i));
        for (const tank of ['dhw', 'buffer']) {
          delete ent[`${tank}_heater`];
          for (const suffix of present) ent[`${tank}_heater${suffix}`] = 'binary_sensor.t_rod';
        }
        const name = `wall ${storage} ${dhw} solar=${solar} rods=${mask} ${config.language} ${config.layout} hc${c.hcs}`;
        let card;
        for (const mode of ['heat', 'cool'].filter((m) => want(`${name} ${m}`))) {
          const hass = hassOf(toStates({ ...statesOf(c, mode), 'sensor.t_buffer_middle': ['33', '°C'], 'binary_sensor.t_rod': 'on',
            'sensor.t_mix': ['85', '%'], 'sensor.t_set': ['35', '°C'], 'sensor.t_pressure': ['1.8', 'bar'], 'sensor.t_humidity': ['72', '%'] }));
          if (!card) card = mount(config, hass, mask % 3 === 0); else card.hass = hass;
          check(card.shadowRoot.querySelectorAll('.heater-flange').length === present.length * (station ? 1 : 2), `${name}: configured rods drawn`);
          checkDrawing(card, `${name} ${mode}`);
        }
        if (card) done(card);
      }
    }
  }

  /* ---------- 3. longest texts and widest values (pseudo-localisation) ---------- */
  // Everything above runs in English with short values. Labels collide where a translation, a value or a name is longer, so this
  // pass draws every demo and every combination once more with, for each text, the longest translation of all built-in languages
  // (a new language is included without a change here), wide but realistic values and long circuit names. Collision checks only:
  // nothing of this pass enters the snapshot.
  if (!dump) {
    for (const [i, s] of setups.entries()) {
      for (const layout of [...HFC_LAYOUTS, 'narrow']) {
        const narrow = layout === 'narrow';
        const config = named(narrow ? s.config : { ...s.config, layout });
        let card = null;
        for (const [scen] of scenarios) {
          const hass = hassOf(toStates(widen(s.states(scen))), s.registry || {}, s.energy, s);
          const name = `${LONG}: demo ${i} ${layout} ${scen}`;
          if (only) { if (want(name)) { const o = mount(config, hass, narrow); await settled(o); checkDrawing(o, name); } continue; }
          if (!card) card = mount(config, hass, narrow); else card.hass = hass;
          await settled(card);
          checkDrawing(card, name);
        }
        if (card) card.remove();
      }
    }
    for (const [idx, c] of combos.entries()) {
      const config = named(installation(c, idx));
      const narrow = idx % 2 === 1;
      const name = `${LONG}: combo ${c.storage} ${c.dhw} ${c.primary ? 'pp' : 'nopp'} hc${c.hcs}${c.boiler ? ' boiler' : ''} ${narrow ? 'narrow' : config.layout}`;
      let card = null;
      for (const st of ['heat', 'dhw', 'cool'].filter((x) => x !== 'dhw' || c.dhw !== 'none')) {
        const hass = hassOf(toStates(widen(statesOf(c, st))));
        if (only) { if (want(`${name} ${st}`)) { const o = mount(config, hass, narrow); await settled(o); checkDrawing(o, `${name} ${st}`); } continue; }
        if (!card) card = mount(config, hass, narrow); else card.hass = hass;
        await settled(card);
        checkDrawing(card, `${name} ${st}`);
      }
      if (card) card.remove();
    }
  }

  /* ---------- 4. zone matrices ---------- */
  // Labels only compete inside a zone. The circuit row and the heat source each get every combination of the options that put
  // labels into them, once in English (labels must also fit their budgets) and once with the longest texts and widest values.
  // The rest of the drawing stays fixed; layouts and narrow cards rotate through the cases. Collision checks only, no snapshot.
  if (!dump) {
    const LAYOUTS = [...HFC_LAYOUTS, 'narrow'];
    const placed = (config, idx) => {
      const layout = LAYOUTS[idx % LAYOUTS.length];
      if (layout === 'narrow') { delete config.layout; return true; }
      config.layout = layout; return false;
    };
    // Circuit row: emitter × mixer × curve shift × pressure × return label × flow label × one circuit or a further one × buffer.
    // With two circuits the second gets the same options (keys that only exist for the first circuit stay on the first).
    let idx = 0;
    for (const emitter of EMITTERS) for (const mixer of [false, true]) for (const curve of [false, true]) for (const pressure of [false, true])
      for (const ret of [false, true]) for (const flow of [true, false]) for (const hcs of [1, 2]) for (const buffer of [false, true]) {
        const c = { storage: buffer ? 'parallel' : 'direct', dhw: 'tank', primary: false, hcs };
        const config = installation(c, 0);
        const narrow = placed(config, idx);
        const ent = config.entities;
        const extra = { 'sensor.t_mix': ['85', '%'], 'binary_sensor.t_mix_open': 'on', 'sensor.t_curve': ['-2.5', 'K'], 'sensor.t_pressure': ['1.8', 'bar'] };
        for (let n = 1; n <= hcs; n++) {
          const k = (key) => (n === 1 ? `hc_${key}` : `hc${n}_${key}`);
          config[n === 1 ? 'hc_type' : `hc${n}_type`] = emitter;
          Object.assign(ent, { [k('setpoint')]: `sensor.t_hc${n}_set`, [k('mode')]: `sensor.t_hc${n}_mode`, [n === 1 ? 'room' : `hc${n}_room`]: `sensor.t_hc${n}_room`,
            [n === 1 ? 'room_target' : `hc${n}_room_target`]: `sensor.t_hc${n}_room_target` });
          Object.assign(extra, { [`sensor.t_hc${n}_set`]: ['35', '°C'], [`sensor.t_hc${n}_mode`]: 'Heating', [`sensor.t_hc${n}_room`]: ['21.4', '°C'], [`sensor.t_hc${n}_room_target`]: ['21.5', '°C'] });
          if (mixer) Object.assign(ent, { [k('mixer')]: 'sensor.t_mix', [k('mixer_opening')]: 'binary_sensor.t_mix_open' });
          if (curve) ent[k('curve_offset')] = 'sensor.t_curve';
        }
        if (pressure) ent.hc_pressure = 'sensor.t_pressure';
        if (ret) config.hc_return_label = true;
        if (!flow) config.hc_flow_label = false;
        const name = `zone circuit ${emitter}${mixer ? ' mixer' : ''}${curve ? ' curve' : ''}${pressure ? ' pressure' : ''}${ret ? ' return' : ''}${flow ? '' : ' noflow'} hc${hcs}${buffer ? ' buffer' : ''} ${narrow ? 'narrow' : config.layout}`;
        if (!sweep) await probe(name, config, { ...statesOf(c, 'heat'), ...extra }, { narrow, english: true });
        const long = { ...widen({ ...statesOf(c, idx % 2 ? 'cool' : 'heat'), ...extra }), 'sensor.t_hc1_mode': 'Komfortbetrieb Heizen', 'sensor.t_hc2_mode': 'Komfortbetrieb Heizen' };
        await probe(`${LONG}: ${name}`, named(config), long, { narrow });
        idx++;
      }
    // Heat source: source type × unit drawing (air only; brine and water draw the loop) × brine pressure × spread × source flow.
    const UNITS = [...HFC_UNIT_STYLES.filter((u) => u !== 'auto').flatMap((u) => (u === 'vaillant' ? HFC_UNIT_SIZES.map((size) => [u, size])
      : u === 'panasonic' ? [[u, 'medium'], [u, 'large']] : [[u]]))];
    idx = 0;
    for (const source of SOURCES) for (const [unit, size] of source === 'air' ? UNITS : [['generic']]) for (const pressure of [false, true])
      for (const spread of [true, false]) for (const volume of [false, true]) {
        const c = { storage: 'parallel', dhw: 'tank', primary: true, hcs: 1 };
        const config = installation(c, 0);
        const narrow = placed(config, idx);
        Object.assign(config, { source_type: source, unit_style: unit, ...(size ? { unit_size: size } : {}) });
        if (!spread) config.source_spread = false;
        Object.assign(config.entities, { source_in: 'sensor.t_src_in', source_out: 'sensor.t_src_out' });
        if (pressure) config.entities.brine_pressure = 'sensor.t_brine_pressure';
        if (volume) config.entities.source_volume = 'sensor.t_src_volume';
        const extra = { 'sensor.t_src_in': ['4.2', '°C'], 'sensor.t_src_out': ['1.1', '°C'], 'sensor.t_brine_pressure': ['1.6', 'bar'], 'sensor.t_src_volume': ['1650', 'L/h'] };
        const name = `zone source ${source} ${unit}${size ? `-${size}` : ''}${pressure ? ' pressure' : ''}${spread ? '' : ' nospread'}${volume ? ' volume' : ''} ${narrow ? 'narrow' : config.layout}`;
        if (!sweep) await probe(name, config, { ...statesOf(c, 'heat'), ...extra }, { narrow, english: true });
        await probe(`${LONG}: ${name}`, named(config), widen({ ...statesOf(c, idx % 2 ? 'defrost' : 'heat'), ...extra }), { narrow });
        idx++;
      }
  }

  /* ---------- 5. field cases ---------- */
  // Installations from layout bug reports (test/field-cases.js, made by scripts/report-fixture.mjs): as reported, as a narrow
  // card and with long texts and wide values. The preset only lends its unit drawing; every entity is mapped in the case.
  if (!dump) {
    for (const f of window.HFC_FIELD_CASES || []) {
      const config = { ...f.config };
      if (!config.unit_style && HFC_PRESETS[f.preset]?.unit_style) config.unit_style = HFC_PRESETS[f.preset].unit_style;
      const name = `field #${f.issue} ${f.name}`;
      if (!sweep) {
        await probe(`${name} ${config.layout || 'default'}`, config, f.states, { energy: f.energy });
        const narrow = { ...config }; delete narrow.layout;
        await probe(`${name} narrow`, narrow, f.states, { narrow: true, energy: f.energy });
      }
      await probe(`${LONG}: ${name}`, named(config), widen(f.states), { energy: f.energy });
    }
  }

  /* ---------- result ---------- */
  if (dump || (update && !fails.length)) {
    document.getElementById('dump').textContent = JSON.stringify(results);
    document.getElementById('result').textContent = 'DUMPED';
    document.title = `DUMPED: ${Object.keys(results).length} cases`;
    return;
  }
  if (!update) check(!!base, 'snapshot baseline test/topology-snapshot.js is loaded');
  if (!only && !sweep) KNOWN.forEach((x, k) => check(x.sweepOnly || knownSeen.has(k), `known conflict no longer occurs, remove it from KNOWN: ${x.why}`));
  // The first changed cases are written out in full, so they can be compared with `topology-snapshot.mjs --out` of another state.
  let changed = '';
  if (!update && base && !only && !sweep) {
    for (const [key, value] of Object.entries(results)) {
      if (!(key in base)) { check(false, `snapshot: new case ${key} (update the baseline)`); continue; }
      const [g, s] = value.split(' '); const [bg, bs] = base[key].split(' ');
      check(g === bg, `snapshot: geometry of ${key} changed`);
      check(s === bs, `snapshot: state of ${key} changed`);
      if (full[key]) changed += `\n\nChanged case ${key} (${g !== bg ? 'geometry' : 'state'}):\n${(g !== bg ? full[key].geo : full[key].state).join('\n')}`;
    }
    for (const key of Object.keys(base)) if (!(key in results)) check(false, `snapshot: case ${key} is gone (update the baseline)`);
  }
  const res = document.getElementById('result');
  res.textContent = fails.length ? 'FAIL' : 'PASS';
  document.getElementById('log').textContent = `${checks} checks, ${Object.keys(results).length} snapshot cases\n${fails.map((f) => `FAIL ${f}`).join('\n')}${changed}`;
  document.title = `${fails.length ? 'FAIL' : 'PASS'}: ${checks} checks`;
})().catch((e) => {
  document.getElementById('result').textContent = 'FAIL';
  document.getElementById('log').textContent = `Error: ${e.stack || e}`;
  document.title = 'FAIL: error';
});
</script>
</body>
</html>
